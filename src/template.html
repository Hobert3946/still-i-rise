<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M10.5 20.5l-2-6.5-6.5-2 6.5-2 2-6.5 2 6.5 6.5 2-6.5 2zM21 9l-1-3-3-1 3-1 1-3 1 3 3 1-3 1z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
<symbol id="i-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
<symbol id="i-dumb" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></symbol>
<symbol id="i-fork" viewBox="0 0 24 24"><path d="M6 3v7a2 2 0 0 0 4 0V3M8 3v18M17 21V3c-2.2 1.2-3.5 3.6-3.5 7 0 2.2 1.2 3 3.5 3"/></symbol>
<symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
<symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15"/><path d="M5 19 13 11"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M4 3h16"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>

<symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></symbol>

<a class="skip" href="#v-deck">Pular para o conteúdo</a>

<header class="top glass-header"><div class="top-in" style="justify-content: space-between; align-items: center;">
  <div class="who" style="display:flex; align-items:center; gap:12px;">
    <img class="avatar" src="%%AVATAR%%" alt="Avatar" width="48" height="48" style="border: 2px solid var(--accent); border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <div style="display:flex; flex-direction:column;">
      <div class="lbl greeting-text" id="topGreeting" style="font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;">Olá</div>
      <div style="font-weight:800; font-size:18px; font-family:var(--f-display); letter-spacing:-0.5px; color:var(--text);" id="topName">Praticante</div>
    </div>
  </div>
  
  <div style="display:flex; align-items:center; gap:15px;">
    <div style="text-align:right;">
      <div style="font-weight:700; font-size:20px; font-variant-numeric:tabular-nums; font-family:var(--f-display); color:var(--text);" id="topClock">--:--</div>
      <div class="lbl" style="font-size:10px; color:var(--accent);">HOJE</div>
    </div>
    <button class="circ-btn" id="themeBtn" aria-label="Alternar tema claro/escuro" style="width:40px; height:40px; box-shadow:none; border: 1px solid var(--line); background: var(--surface2);">
      <svg class="icon"><use href="#i-sun"/></svg>
    </button>
  </div>
</div></header>


<main>
  <div class="view on" id="v-deck"></div>
  <div class="view" id="v-ia"></div>
  <div class="view" id="v-treino"></div>
  <div class="view" id="v-agua"></div>
  <div class="view" id="v-comer"></div>
  <div class="view" id="v-evol"></div>
  <div class="view" id="v-mais"></div>
</main>

<nav class="dock" aria-label="Navegação">
  <button class="tab on" data-tab="deck"><svg class="icon"><use href="#i-dash"/></svg>Deck</button>
  <button class="tab" data-tab="treino"><svg class="icon"><use href="#i-dumb"/></svg>Treino</button>
  <button class="tab" data-tab="agua"><svg class="icon dropicon"><path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z" fill="url(#dropg)"/></svg>Água</button>
  <button class="tab" data-tab="comer"><svg class="icon"><use href="#i-fork"/></svg>Comer</button>
  <button class="tab" data-tab="evol"><svg class="icon"><use href="#i-trend"/></svg>Evolução</button>
  <button class="tab" data-tab="ia"><svg class="icon"><use href="#i-sparkles"/></svg>A.I.</button>
  <button class="tab" data-tab="mais"><svg class="icon"><use href="#i-user"/></svg>Mais</button>
</nav>

<div class="screen" id="screen-wk"><div class="in" id="wk-body"></div></div>
<div class="overlay" id="sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="Detalhes"></div></div>
<div class="overlay center" id="rest" role="dialog" aria-modal="true" aria-label="Cronômetro de descanso"><div class="rest" id="rest-in"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
function sirReset(){var p=navigator.serviceWorker?navigator.serviceWorker.getRegistrations():Promise.resolve([]);p.then(function(rs){rs.forEach(function(r){r.unregister()});return window.caches?caches.keys():[]}).then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(function(){location.reload()})}
window.addEventListener("error",function(){var d=document.getElementById("v-deck");if(d&&!d.innerHTML.trim()){d.innerHTML='<div class="card" style="margin:20px"><h2 class="mid">Algo travou ao abrir o app</h2><p class="muted">Toque abaixo para limpar o cache e recarregar. Seus dados salvos não são apagados.</p><button class="btn solid full" onclick="sirReset()">Limpar cache e recarregar</button></div>'}});
</script>
<script>
/*JS*/
</script>


<!-- Modais: cardio e resumo semanal (ações via data-act, sem onclick inline) -->
<div class="overlay center" id="cardioSheet" role="dialog" aria-modal="true" aria-label="Registrar cardio">
  <div class="card" style="width:90%;max-width:350px">
    <h3 class="mid">Registrar cardio</h3>
    <input type="number" inputmode="decimal" id="cardioMins" placeholder="Minutos" class="field" aria-label="Minutos">
    <input type="number" inputmode="decimal" id="cardioSpd" placeholder="Velocidade (km/h)" class="field" aria-label="Velocidade em km/h">
    <input type="number" inputmode="decimal" id="cardioInc" placeholder="Inclinação (%)" class="field" aria-label="Inclinação em porcentagem">
    <div class="row" style="gap:10px"><button class="btn ghost grow" data-act="cardio-close">Cancelar</button><button class="btn solid grow" data-act="cardio-save">Salvar</button></div>
  </div>
</div>

<div class="overlay center" id="reviewSheet" role="dialog" aria-modal="true" aria-label="Resumo da semana">
  <div class="card" style="width:90%;max-width:350px;text-align:center">
    <h2 class="h1">Resumo da semana</h2>
    <p class="muted">Últimos 7 dias</p>
    <div class="grid2"><div class="tile"><div class="big" id="revP">0 g</div><div class="lbl">Proteína/dia</div></div><div class="tile"><div class="big" id="revC">0 min</div><div class="lbl">Cardio</div></div></div>
    <div class="tile in"><div class="mid" id="revW"></div><div class="muted" id="revSug" style="margin-top:6px"></div></div>
    <button class="btn solid full" data-act="review-close">Entendido</button>
  </div>
</div>

</body>
</html>
