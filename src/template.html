<script>
function sirReset(){var p=navigator.serviceWorker?navigator.serviceWorker.getRegistrations():Promise.resolve([]);p.then(function(rs){rs.forEach(function(r){r.unregister()});return window.caches?caches.keys():[]}).then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(function(){location.reload()})}
window.addEventListener("error",function(){var d=document.getElementById("river");if(d&&!d.innerHTML.trim()){d.innerHTML='<div class="card" style="margin:80px 16px"><h2 class="h3">Algo travou ao abrir o app</h2><p class="muted">Toque abaixo para limpar o cache e recarregar. Seus dados salvos não são apagados.</p><br><button class="btn solid full" id="sirResetBtn">Limpar cache e recarregar</button></div>';document.getElementById("sirResetBtn").addEventListener("click",sirReset)}});
</script>
