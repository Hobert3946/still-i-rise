function nextStart(days, hhmm) {
  const [h, m] = hhmm.split(":").map(Number), now = new Date(), c = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);
  const ok = d => !days || days.split(",").includes(DAYCODE[d.getDay()]);
  if (c <= now) c.setDate(c.getDate() + 1);
  while (!ok(c)) c.setDate(c.getDate() + 1);
  return c;
}
const icsLocal = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}T${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}00`;
const icsEsc = s => s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
function buildICS(sel) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z/, "Z");
  const ev = sel.map(({ id, t }) => {
    const r = REMS.find(x => x[0] === id), days = r[3], st = nextStart(days, t), en = new Date(st.getTime() + 10 * 60000);
    const title = REM_TITLE[id] || "Still I Rise: água";
    return ["BEGIN:VEVENT", `UID:sir-${id}@still-i-rise`, `DTSTAMP:${stamp}`, `DTSTART:${icsLocal(st)}`, `DTEND:${icsLocal(en)}`,
      `RRULE:FREQ=${days ? "WEEKLY;BYDAY=" + days : "DAILY"}`, `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(r[4])}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(title)}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT"].join("\r\n");
  });
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Still I Rise//PT-BR//", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Still I Rise", ...ev, "END:VCALENDAR"].join("\r\n") + "\r\n";
}

  const cfg = {}, sel = [];
  REMS.forEach(([id, , def]) => {

/* ---- pilha de camadas: cada camada aberta vira uma entrada no histórico (o "voltar" do celular fecha a de cima) ---- */
const STACK = [], HIDE = {};
const syncInert = () => ["#top", "#view", "#tabbar"].forEach(s => { const e = $(s); if (e) e.inert = STACK.length > 0; });
let skipPop = 0;
function pushLayer(id) {
  if (STACK.includes(id)) return;
  STACK.push(id); document.body.classList.add("lock"); syncInert();
  try { history.pushState({ layer: id }, ""); } catch (e) { }
}
function dropLayer(id, fromPop) {
  const i = STACK.lastIndexOf(id); if (i < 0) return;
  STACK.splice(i, 1); HIDE[id]();
  if (!STACK.length) document.body.classList.remove("lock");
  syncInert();
  if (!fromPop) { skipPop++; try { history.back(); } catch (e) { skipPop--; } }
}
window.addEventListener("popstate", () => {
  if (skipPop) { skipPop--; return; }
  const top = STACK[STACK.length - 1]; if (top) dropLayer(top, true);
});
function closeAll() { while (STACK.length) dropLayer(STACK[STACK.length - 1]); }
const scrimSync = () => $("#scrim").classList.toggle("on", STACK.some(x => x === "sheet" || x === "actions"));

/* ---- seções (barra de baixo) ---- */
function go(tab, seg) {

const segBar = (tab, opts) => `<div class="segbar" role="tablist" aria-label="Partes">${opts.map(([k, n]) => `<button role="tab" class="${UI.seg[tab] === k ? "on" : ""}" aria-selected="${UI.seg[tab] === k}" data-act="seg" data-seg="${k}">${n}</button>`).join("")}</div>`;

/* ---- páginas cheias (agenda, coach, ajustes) ---- */
const PAGES = {};   // cada página registra PAGES.nome = { t: "Título", r: () => html, right: () => html }
function openPage(name) { if (STACK.includes("sheet")) dropLayer("sheet"); if (STACK.includes("actions")) dropLayer("actions"); UI.page = name; $("#page").classList.add("on"); pushLayer("page"); rPage(true); }
HIDE.page = () => { $("#page").classList.remove("on"); UI.page = null; };
function rPage(first) {
  const p = PAGES[UI.page], body = $("#page-body"), y = body && !first ? body.scrollTop : 0;
  const opened = first ? [] : $$("#page details[data-fold][open]").map(e => e.dataset.fold);
  $("#page").innerHTML = `<div class="page-in"><header class="page-top"><button class="icon-btn" data-act="page-close" aria-label="Voltar">${ic("left")}</button><h2 class="h2 grow" id="page-t" tabindex="-1">${p.t}</h2>${p.right ? p.right() : ""}</header><div class="page-body" id="page-body">${p.r()}</div></div>`;
  opened.forEach(f => { const e = $(`#page details[data-fold="${f}"]`); if (e) e.open = true; });
  $("#page-body").scrollTop = y;
  if (first) { const t = $("#page-t"); if (t) t.focus({ preventScroll: true }); }
  if (p.after) p.after(first);
}
ACT.page = b => openPage(b.dataset.p);
ACT["page-close"] = () => dropLayer("page");

/* ---- painel inferior ---- */
function openSheet(html) { const s = $("#sheet"); s.innerHTML = `<button class="sheet-x icon-btn" data-act="close" aria-label="Fechar">${ic("x")}</button>` + html; s.classList.add("on"); pushLayer("sheet"); scrimSync(); s.scrollTop = 0; }
HIDE.sheet = () => { $("#sheet").classList.remove("on"); scrimSync(); };
function closeSheet() { dropLayer("sheet"); }
ACT.close = () => closeSheet();
ACT.scrim = () => { const top = STACK[STACK.length - 1]; if (top === "sheet" || top === "actions") dropLayer(top); };

/* ---- toast (com ação opcional: desfazer, aplicar sempre...) ---- */
let toastT = null;
function toast(t, fn, label = "Desfazer") {
  const e = $("#toast"); e.innerHTML = `<span>${esc(t)}</span>${fn ? `<b>${esc(label)}</b>` : ""}`;
  e.onclick = fn ? () => { clearTimeout(toastT); e.classList.remove("on", "act"); fn(); } : null;
  e.classList.toggle("act", !!fn); e.classList.add("on"); clearTimeout(toastT);
  toastT = setTimeout(() => e.classList.remove("on", "act"), fn ? 5500 : 2600);
}

/* ---- tema: auto / claro / escuro (global) ---- */
function applyTheme() {
  const t = R.theme; const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const m = $("meta[name=theme-color]"); if (m) m.content = dark ? "#0D0D0F" : "#F5F5FA";
  applyLook();
  const hr = new Date().getHours();
  document.body.dataset.hour = hr >= 4 && hr < 10 ? "morning" : hr >= 19 || hr < 4 ? "night" : "day";
}
ACT.theme = b => { R.theme = b.dataset.v; save(); applyTheme(); render(); };

/* ============ PEÇAS VISUAIS REUTILIZADAS + render geral ============ */
let RID = 0;
function ring(p, size, stroke, color, inner = "") {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - clamp(p, 0, 1));
  let defs = "";
  if (color === "grad") { const id = "rg" + (++RID); defs = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--blue)"/></linearGradient></defs>`; color = `url(#${id})`; }
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" aria-hidden="true">${defs}<circle class="trk" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"/><circle class="arc" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="c">${inner}</div></div>`;
}
const banner = (cls, icon, title, txt, extra = "") => `<div class="banner ${cls}">${ic(icon)}<div class="grow"><b>${title}</b>${txt}${extra}</div></div>`;
const mealChips = (cur, act) => `<div class="chips" role="group" aria-label="Refeição">${MEAL_NAMES.map(m => `<button class="chip ${cur === m ? "on" : ""}" data-act="${act}" data-m="${m}" aria-pressed="${cur === m}">${m}</button>`).join("")}</div>`;
const tog = (on, act, label, extra = "") => `<button class="tog ${on ? "on" : ""}" data-act="${act}" ${extra} role="switch" aria-checked="${!!on}" aria-label="${esc(label)}"><i></i></button>`;
const fold = (title, body, open = false, id = "") => `<details class="fold" ${open ? "open" : ""} ${id ? `data-fold="${id}"` : ""}><summary>${title}${ic("down")}</summary><div class="body">${body}</div></details>`;
const sec = (title, body, cls = "") => `<section class="card ${cls}">${title ? `<h3 class="lbl sec-t">${title}</h3>` : ""}${body}</section>`;

/* ============ HERO do Hoje: frase motivacional em destaque com a foto de quem escreveu ============ */
// autor da frase → página da Wikipédia (foto buscada na hora e guardada no aparelho; sem internet, iniciais)
const AUTHOR_WIKI = { "Maya Angelou": "Maya_Angelou", "Will Durant": "Will_Durant", "Ovídio": "Ovídio", "Sêneca": "Sêneca", "Epicteto": "Epicteto",
  "Marco Aurélio": "Marco_Aurélio", "Lao Tsé": "Lao_Tsé", "Fernando Pessoa": "Fernando_Pessoa", "Jim Rohn": "Jim_Rohn",
  "Rocky Balboa": "Rocky_Balboa", "Arnold Schwarzenegger": "Arnold_Schwarzenegger", "Muhammad Ali": "Muhammad_Ali" };
const authorName = a => a.split(",")[0].trim();
const initials = n => n.split(/\s+/).filter(w => w.length > 2).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "✦";
async function authorPhoto(n) {
  const t = AUTHOR_WIKI[n]; if (!t) return null;
  const k = "au:" + n, c = await photoGet(k); if (c) return c;
  try {
    const r = await fetch("https://pt.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(t)); if (!r.ok) return null;
    const u = ((await r.json()).thumbnail || {}).source; if (!/^https:\/\/(upload|thumb)\.wikimedia\.org\//.test(u || "")) return null;
    await photoPut(k, u); return u;
  } catch (e) { return null; }
}
function heroHTML() {
  const [ft, fa] = FRASES[fraseIdx()], n = authorName(fa);
  setTimeout(heroHydrate, 0);
  return `<section class="hero"><div class="hero-av" aria-hidden="true"><span>${esc(initials(n))}</span><img alt="" data-author="${esc(n)}" hidden></div>
    <blockquote class="hero-q">“${esc(ft)}”</blockquote><div class="hero-a">— ${esc(fa)}</div>
    <button class="btn ghost hero-next" data-act="quote-next">Outra frase ${ic("right")}</button></section>`;
}
function heroHydrate() { $$("img[data-author]").forEach(async img => { const u = await authorPhoto(img.dataset.author); if (u && img.isConnected) { img.onload = () => { img.hidden = false; }; img.src = u; } }); }

const recTxt = it => it.date ? `Só em ${dispDate(it.date)}` : it.days.length === 7 ? "Todo dia" : it.days.length === 5 && WEEKDAYS.every(d => it.days.includes(d)) ? "Seg a sex" : it.days.map(d => DOW[d].slice(0, 3).toLowerCase()).join(", ") || "Nenhum dia";

/* ============ INTERPRETADOR DA PALETA: texto livre → ações ============ */
// Entende: "água 500", "500", "garrafa", "peso 118,4 cintura 121", "cardio 30 6,5 5", "fibra 5", "dor 3", "pescoço 4",
// "repetir almoço", "frango 150 @almoço" (refeição pelo horário se omitida), "?pergunta" para o Coach, e comandos/lentes.
const MEAL_ALIAS = { cafe: "Café da manhã", "cafe da manha": "Café da manhã", manha: "Café da manhã", almoco: "Almoço", alm: "Almoço", lanche: "Lanche", jantar: "Jantar", janta: "Jantar", ceia: "Ceia" };
const cmd = (icon, label, sub, run) => ({ icon, label, sub, run });
function mealIn(t) {
  const m = t.match(/@\s*([a-z ]+)$/) || t.match(/\b(cafe da manha|cafe|almoco|alm|lanche|jantar|janta|ceia)\s*$/);
  return m ? { meal: MEAL_ALIAS[m[1].trim()] || null, rest: t.slice(0, m.index).trim() } : { meal: null, rest: t };
}
function parseWater(t) {
  let m = t.match(/^(?:agua|beber|bebi)\s*\+?\s*(\d{2,4})\s*(?:ml)?$/) || t.match(/^\+?(\d{2,4})\s*(?:ml)?\s*(?:de\s+)?(?:agua)?$/);
  if (m && +m[1] > 0 && +m[1] <= 3000) return [cmd("drop", `Água +${m[1]} ml`, "Registrar agora", () => waterDo(+m[1]))];
  const sz = WSIZES.find(([n]) => normTxt(n) === t.replace(/^agua\s+/, ""));
  return sz ? [cmd("drop", `Água +${sz[1]} ml`, sz[0], () => waterDo(sz[1]))] : [];
}
function parseNumbers(t) {
  let m;
  if ((m = t.match(/^peso\s+([\d.,]+)(?:\s*kg)?(?:\s+cintura\s+([\d.,]+))?/))) return [cmd("scale", `Peso ${m[1]} kg${m[2] ? ` · cintura ${m[2]} cm` : ""}`, "Registrar pesagem de hoje", () => weighSave(num(m[1]), num(m[2])))];

/* ============ DESCANSO: anel que esvazia, bipe (AudioContext), vibração e notificação ============ */
const RT = { end: 0, total: 0, paused: null, iv: null, next: "" };
let AC = null;
function beep() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime;
    [0, .25, .5].forEach(o => { const os = AC.createOscillator(), g = AC.createGain(); os.frequency.value = 880; os.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(.0001, t + o); g.gain.exponentialRampToValueAtTime(.4, t + o + .02); g.gain.exponentialRampToValueAtTime(.0001, t + o + .18); os.start(t + o); os.stop(t + o + .2); });
  } catch (e) { }
}
function unlockAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) { } }
function startRest(sec, next) {
  unlockAudio(); clearInterval(RT.iv); RT.total = sec; RT.end = Date.now() + sec * 1000; RT.paused = null; RT.next = next || "";
  $("#rest").classList.add("on"); restDraw(true); RT.iv = setInterval(restTick, 250);
}
const restLeft = () => RT.paused !== null ? RT.paused : Math.max(0, Math.ceil((RT.end - Date.now()) / 1000));
function restDraw(full) {
  const l = restLeft(), p = RT.total ? l / RT.total : 0, hue = S.cur ? WK_HUE[S.cur.day] : "var(--accent)";
  const t = $("#rest-time"), arc = $("#rest .arc");
  if (!full && t && arc) { t.textContent = `${Math.floor(l / 60)}:${pad(l % 60)}`; const c = +arc.getAttribute("stroke-dasharray"); arc.setAttribute("stroke-dashoffset", c * (1 - p)); return; }
  $("#rest-in").innerHTML = `<div class="lbl">Descanso</div>${ring(p, 260, 12, hue, `<div class="rest-time tabnum" id="rest-time" aria-live="off">${Math.floor(l / 60)}:${pad(l % 60)}</div>`)}
    <p class="rest-next">${esc(RT.next)}</p>
    <div class="grid2 rest-btns"><button class="btn" data-act="rest-adj" data-s="-15">−15 s</button><button class="btn" data-act="rest-adj" data-s="15">+15 s</button>
    <button class="btn" data-act="rest-pause">${ic(RT.paused !== null ? "play" : "pause")} ${RT.paused !== null ? "Retomar" : "Pausar"}</button><button class="btn solid" data-act="rest-skip">Pular</button></div>`;
}
function restTick() { if (RT.paused !== null) return; if (restLeft() <= 0) return restDone(); restDraw(); }
function restDone() {
  clearInterval(RT.iv); beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200, 100, 200]); } catch (e) { }
  notify("Descanso acabou", RT.next || "Hora da próxima série.");
  const t = $("#rest-time"); if (t) t.textContent = "Vai!";
  setTimeout(closeRest, 900);
}
function closeRest() { clearInterval(RT.iv); RT.iv = null; $("#rest").classList.remove("on"); }
function notify(title, body) {
  if (!S.settings.notif) return;
  try { if ("Notification" in window && Notification.permission === "granted") { if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification(title, { body, tag: "sir-rest", icon: "icon-192.png", vibrate: [200, 100, 200] })).catch(() => new Notification(title, { body })); else new Notification(title, { body }); } } catch (e) { }
}
ACT["rest-adj"] = b => { const s = num(b.dataset.s); if (RT.paused !== null) RT.paused = Math.max(1, RT.paused + s); else RT.end += s * 1000; RT.total = Math.max(1, RT.total + s); restDraw(); };

function wkNext() { const c = S.cur, st = stepsOf(c.day); if (c.i >= st.length - 1) return wkFinish(); c.i++; save(); arenaRender(); const s = $(".ar-stage"); if (s) s.scrollTop = 0; }
function wkFinish() { const L = S.cur.day, rows = wkCommit(); dropLayer("arena"); haptic(30); summarySheet(L, rows); }

function weekReview() {
  const k = today(), prot = []; let cardio = 0, act = 0;
  for (let i = 1; i <= 7; i++) { const dk = addDays(k, -i), p = (D(dk).meals || []).reduce((a, m) => a + (m.p || 0), 0); if (p > 0) prot.push(p); cardio += cardioMin(dk); if (isActive(dk)) act++; }
  const avg = prot.length ? Math.round(prot.reduce((a, b) => a + b, 0) / prot.length) : 0, tp = TG().prot;
  const sug = !prot.length ? "Sem comida registrada na semana. Registre ao menos o almoço para o app poder ajudar." : avg < tp * 0.85 ? `Proteína média de ${avg} g, abaixo da meta de ${tp} g. Coloque uma fonte de proteína em cada refeição.` : act >= 5 ? "Semana verde: 5 ou mais dias ativos. Mantenha o ritmo." : `${act} dias ativos. Faltam ${5 - act} para a meta: escolha o hábito mais fácil e repita amanhã.`;
  return { avg, cardio, act, sug, prot: prot.length };
}
function reviewOpen() {
  const r = weekReview();
  openSheet(`<h3 class="h2">Resumo da semana</h3><p class="muted">Últimos 7 dias · semana ${weekNo()}</p>
  <div class="grid2"><div class="tile"><div class="h2 tabnum">${r.prot ? r.avg + " g" : "—"}</div><div class="lbl">Proteína/dia</div></div><div class="tile"><div class="h2 tabnum">${r.cardio} min</div><div class="lbl">Cardio</div></div></div>
  <div class="tile"><div class="h3">${r.act} de 7 dias ativos</div><p class="muted small">${r.sug}</p></div><button class="btn solid full" data-act="close">Entendido</button>`);
}
function maybeReview() { const k = today(); if (parseKey(k).getDay() === 1 && S.settings.revSeen !== k && Object.values(S.days).some(hasData)) { S.settings.revSeen = k; save(); reviewOpen(); } }

  const a = adherence(m.id), doses = medToday(m.id), times = medTimes(m.id);
  const dz = doses.map(({ inst, taken }) => `<div class="dose ${taken ? "ok" : ""}"><span class="grow"><b class="tabnum">${inst.at || PERIODS[inst.period]}</b><small>${taken ? `Tomada ${taken === "—" ? "(registro antigo)" : "às " + taken}` : inst.min <= nowMin() ? "Pendente" : "Mais tarde"}</small></span>
    ${taken ? `<button class="btn sm" data-act="dose-undo" data-id="${inst.id}">Desfazer</button>` : `<button class="btn sm solid" data-act="dose-log" data-id="${inst.id}">Registrar dose</button>`}</div>`).join("");
  return `<article class="med"><header class="row between"><div><h3 class="h3">${esc(m.n)}</h3><p class="muted small">${m.dose ? esc(m.dose) : "Dose não informada"}${m.withMeal ? " · com refeição" : ""}${times.length ? " · " + times.join(", ") : ""}</p></div><button class="icon-btn" data-act="med-edit" data-id="${m.id}" aria-label="Editar ${esc(m.n)}">${ic("edit")}</button></header>
    ${dz || `<p class="muted small">Sem dose na agenda de hoje.</p>`}
    <div class="med-foot"><span>Adesão (30 dias): <b class="tabnum">${a.pct == null ? "—" : a.pct + "%"}</b> <span class="muted">${a.due ? `${a.ok} de ${a.due} doses` : ""}</span></span>${m.doctor ? `<span class="muted">Prescrito por ${esc(m.doctor)}</span>` : ""}</div>
    ${m.notes ? `<p class="muted xs">${esc(m.notes)}</p>` : ""}</article>`;
}
function remediosView() {
  const qs = questionsOpen();
  return `<section class="notice">${ic("shield")}<p>Registre exatamente o que seu médico prescreveu. O app não sugere, não calcula e não altera doses. Dúvida ou efeito estranho: fale com o médico.</p></section>

ACT.notif = () => {
  if (S.settings.notif) { S.settings.notif = false; save(); return render(); }
  if (!("Notification" in window)) return toast("Este navegador não suporta notificações.");

};
ACT.export = () => exportData();
ACT.import = () => $("#file").click();
ACT.reset = () => {
  if (!confirm(`Apagar TODOS os dados do perfil ${S.profile.name} neste aparelho? Exporte um backup antes.`)) return;
  const id = S.id, p = newProfile(S.profile.name, { startWeight: S.profile.startWeight, goal: S.profile.goal, height: S.profile.height, age: S.profile.age, avatar: S.profile.avatar });
  p.id = id; R.profiles[id] = p; useProfile(id); save(); closeAll(); render(); toast("Dados do perfil apagados.");
};

/* ============ PAPEL DE PAREDE: presets ou foto sua (só no aparelho, fora do backup) ============ */
const WALLS = [["none", "Nenhum", ""],
  ["aurora", "Aurora", "radial-gradient(90% 60% at 10% 0%,rgba(139,124,246,.35),transparent 70%),radial-gradient(80% 60% at 100% 100%,rgba(91,140,255,.3),transparent 70%)"],
  ["noite", "Noite", "linear-gradient(160deg,rgba(60,40,140,.45),rgba(20,30,90,.35) 60%,transparent)"],
  ["mar", "Mar", "radial-gradient(120% 70% at 50% 110%,rgba(47,111,224,.45),transparent 70%),linear-gradient(180deg,rgba(91,140,255,.12),transparent)"],
  ["violeta", "Violeta", "conic-gradient(from 200deg at 70% 20%,rgba(139,124,246,.35),rgba(91,140,255,.2),rgba(139,124,246,.35))"]];
async function applyWall() {
  const w = R.wall || "none", b = document.body; let bg = (WALLS.find(x => x[0] === w) || WALLS[0])[2];
  if (w === "foto") { const u = await photoGet("wall"); bg = u ? `linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url("${u}") center/cover` : ""; }
  b.style.backgroundImage = ""; b.style.background = bg ? `${bg} fixed, var(--bg)` : "";
  b.classList.toggle("has-wall", !!bg);
}
function wallHTML() {
  const cur = R.wall || "none", op = (id, n, bg) => `<button class="wall-op ${cur === id ? "on" : ""}" data-act="wall" data-v="${id}" aria-pressed="${cur === id}"><span style="background:${bg || "var(--bg)"},var(--bg)"></span>${n}</button>`;
  return `<div class="lbl">Papel de parede</div><div class="wall-grid">${WALLS.map(w => op(...w)).join("")}${op("foto", "Sua foto", "var(--surface3)")}</div>`;
}
ACT.wall = b => { if (b.dataset.v === "foto") return $("#wallfile").click(); R.wall = b.dataset.v; save(); applyWall(); render(); };
async function wallSet(file) {
  const b64 = await fotoDownscale(file, 1600); await photoPut("wall", "data:image/jpeg;base64," + b64);
  R.wall = "foto"; save(); await applyWall(); render(); toast("Papel de parede trocado.");
}

function loadFont(f) {
  if (!f[4] || document.getElementById("font-" + f[0])) return;
  const l = document.createElement("link"); l.id = "font-" + f[0]; l.rel = "stylesheet";
  l.href = `https://fonts.googleapis.com/css2?family=${f[4]}&display=swap`; document.head.appendChild(l);

// chamado por applyTheme: a paleta depende de claro/escuro
function applyLook() {
  const st = document.documentElement.style, dark = document.documentElement.dataset.theme === "dark";
  const p = palOf(R.accent), c = dark ? p[3] : p[4];
  VIS_VARS.forEach((v, i) => p[0] === "padrao" ? st.removeProperty(v) : st.setProperty(v, c[i]));
  const f = fontOf(R.font); loadFont(f);
  if (f[0] === "padrao") { st.removeProperty("--f-display"); st.removeProperty("--f-body"); }
  else { st.setProperty("--f-display", `${f[2]},system-ui,sans-serif`); st.setProperty("--f-body", `${f[3]},system-ui,-apple-system,sans-serif`); }
}

  const p = S.profile, s = S.settings, v = (id, d) => num($("#" + id).value, d);
  const vals = { sw: v("ps", p.startWeight), g: v("pg", p.goal), h: v("ph", p.height), a: v("pa", p.age), def: v("pdef", s.deficit), act: v("pact", s.activity), fl: v("pfloor", s.floor), w: v("pwater", s.waterGoal) };
  if (!(vals.sw >= 30 && vals.sw <= 300 && vals.g >= 30 && vals.g <= 300 && vals.h >= 100 && vals.h <= 250 && vals.a >= 10 && vals.a <= 110)) return toast("Confira peso, meta, altura e idade.");

/* ============ EDITORES: hábitos e suplementos (adicionar, editar, remover, reordenar, Regra nº 1) ============ */
const LISTS = { habits: () => S.habits, supps: () => S.supps };
function rowTools(kind, i, n, label) {
  return `<span class="grip" data-grip="${kind}" data-i="${i}" aria-hidden="true">${ic("grip")}</span>
    <button class="icon-btn" data-act="li-edit" data-k="${kind}" data-i="${i}" aria-label="Editar ${esc(label)}">${ic("edit")}</button>`;

function habitsFold() {
  const s = S.settings, n = S.habits.length;
  const rows = S.habits.map((h, i) => `<div class="li ed" data-row="habits" data-i="${i}"><span class="n-ic">${esc(h.icon)}</span><div class="grow"><b>${esc(h.t)}</b><small class="muted">${h.id === s.rule1 ? "Regra nº 1 · " : ""}${habitWhen(h.id)}${h.link ? " · automático" : ""}</small></div>${rowTools("habits", i, n, h.t)}</div>`).join("");

    <div class="row between set-row"><span class="grow">Outros hábitos necessários para dia ativo</span><div class="stepper sm"><button class="icon-btn" data-act="need" data-d="-1" aria-label="Menos um">${ic("minus")}</button><b class="tabnum">${s.needOthers}</b><button class="icon-btn" data-act="need" data-d="1" aria-label="Mais um">${ic("plus")}</button></div></div>
    <p class="muted xs">Dia ativo = Regra nº 1 + ${s.needOthers} outros. Arraste pela alça ou use as setas para reordenar. Para dar horário a um hábito, toque em Adicionar na Agenda.</p>`, UI.openFold === "habitos", "habitos");
}
function suppsFold() {
  const n = S.supps.length, row = (x, i) => `<div class="li ed" data-row="supps" data-i="${i}"><div class="grow"><b>${esc(x.n)}</b><small class="muted">${esc(x.tip)} · ${suppWhen(x.id)}</small></div>${rowTools("supps", i, n, x.n)}</div>`;

    <button class="btn full" data-act="li-new" data-k="supps">${ic("plus")} Novo suplemento</button><p class="muted xs">Remédios prescritos ficam em Saúde › Remédios.</p>`, UI.openFold === "supps", "supps");

function habitSheet(i) {
  const h = i >= 0 ? S.habits[i] : { icon: "✦", t: "", desc: "", at: "", link: "" };
  openSheet(`<h3 class="h3">${i >= 0 ? "Editar hábito" : "Novo hábito"}</h3>

  <label class="lbl" for="hd">Descrição (opcional)</label><input class="field" id="hd" maxlength="120" value="${esc(h.desc || "")}">
  <label class="lbl" for="hl">Automático</label><select class="field" id="hl">${LINKS.map(([v, n]) => `<option value="${v}" ${v === h.link ? "selected" : ""}>${n}</option>`).join("")}</select>
  ${i >= 0 ? moveRow("habits", i) : ""}<button class="btn solid full" data-act="li-save" data-k="habits" data-i="${i}">SALVAR</button>${i >= 0 ? `<button class="btn danger full" data-act="li-del" data-k="habits" data-i="${i}">Remover hábito</button>` : ""}`);
}
function suppSheet(i) {
  const x = i >= 0 ? S.supps[i] : { n: "", tip: "", type: "S", at: "" };
  openSheet(`<h3 class="h3">${i >= 0 ? "Editar suplemento" : "Novo suplemento"}</h3>
  <label class="lbl" for="sn">Nome</label><input class="field" id="sn" maxlength="60" value="${esc(x.n)}">
  <label class="lbl" for="st">Dica de quando tomar</label><input class="field" id="st" maxlength="120" value="${esc(x.tip)}">
  <div class="row"><div><label class="lbl" for="sa">Horário na agenda (vazio = manhã, sem hora fixa)</label><input class="field time" id="sa" type="time" value="${esc(suppAt(x.id))}"></div></div>
  ${i >= 0 ? moveRow("supps", i) : ""}<button class="btn solid full" data-act="li-save" data-k="supps" data-i="${i}">SALVAR</button>${i >= 0 ? `<button class="btn danger full" data-act="li-del" data-k="supps" data-i="${i}">Remover</button>` : ""}`);
}
const moveRow = (k, i) => `<div class="grid2"><button class="btn sm" data-act="li-move" data-k="${k}" data-i="${i}" data-d="-1" ${i === 0 ? "disabled" : ""}>${ic("up")} Subir</button><button class="btn sm" data-act="li-move" data-k="${k}" data-i="${i}" data-d="1" ${i === LISTS[k]().length - 1 ? "disabled" : ""}>${ic("down")} Descer</button></div>`;
const txt = (id, max) => ($("#" + id).value || "").trim().slice(0, max);
function listSave(k, i) {
  const a = LISTS[k]();
  if (k === "habits") {
    const o = { icon: txt("hi", 4) || "✦", t: txt("ht", 60), desc: txt("hd", 120), link: LINKS.some(l => l[0] === $("#hl").value) ? $("#hl").value : "" };
    if (!o.t) return toast("Escreva o hábito.");
    if (i >= 0) Object.assign(a[i], o); else a.push(Object.assign({ id: uid("h") }, o));
  } else {
    const at = /^\d\d:\d\d$/.test(txt("sa", 5)) ? txt("sa", 5) : "", o = { n: txt("sn", 60), tip: txt("st", 120), type: "S" };
    if (!o.n) return toast("Escreva o nome.");
    const it = i >= 0 ? Object.assign(a[i], o) : (a.push(Object.assign({ id: uid("s") }, o)), a[a.length - 1]);
    suppSync(it, at);
  }
  save(); closeSheet(); render(); toast("Salvo.");
}
function listMove(k, from, to) { const a = LISTS[k](); if (to < 0 || to >= a.length || from === to) return; a.splice(to, 0, a.splice(from, 1)[0]); save(); render(); haptic(); }
ACT["li-new"] = b => b.dataset.k === "habits" ? habitSheet(-1) : suppSheet(-1);
ACT["li-edit"] = b => b.dataset.k === "habits" ? habitSheet(+b.dataset.i) : suppSheet(+b.dataset.i);
ACT["li-save"] = b => listSave(b.dataset.k, +b.dataset.i);
// subir/descer pelo painel de edição (acessível sem arrastar); o painel continua aberto no item movido
ACT["li-move"] = b => { const k = b.dataset.k, i = +b.dataset.i, j = i + num(b.dataset.d); listMove(k, i, j); if (j >= 0 && j < LISTS[k]().length) (k === "habits" ? habitSheet : suppSheet)(j); };
// o horário do suplemento é um item da agenda (cria, atualiza ou deixa flexível pela manhã)
const suppItem = id => S.sched.items.find(x => x.type === "suplemento" && x.ref === id);
const suppAt = id => (suppItem(id) || {}).at || "";
const suppWhen = id => { const x = suppItem(id); return !x ? "fora da agenda" : x.at ? "às " + x.at : PERIODS[x.period].toLowerCase(); };
const habitWhen = id => { const x = S.sched.items.find(y => y.type === "habito" && y.ref === id); return !x ? "o dia todo" : x.at ? "às " + x.at : PERIODS[x.period].toLowerCase(); };
function suppSync(s, at) { const x = suppItem(s.id); if (x) Object.assign(x, { at, period: at ? "" : "manha", title: s.n }); else S.sched.items.push(schedItem("suplemento", s.id, s.n, { at, period: at ? "" : "manha", dur: 5 })); }
ACT["li-del"] = b => {
  const k = b.dataset.k, i = +b.dataset.i, a = LISTS[k](), it = a[i]; if (!it) return;

  if (k === "habits" && a.length < 2) return toast("Mantenha pelo menos um hábito.");
  if (!confirm(`Remover "${it.t || it.n}"? O histórico dos dias passados continua salvo.`)) return;
  a.splice(i, 1); if (k === "supps") S.sched.items = S.sched.items.filter(x => !(x.type === "suplemento" && x.ref === it.id));
  save(); closeSheet(); render(); toast("Removido.");
};
ACT.need = b => { S.settings.needOthers = clamp(S.settings.needOthers + num(b.dataset.d), 0, Math.max(0, S.habits.length - 1)); save(); render(); };

/* ============ EVENTOS: o ÚNICO ouvinte de clique do app + teclado, campos e formulários ============ */
let suppressClick = 0;
document.addEventListener("click", e => {
  if (Date.now() < suppressClick) { e.preventDefault(); e.stopPropagation(); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (!ACT[a]) return;
  if (b.tagName === "A") e.preventDefault();
  ACT[a](b, e);
  // o painel Registrar continua aberto em sub-telas (ex.: doses de hoje): redesenha depois da ação
  if (STACK.includes("actions") && b.closest("#actions") && UI.act) rActions();
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Escape" && STACK.length) { dropLayer(STACK[STACK.length - 1]); return; }
  if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(t.tagName) && !STACK.length)) { e.preventDefault(); openActions(); setTimeout(() => { const i = $("#pal-q"); if (i) i.focus(); }, 50); return; }
  if ((e.key === "Enter" || e.key === " ") && t.getAttribute && t.getAttribute("role") === "button" && t.dataset.act) { e.preventDefault(); t.click(); return; }
  if (e.key === "Enter" && !e.shiftKey && t.id === "ia-input") { e.preventDefault(); auraSend(); return; }
  if (e.key === "Enter" && t.id === "pal-q") { e.preventDefault(); palRun(0); return; }
  if (!STACK.includes("arena") || /INPUT|TEXTAREA/.test(t.tagName)) return;
  if (e.key === "ArrowRight") arenaSwipe(-1); else if (e.key === "ArrowLeft") arenaSwipe(1);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.dataset.form === "chat") auraSend();
  if (e.target.dataset.form === "pal") palRun(0);
  if (e.target.dataset.form === "q") { const i = $("#q-new"); if (i && questionAdd(i.value)) { render(); toast("Pergunta guardada."); } }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "pal-q") return palResults(t.value);
  if (t.id === "q") { const l = $("#foodlist"); if (l) l.innerHTML = foodListHTML(t.value); return; }
  if (t.id === "g") return gSum(+t.dataset.i);
  if (t.id === "ia-input") { t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; return; }
  if (t.dataset.foto !== undefined) { const f = t.dataset.foto, it = FOTO.items[+t.dataset.i]; if (it) { it[f] = f === "nome" ? t.value : num(t.value); fotoTotal(); } return; }
  if (t.dataset.f && S.cur && t.closest("#arena")) arenaInput(t);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "ia-foto") { const f = t.files[0]; t.value = ""; if (f) iaFoto(f); return; }
  if (t.id === "foto") { const f = t.files[0]; t.value = ""; if (f) fotoAnalyze(f); return; }
  if (t.id === "file") { const f = t.files[0]; t.value = ""; if (f) importFile(f); return; }
  if (t.id === "wallfile") { const f = t.files[0]; t.value = ""; if (f) wallSet(f).catch(() => toast("Não consegui ler essa foto.")); return; }
  if (t.id === "fotoprog") { const f = t.files[0]; t.value = ""; if (f) photoAdd(f).then(() => { render(); toast("Foto guardada só neste aparelho."); }).catch(() => toast("Não consegui ler essa foto.")); return; }
  if (t.dataset.change === "rule1" && S.habits.some(h => h.id === t.value)) { S.settings.rule1 = t.value; S.settings.needOthers = Math.min(S.settings.needOthers, S.habits.length - 1); save(); render(); toast("Regra nº 1 atualizada."); }
  if (t.dataset.f && S.cur && t.closest("#arena")) arenaRender();
});
matchMedia("(prefers-color-scheme:dark)").addEventListener && matchMedia("(prefers-color-scheme:dark)").addEventListener("change", () => R && applyTheme());
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !R) return;

  if (S.cur && STACK.includes("arena")) lockScreen();
