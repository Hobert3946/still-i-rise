<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Still I Rise</title>
<meta name="description" content="Still I Rise: treino, alimentação e hábitos para manter o peso perdido.">
<meta name="theme-color" content="#0D0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Still I Rise">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Sora:wght@500..800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS: cor, tipo, movimento ============ */
:root{
  --bg:#0D0D0F;--bg2:#111114;--surface:#141417;--surface2:#1B1B20;--surface3:#24242B;
  --line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.11);
  --text:#EDEBE7;--muted:#8D8B9C;--faint:#5C5A6B;
  --accent:#8B7CF6;--accent-hi:#B4A8FF;--accent-ink:#B4A8FF;--on-accent:#0E0B1F;--blue:#5B8CFF;
  --ok:#7CC4A0;--water:#56B6F7;--warn:#F2B84B;--bad:#F2706B;
  --c-a:#A78BFA;--c-b:#60A5FA;--c-c:#38BDF8;--c-d:#818CF8;--c-e:#E879F9;
  --glass:rgba(20,20,23,.62);--glass-line:rgba(255,255,255,.08);--scrim:rgba(5,5,7,.55);
  --shadow:0 18px 50px -18px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.35);
  --glow:0 0 0 1px rgba(139,124,246,.3),0 10px 40px -8px rgba(91,140,255,.5);
  --f-display:"Sora",system-ui,sans-serif;--f-body:"Geist",system-ui,-apple-system,sans-serif;
  --r-s:12px;--r:18px;--r-l:26px;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --t1:200ms;--t2:300ms;--t3:400ms;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --orb:64px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F5FA;--bg2:#EDEDF5;--surface:#FFFFFF;--surface2:#EFEFF7;--surface3:#E3E3EF;
  --line:rgba(20,20,40,.07);--line2:rgba(20,20,40,.13);
  --text:#15141F;--muted:#686778;--faint:#A09FB0;
  --accent:#6A55E0;--accent-hi:#8B7CF6;--accent-ink:#5B46D6;--on-accent:#FFFFFF;--blue:#2F6FE0;
  --ok:#2F8A5F;--water:#2B7FD8;--warn:#B7801C;--bad:#C8413B;
  --c-a:#7C5CE6;--c-b:#2F6FE0;--c-c:#0E8FC7;--c-d:#4F56D8;--c-e:#B03BC7;
  --glass:rgba(255,255,255,.74);--glass-line:rgba(20,20,40,.08);--scrim:rgba(30,26,60,.3);
  --shadow:0 18px 50px -20px rgba(40,30,90,.3),0 2px 8px rgba(40,30,90,.08);
  --glow:0 0 0 1px rgba(106,85,224,.2),0 10px 30px -10px rgba(47,111,224,.4);
  color-scheme:light;
}
@media (prefers-reduced-motion:reduce){:root{--t1:1ms;--t2:1ms;--t3:1ms}*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}

/* ============ BASE: reset, tipografia e componentes ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{font:400 16px/1.45 var(--f-body);color:var(--text);background:var(--bg);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;transition:background var(--t3) var(--ease)}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:70vh;background:radial-gradient(60% 50% at 30% 20%,rgba(139,124,246,.13),transparent 70%),radial-gradient(50% 40% at 85% 10%,rgba(86,182,247,.08),transparent 70%);pointer-events:none;z-index:0}
body.lock{overflow:hidden}
body[data-hour="morning"]::before{background:radial-gradient(60% 50% at 30% 20%,rgba(180,168,255,.2),transparent 70%),radial-gradient(50% 40% at 85% 10%,rgba(91,140,255,.1),transparent 70%)}
body[data-hour="night"]::before{background:radial-gradient(60% 50% at 30% 20%,rgba(169,155,224,.12),transparent 70%),radial-gradient(50% 40% at 85% 10%,rgba(86,182,247,.07),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35;pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.fill{fill:currentColor;stroke:none}
.skip{position:fixed;left:12px;top:-60px;z-index:999;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:600}
.skip:focus{top:calc(var(--sat) + 8px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.h1{font:700 28px/1.1 var(--f-display);letter-spacing:-.02em}
.h2{font:700 22px/1.15 var(--f-display);letter-spacing:-.015em}
.h3{font:600 18px/1.25 var(--f-display);letter-spacing:-.01em}
.big{font:700 44px/1 var(--f-display);letter-spacing:-.03em}
.lbl{font:600 11px/1.3 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:14px}.xs{font-size:12.5px}
.tabnum{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tile{background:var(--surface2);border-radius:var(--r-s);padding:12px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);font-weight:600;font-size:15px;transition:transform var(--t1) var(--ease),background var(--t1)}
.btn:active{transform:scale(.97)}
.btn.solid{background:linear-gradient(135deg,var(--accent-hi),var(--accent));color:var(--on-accent);border-color:transparent;box-shadow:var(--glow)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none;transition:background var(--t1),transform var(--t1)}
.icon-btn:active{transform:scale(.92);background:var(--surface2)}
.icon-btn.bad{color:var(--bad)}
.field{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);font-size:16px;outline:none;transition:border-color var(--t1)}
.field:focus{border-color:var(--accent)}
.field.time{width:116px;flex:none}
select.field{appearance:none}
.cbx{width:22px;height:22px;accent-color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:14px;font-weight:500;transition:all var(--t1) var(--ease)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chip:active{transform:scale(.95)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);transition:all var(--t1)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tog{width:52px;height:32px;border-radius:99px;background:var(--surface3);position:relative;flex:none;transition:background var(--t2)}
.tog i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform var(--t2) var(--spring)}
.tog.on{background:var(--ok)}.tog.on i{transform:translateX(20px)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface2);font-size:12.5px;font-weight:600}
.pill.ok{color:var(--ok)}.pill.acc{color:var(--accent-ink)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-s);background:var(--surface2);border-left:3px solid var(--accent);font-size:14.5px}
.banner b{display:block;margin-bottom:2px}
.banner.ok{border-color:var(--ok)}.banner.warn{border-color:var(--warn)}.banner.bad{border-color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-hi));transition:width var(--t3) var(--ease)}
details.fold{border-top:1px solid var(--line)}
details.fold>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:52px;cursor:pointer;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .icon{transition:transform var(--t2) var(--ease)}
details.fold[open]>summary .icon{transform:rotate(180deg)}
details.fold .body{padding:0 0 14px}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface3)}
.ring .arc{transition:stroke-dashoffset 900ms var(--ease)}
.ring .c{text-align:center;position:relative}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:300;max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--glass-line);box-shadow:var(--shadow);font-size:14.5px;font-weight:500;transition:all var(--t2) var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.act{pointer-events:auto;cursor:pointer}
.toast.act::after{content:" ↺";color:var(--accent-ink);font-weight:700}
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity var(--t2) var(--ease);z-index:200}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:210;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;border-top:1px solid var(--line2);padding:10px 18px calc(var(--sab) + 22px);transform:translateY(105%);transition:transform var(--t3) var(--ease);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sheet.on{transform:none}
.sheet::before{content:"";align-self:center;width:40px;height:5px;border-radius:9px;background:var(--line2);flex:none}
@media (min-width:640px){.sheet{left:50%;right:auto;width:560px;margin-left:-280px}}
.shimmer{height:80px;border-radius:14px;background:linear-gradient(90deg,var(--surface2),var(--surface3),var(--surface2));background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ============ ESTRUTURA: cabeçalho, barra com a logo, seções, páginas, Hoje, Agenda, Registrar ============ */
.top{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:var(--sat);background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-bottom:1px solid var(--glass-line)}
.top-in{max-width:600px;margin:0 auto;height:64px;display:flex;align-items:center;gap:12px;padding:0 14px}
.top-t small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-t h1{font:700 20px/1.15 var(--f-display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{flex:none;border-radius:50%}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.avatar.ini{display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--blue));color:#fff;font:700 16px var(--f-display)}
.coach-btn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:99px;font-weight:600;font-size:14.5px;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);flex:none}
.coach-btn .icon{width:18px;height:18px}
.view{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:calc(var(--sat) + 80px) 16px calc(var(--sab) + 120px);display:flex;flex-direction:column;gap:16px;outline:none}
/* barra de baixo: 4 seções com nome + logo no centro */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:grid;grid-template-columns:1fr 1fr 96px 1fr 1fr;align-items:end;max-width:600px;margin:0 auto;padding:0 6px calc(var(--sab) + 6px);background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-top:1px solid var(--glass-line)}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;font-size:12.5px;font-weight:600;color:var(--muted);transition:color var(--t1)}
.tb .icon{width:24px;height:24px}
.tb.on{color:var(--text)}.tb.on .icon{color:var(--accent)}
.tb-logo{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:-26px;font-size:12.5px;font-weight:700;color:var(--accent-ink)}
.tb-logo img{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent),0 12px 30px -6px rgba(91,140,255,.6);transition:transform var(--t2) var(--spring)}
.tb-logo:active img{transform:scale(.92)}
body.lock .tabbar{pointer-events:none}
.segbar{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--surface2);position:sticky;top:calc(var(--sat) + 70px);z-index:20}
.segbar button{flex:1;min-height:44px;border-radius:12px;font-size:13.5px;padding:0 4px;font-weight:600;color:var(--muted);transition:all var(--t1)}
.segbar button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.25)}
/* páginas (agenda, coach, ajustes) */
.page{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;opacity:0;transform:translateX(24px);pointer-events:none;transition:opacity var(--t3) var(--ease),transform var(--t3) var(--ease)}
.page.on{opacity:1;transform:none;pointer-events:auto}
.page-in{flex:1;display:flex;flex-direction:column;min-height:0;max-width:600px;width:100%;margin:0 auto;padding-top:var(--sat)}
.page-top{display:flex;align-items:center;gap:8px;padding:10px 14px 10px 6px;border-bottom:1px solid var(--line)}
.page-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px calc(var(--sab) + 28px);display:flex;flex-direction:column;gap:14px}
.sheet-x{position:absolute;top:10px;right:10px}
/* HOJE */
.agora{position:relative;padding:22px 20px 16px;border-radius:var(--r-l);background:radial-gradient(120% 100% at 0% 0%,rgba(139,124,246,.28),transparent 60%),radial-gradient(100% 90% at 100% 100%,rgba(91,140,255,.2),transparent 60%),var(--surface);border:1px solid rgba(139,124,246,.3);box-shadow:var(--shadow);animation:rise var(--t3) var(--ease) both}
.ag-kick,.kick{font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.ag-t{font:700 28px/1.12 var(--f-display);letter-spacing:-.025em;margin:6px 0 6px}
.ag-p{color:var(--muted);font-size:15.5px;margin-bottom:14px}
.ag-alt{display:flex;justify-content:center;gap:4px;margin-top:6px}
.btn.xl{min-height:58px;font-size:16.5px;border-radius:16px}
.btn.solid{background:linear-gradient(135deg,var(--accent),var(--blue));color:#fff}
.align{display:grid;grid-template-columns:1fr auto;gap:10px 8px;align-items:center;text-align:left;padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.al-t{font-size:16.5px}.al-t b{font:700 20px var(--f-display)}
.align .bar{grid-column:1/-1;height:10px}
.block{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.meter{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;text-align:left;padding:8px 0;min-height:52px}
.m-l{font-weight:600}.m-v{color:var(--muted);font-size:14px}.m-v b{color:var(--text);font:700 16px var(--f-display)}
.meter .bar{grid-column:1/-1;height:8px}
.nx{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:10px;min-height:52px;text-align:left;border-top:1px solid var(--line)}
.nx time{font:600 15px var(--f-display);color:var(--accent-ink)}.nx-ty{font-size:12.5px;color:var(--muted)}
.link{display:flex;align-items:center;gap:2px;min-height:44px;font-weight:600;font-size:14.5px;color:var(--accent-ink)}.link .icon{width:16px;height:16px}
.foot details.fold{border-top:0;padding:0 4px}
.foot .quote{text-align:left;padding:12px 0}.foot .quote p{font:500 16px/1.45 var(--f-display)}.foot .quote small{color:var(--muted)}
.hero-card{padding:18px;border-radius:var(--r);background:radial-gradient(120% 100% at 0% 0%,rgba(139,124,246,.18),transparent 60%),var(--surface);border:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.hero-card.ok{border-color:rgba(124,196,160,.4)}
.pastnote{display:flex;gap:8px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:14px;color:var(--warn);text-align:left;min-height:48px}
.chk{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:14px;background:var(--surface2);min-height:56px;width:100%}
.chk small{display:block;font-size:12.5px;color:var(--muted)}
.chk .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;flex:none;transition:all var(--t2) var(--spring)}
.chk.on .box{background:var(--ok);border-color:var(--ok);color:#0D0D0F}
.chk.lg{min-height:64px}
.ck-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line2);color:transparent;flex:none}
.ck-btn:active{background:var(--ok);color:#0D0D0F}
.ok{color:var(--ok)}.bad{color:var(--bad)}
/* AGENDA */
.week7{display:grid;grid-template-columns:36px repeat(7,1fr) 36px;gap:4px;align-items:center}
.w7{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;justify-content:center;border-radius:14px;font-size:12px;color:var(--muted)}
.w7 b{font:700 17px var(--f-display);color:var(--text)}
.w7.today b{color:var(--accent-ink)}
.w7.on{background:linear-gradient(135deg,var(--accent),var(--blue))}.w7.on,.w7.on b{color:#fff}
.ag-list{display:flex;flex-direction:column;gap:8px}
.ag-row{position:relative;display:flex;align-items:stretch;border-radius:16px;background:var(--surface);border:1px solid var(--line);touch-action:pan-y;transition:transform var(--t1),box-shadow var(--t1)}
.ag-row.done{opacity:.7}.ag-row.skip{opacity:.5}.ag-row.skip b{text-decoration:line-through}
.ag-row.dragging{z-index:5;position:relative;box-shadow:var(--shadow);border-color:var(--accent);transition:none}
.ag-main{display:grid;grid-template-columns:62px 28px 1fr auto;align-items:center;gap:8px;width:100%;min-height:64px;padding:8px 12px;text-align:left}
.ag-main time{font:700 15px var(--f-display);color:var(--accent-ink)}
.ag-main b{display:block;font-weight:600}.ag-main small{display:block;font-size:12.5px;color:var(--muted)}
.ag-ic{color:var(--muted)}
.ag-done{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#0D0D0F}.ag-done .icon{width:16px;height:16px;stroke-width:3}
[tabindex="-1"]:focus{outline:none}
.ag-grip{width:44px;flex:none;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:ns-resize;border-left:1px solid var(--line)}
.drag-t{position:absolute;right:12px;top:-12px;background:var(--accent);color:#fff;font:700 13px var(--f-display);padding:3px 10px;border-radius:99px}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days7 button{min-height:44px;border-radius:12px;background:var(--surface2);font-size:12.5px;font-weight:600;color:var(--muted)}
.days7 button.on{background:var(--accent);color:#fff}
.acts{margin:4px 0}
.goal{display:flex;align-items:center;gap:8px;min-height:56px;border-top:1px solid var(--line)}.goal small{display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:96px;padding:14px;border-radius:16px;background:var(--surface2);text-align:left}
.tile-btn .icon{color:var(--accent);width:24px;height:24px}.tile-btn b{font-size:15.5px}.tile-btn small{font-size:12.5px;color:var(--muted)}
/* REGISTRAR (logo) */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:220;max-height:92dvh;display:flex;transform:translateY(105%);transition:transform var(--t3) var(--spring)}
.actions.on{transform:none}
.act-in{flex:1;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;border-top:1px solid var(--line2);padding:12px 16px calc(var(--sab) + 18px);box-shadow:var(--shadow)}
.act-head{display:flex;align-items:center;justify-content:space-between}
.act-search{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:52px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2)}
.act-search .icon{color:var(--muted)}.act-search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px;min-height:48px}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act-tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;min-height:92px;padding:14px 16px;border-radius:18px;background:var(--surface2);border:1px solid var(--line);text-align:left;transition:transform var(--t1)}
.act-tile .icon{width:28px;height:28px;color:var(--accent)}.act-tile b{font-size:16.5px;line-height:1.2}.act-tile small{font-size:13px;color:var(--muted)}
.act-tile:active{transform:scale(.96)}
.act-wide{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;border-radius:18px;background:var(--surface2);border:1px solid var(--line);text-align:left}
.act-wide>.icon:first-child{color:var(--accent);width:24px;height:24px}.act-wide b{display:block;font-size:16px}.act-wide small{font-size:13px;color:var(--muted)}
.act-wide.hi{border-color:var(--accent);background:linear-gradient(135deg,rgba(139,124,246,.16),var(--surface2))}
.act-back{display:flex;align-items:center;gap:6px;min-height:44px;font-weight:600;color:var(--accent-ink)}
.water-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wbtn.lg{min-height:84px}.wbtn.lg b{font-size:20px}
#pal-res{display:flex;flex-direction:column;gap:8px}
/* SAÚDE */
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line2);font-size:14.5px;color:var(--muted)}
.notice .icon{color:var(--accent);margin-top:2px}.notice b{color:var(--text)}
.med{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line2);border-left:4px solid var(--blue)}
.dose{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 12px;border-radius:14px;background:var(--surface2)}
.dose b{display:block;font:700 16px var(--f-display)}.dose small{display:block;font-size:12.5px;color:var(--muted)}
.dose.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface2))}.dose.ok small{color:var(--ok)}
.med-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:13.5px}
.kv{padding:8px 0;border-top:1px solid var(--line)}.kv p{font-size:14.5px;margin-top:2px}
details.supp>summary,details.tr>summary{gap:8px;min-height:64px}details.supp summary b,details.tr summary b{display:block}details.supp summary small,details.tr summary small{display:block;font-weight:400;font-size:13px}
.lvl-h{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.lvl-n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:800 18px var(--f-display);color:#fff;background:linear-gradient(135deg,var(--accent),var(--blue));flex:none}
.insight{display:flex;gap:8px;align-items:flex-start;padding:10px 0;font-size:15px;border-top:1px solid var(--line)}.insight .icon{color:var(--accent);margin-top:2px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--surface2)}
.ph img{width:100%;height:100%;object-fit:cover}.ph small{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--surface2)}.compare figcaption{text-align:center;font-size:13px;color:var(--muted)}
/* APETITE */
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.scale button{min-height:48px;border-radius:10px;font:700 15px var(--f-display);background:var(--surface2)}
.scale button.on{background:color-mix(in srgb,var(--bad) calc(var(--p) * 100%),var(--accent));color:#fff;transform:scale(1.08)}
.chips.lg .chip{min-height:44px;font-size:14.5px}
/* papel de parede */
.wall-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.wall-op{display:flex;flex-direction:column;gap:6px;align-items:center;min-height:44px;padding:6px;border-radius:14px;border:2px solid var(--line);font-size:13.5px;font-weight:600}
.wall-op span{width:100%;height:56px;border-radius:10px}
.wall-op.on{border-color:var(--accent)}
.pal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pal-op{display:flex;flex-direction:column;gap:6px;align-items:center;min-height:44px;padding:6px;border-radius:14px;border:2px solid var(--line);font-size:13px;font-weight:600;text-align:center}
.pal-op span{width:100%;height:32px;border-radius:10px}
.pal-op.on,.font-op.on{border-color:var(--accent)}
.font-list{display:grid;gap:8px;margin-bottom:12px}
.font-op{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);text-align:left}
.font-op b{font-size:16px}.font-op small{color:var(--muted);font-size:13px}
body.has-wall .block,body.has-wall .align{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* hero de frases */
.hero{position:relative;overflow:hidden;padding:26px 20px 14px;border-radius:var(--r-l);text-align:center;background:radial-gradient(90% 80% at 50% 0%,rgba(139,124,246,.45),transparent 70%),radial-gradient(80% 70% at 100% 100%,rgba(91,140,255,.35),transparent 70%),var(--surface);border:1px solid rgba(139,124,246,.35);box-shadow:var(--shadow);animation:rise var(--t3) var(--ease) both}
.hero-av{position:relative;width:96px;height:96px;margin:0 auto 14px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--accent),var(--blue));box-shadow:0 0 32px rgba(139,124,246,.55)}
.hero-av span,.hero-av img{position:absolute;inset:3px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font:700 30px var(--f-display);color:var(--accent-ink);object-fit:cover;width:calc(100% - 6px);height:calc(100% - 6px)}
.hero-q{font:700 22px/1.3 var(--f-display);letter-spacing:-.015em;margin:0}
.hero-a{margin-top:10px;color:var(--accent-ink);font-weight:600;font-size:14.5px}
.hero-next{margin-top:8px}
.ag-pill{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid rgba(139,124,246,.35);text-align:left}
.ag-pill .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none}
.hero-av img[hidden]{display:none}

/* ============ SEÇÕES: blocos das telas (corpo, treino, água, coach, ajustes) ============ */
.card.glow{background:linear-gradient(135deg,rgba(139,124,246,.1),var(--surface));border-color:rgba(139,124,246,.25)}
.card.meal{padding:4px 16px}.card.meal details.fold{border-top:0}
.card.meal summary small{display:block;font-size:13px;font-weight:400}
.sec-t{margin-bottom:10px}
.card>details.fold:first-child{border-top:0}
.set-row{min-height:52px}
.row.around{justify-content:space-around}.center{text-align:center}.right{text-align:right}
.unit{font-size:16px;color:var(--muted);font-weight:500}
.chart{width:100%;height:auto;margin:6px 0}.chart text{font:500 10px var(--f-body);fill:var(--muted)}
.chart .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ms-box{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 2px var(--line2);color:transparent}
.li.ok .ms-box{background:var(--ok);box-shadow:none;color:#0D0D0F}
.li small{display:block}
.weeks8{display:flex;gap:6px}.wsq{flex:1;text-align:center}.wsq i{display:block;height:34px;border-radius:9px}
.seg.neck button.on{background:color-mix(in srgb,var(--ok) calc(var(--n) * 18%),var(--surface))}
.daychips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dchip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-height:64px}
.dchip b{font:800 20px var(--f-display);color:var(--hue)}.dchip small{font-size:11px;color:var(--muted)}
.dchip.on{border-color:var(--hue);background:color-mix(in srgb,var(--hue) 14%,var(--surface))}
details.ex>summary{gap:8px;min-height:64px}details.ex>summary b{display:block;font-weight:600}details.ex>summary small{display:block;font-weight:400;font-size:13px}
.painhist{display:flex;gap:6px;flex-wrap:wrap}
.painhist span{display:flex;flex-direction:column;align-items:center;min-width:36px;padding:6px 4px;border-radius:10px;background:color-mix(in srgb,var(--bad) calc(var(--p) * 60%),var(--surface2))}
.painhist small{font-size:10px;color:var(--muted)}
.water-hero{display:flex;flex-direction:column;align-items:center;gap:14px}
.bottle-wrap{position:relative;width:190px}
.bottle{width:100%;height:auto;color:var(--muted);overflow:visible}
.wlevel{transition:transform 1.1s var(--ease)}
.wwave{animation:wave 3.2s linear infinite}.wwave.b{animation-duration:5s;animation-direction:reverse}
@keyframes wave{to{transform:translateX(-100px)}}
.bub{animation:bub 3.5s ease-in infinite}.bub.d2{animation-delay:1.2s}.bub.d3{animation-delay:2.1s}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.6}100%{transform:translateY(-230px);opacity:0}}
.bottle-txt{position:absolute;inset:40% 0 auto;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.bottle-txt .lbl{color:#fff;opacity:.85}
.wbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;border-radius:14px;background:rgba(86,182,247,.1);border:1px solid rgba(86,182,247,.22);color:var(--water)}
.wbtn b{font:700 17px var(--f-display)}.wbtn small{font-size:11.5px;color:var(--muted)}.wbtn:active{transform:scale(.94)}
.week{display:flex;gap:8px;align-items:flex-end;height:110px;padding-top:6px}
.week .d{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.week .d i{width:100%;border-radius:8px;transition:height var(--t3) var(--ease)}
.week .d span{font-size:11px;color:var(--muted)}.week .d.t span{color:var(--accent-ink);font-weight:700}
.wdrop{color:var(--water)}
.aura-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 10px}
.aura-core{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6 0,transparent 30%),conic-gradient(from 90deg,var(--accent),var(--c-e),var(--water),var(--accent));animation:orbspin 10s linear infinite;box-shadow:0 0 50px -6px rgba(139,124,246,.6)}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;animation:rise var(--t2) var(--ease) both;word-wrap:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent-hi),var(--accent));color:var(--on-accent);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err{border-color:var(--bad);color:var(--bad)}
.msg img{display:block;max-width:100%;border-radius:12px;margin-top:8px}
.msg.typing{display:flex;gap:5px;padding:14px}.msg.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:breathe 1s infinite}.msg.typing i:nth-child(2){animation-delay:.2s}.msg.typing i:nth-child(3){animation-delay:.4s}
.chat-bar{position:sticky;bottom:0;margin-top:auto!important;display:flex;align-items:flex-end;gap:4px;padding:8px;margin:0 -8px;border-radius:22px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-line)}
.chat-bar textarea{resize:none;min-height:44px;max-height:140px;padding:10px 12px;border-radius:14px}
.icon-btn.send{background:var(--accent);color:var(--on-accent)}
.li.prof.on{background:linear-gradient(90deg,rgba(139,124,246,.08),transparent)}
.li.prof>button{text-align:left;min-height:52px}
.li.ed{gap:4px}.li.ed .icon-btn{width:40px;height:40px}.li.ed .icon-btn .icon{width:18px;height:18px}
.grip{width:28px;height:40px;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:grab;flex:none}
.li.dragging{position:relative;z-index:5;background:var(--surface2);border-radius:12px;box-shadow:var(--shadow);transition:none}
.tiles4 .tile .h3{margin-top:2px}
.logo-card{display:grid;place-items:center}.logo-card img{border-radius:24px;max-width:200px;height:auto}
.powered{text-align:center;padding:10px 0 20px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.big-in{font:700 28px var(--f-display);text-align:center}

/* ============ TECLADO DE ALIMENTOS ============ */
.kb{display:flex;flex-direction:column;gap:10px}
.kb-sum{display:flex;justify-content:space-between;font:600 13px var(--f-body);padding:8px 12px;border-radius:12px;background:var(--surface2)}
.tray{display:flex;flex-direction:column;gap:6px}
.swipe{position:relative;border-radius:14px;overflow:hidden}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--bad);color:#fff;font-weight:600;font-size:14px;opacity:.55;transition:opacity var(--t1)}
.swipe.armed .swipe-bg{opacity:1}
.swipe-in{position:relative;display:flex;align-items:center;gap:8px;padding:8px 4px 8px 14px;background:var(--surface2);touch-action:pan-y;min-height:56px}
.swipe-in b{font-weight:600;font-size:14.5px;display:block}.swipe-in small{font-size:12.5px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.fkey{display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;min-height:62px;padding:8px 10px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);-webkit-touch-callout:none;transition:transform var(--t1) var(--ease),background var(--t1)}
.fkey b{font-size:13.5px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fkey small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fkey.fav{border-color:rgba(139,124,246,.35);background:linear-gradient(135deg,rgba(139,124,246,.12),var(--surface2))}
.fkey:active{transform:scale(.94);background:var(--surface3)}
.fkey.pop{animation:kpop 420ms var(--spring)}
@keyframes kpop{30%{transform:scale(1.08);box-shadow:0 0 0 3px var(--ok)}}
.kb-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .field{text-align:center;font:700 26px var(--f-display);flex:1}
.stepper.sm{gap:4px}.stepper.sm b{min-width:56px;text-align:center}
.food{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);min-height:56px;width:100%}
.food b{display:block;font-weight:600;font-size:15px}.food small{font-size:12.5px}.food .icon{color:var(--accent)}
.street{display:grid;gap:8px}
.flip{position:relative;display:grid;text-align:left;perspective:900px;min-height:108px}
.flip .face{grid-area:1/1;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:var(--surface2);border-left:3px solid var(--ok);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform 500ms var(--ease)}
.flip .face b{font-weight:500;font-size:14.5px}
.flip .face.bad{border-color:var(--bad);transform:rotateY(180deg)}
.flip.on .face.ok{transform:rotateY(-180deg)}.flip.on .face.bad{transform:none}

/* ============ ARENA E DESCANSO ============ */
.arena{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;flex-direction:column;opacity:0;transform:scale(1.04);pointer-events:none;transition:opacity var(--t3) var(--ease),transform var(--t3) var(--ease);--hue:var(--accent)}
.arena.on{opacity:1;transform:none;pointer-events:auto}
.arena::before{content:"";position:absolute;inset:0 0 auto;height:55%;background:radial-gradient(90% 70% at 50% 0%,color-mix(in srgb,var(--hue) 22%,transparent),transparent 70%);pointer-events:none}
.arena-in{position:relative;flex:1;display:flex;flex-direction:column;max-width:600px;width:100%;margin:0 auto;min-height:0;padding-top:var(--sat)}
.ar-top{display:flex;align-items:center;gap:8px;padding:8px 10px}
.ar-title b{display:block;font:600 15px var(--f-display)}.ar-title small{font-size:12.5px;color:var(--muted)}
.ar-letter{font:800 34px/1 var(--f-display);color:var(--hue);opacity:.9;padding-right:8px}
.ar-prog{display:flex;gap:4px;padding:0 16px}
.ar-prog i{flex:1;height:4px;border-radius:4px;background:var(--surface3);transition:background var(--t3)}
.ar-prog i.done{background:var(--hue);opacity:.55}.ar-prog i.cur{background:var(--hue);box-shadow:0 0 10px var(--hue)}
.ar-stage{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;animation:rise var(--t3) var(--ease)}
.ar-name{font:700 30px/1.08 var(--f-display);letter-spacing:-.025em}
.ghost{font-size:13.5px;color:var(--muted);padding:8px 12px;border-radius:12px;border:1px dashed var(--line2)}
.hint{font-size:14.5px;color:var(--hue);font-weight:500}
.how{font-size:15px;line-height:1.55;color:var(--text);opacity:.88}
.dial-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.dial{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.dial .icon-btn{width:56px;height:56px;background:var(--surface2);border:1px solid var(--line2)}
.dial-v{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;touch-action:none;cursor:ns-resize;padding:4px 10px;border-radius:18px;position:relative}
.dial-v::before,.dial-v::after{content:"";position:absolute;left:50%;width:18px;height:3px;border-radius:3px;background:var(--line2);transform:translateX(-50%)}
.dial-v::before{top:-4px}.dial-v::after{bottom:-4px}
.dial-v input{width:3.6ch;background:none;border:0;outline:none;text-align:center;font:800 72px/1 var(--f-display);letter-spacing:-.04em;color:var(--text);padding:0}
.dial-v span{font:600 13px var(--f-body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.dial.small .dial-v input{font-size:40px;width:2.6ch}
.dial.noload{display:none}
.pips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pip{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px;min-height:56px}
.pip i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-display);font-style:normal;border:2px solid var(--line2);transition:all var(--t2) var(--spring)}
.pip small{font-size:11px;color:var(--muted)}
.pip.cur i{border-color:var(--hue);box-shadow:0 0 0 4px color-mix(in srgb,var(--hue) 25%,transparent)}
.pip.done i{background:var(--hue);border-color:var(--hue);color:#0D0D0F}
.pip.pop i{animation:kpop 480ms var(--spring)}
.setrows{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center}
.setrow .n{font:700 15px var(--f-display);color:var(--muted);text-align:center}
.ar-bar{display:flex;align-items:center;gap:8px;padding:10px 12px calc(var(--sab) + 12px);background:linear-gradient(0deg,var(--bg) 60%,transparent)}
.icon-btn.lg{width:56px;height:56px;background:var(--surface2);border:1px solid var(--line2)}
.btn.cta{min-height:60px;font-size:16px;letter-spacing:.02em;background:linear-gradient(135deg,color-mix(in srgb,var(--hue) 70%,#fff),var(--hue));box-shadow:0 12px 36px -10px var(--hue)}
.rest{position:fixed;inset:0;z-index:170;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity var(--t3) var(--ease)}
.rest.on{opacity:1;pointer-events:auto}
.rest-in{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(360px,90vw);padding-bottom:var(--sab)}
.rest-in .ring .arc{transition:stroke-dashoffset 250ms linear}
.rest-time{font:800 64px/1 var(--f-display);letter-spacing:-.03em}
.rest-next{color:var(--muted);text-align:center;min-height:1.4em}
.rest-btns{width:100%}
.painscale{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.painscale button{min-height:52px;border-radius:14px;font:700 18px var(--f-display);background:color-mix(in srgb,var(--bad) calc(var(--p) * 70%),color-mix(in srgb,var(--ok) 35%,var(--surface2)))}
.painscale button:active{transform:scale(.92)}
.receipt .li{animation:rise var(--t3) var(--ease) both}
.receipt .up{color:var(--ok)}.receipt .down{color:var(--warn)}

  async put(v, k = "state2") { try { const db = await this.open(); db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch (e) { } },
  async get(k = "state2") { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } }

/* ============ REGRAS: dia, hábitos, sequências, ausência e metas (Mifflin-St Jeor) ============ */
const newDay = () => ({ h: {}, s: {}, water: 0, meals: [] });

function isActive(k) {
  const h = D(k).h, r = S.settings.rule1;
  const others = S.habits.filter(x => x.id !== r && h[x.id]).length;
  return !!h[r] && others >= S.settings.needOthers;

const activeInWeek = mk => { let n = 0; for (let i = 0; i < 7; i++) if (isActive(addDays(mk, i))) n++; return n; };
// semana verde = 5+ dias ativos; amarela (4) não quebra; só 2 semanas ruins seguidas zeram
function weekStreak() {
  const cur = mondayOf(today()), first = mondayOf(firstDay());
  let n = activeInWeek(cur) >= 5 ? 1 : 0, reds = 0;
  for (let mk = addDays(cur, -7); mk >= first; mk = addDays(mk, -7)) {
    const a = activeInWeek(mk);
    if (a >= 5) { n++; reds = 0; } else if (a === 4) { reds = 0; } else { reds++; if (reds >= 2) break; }
  }
  return n;
}

  if (S.cur) return 0;

/* ============ PROGRESSÃO AUTOMÁTICA (carga, variações e sequência A a E) ============ */
// Regra aplicada ao fim de cada treino, por exercício:
//  - fechou todas as repetições do topo da faixa em todas as séries: sobe um degrau (fora da adaptação)
//  - falhou na 1ª série ou em 2+ séries abaixo do mínimo da faixa: desce um degrau
//  - senão: mantém e busca o topo da faixa

  const top = sets.length >= slot.sets && sets.every(s => s.reps >= slot.reps[1]);
  const low = sets.filter(s => s.reps < slot.reps[0]).length;
  const fail = sets.length && (sets[0].reps < slot.reps[0] || low >= 2);
  if (top && inc && !adapt) return { dir: "up", kg: r1(kg + inc), inc, why: "Fechou todas as repetições." };
  if (fail && inc && kg > 0) return { dir: "down", kg: r1(Math.max(0, kg - inc)), inc, why: "Não fechou as repetições." };
  return { dir: "hold", kg, inc: 0, why: top && adapt ? "Adaptação: sem subir ainda." : `Busque ${slot.reps[1]} ${slot.unit ? "s" : "reps"} em todas as séries.` };

  if (!last) { for (let i = 0; i < slot.sets; i++) out.push({ kg: 0, reps: slot.reps[0], done: false }); return { sets: out, hint, ghost: null }; }
  const nx = nextLoad(slot, last.sets), delta = nx.kg - (last.sets[0] ? last.sets[0].kg : 0);
  for (let i = 0; i < slot.sets; i++) { const ls = last.sets[i] || last.sets[last.sets.length - 1]; out.push({ kg: r1(Math.max(0, ls.kg + delta)), reps: nx.dir === "hold" ? ls.reps : slot.reps[0], done: false }); }
  hint = `${nx.dir === "up" ? `Hoje +${nx.inc} kg` : nx.dir === "down" ? `Hoje −${nx.inc} kg` : "Mantenha a carga"}. ${nx.why}`;
  return { sets: out, hint, ghost: `${dispDate(last.date)}: ${last.sets.map(s => `${s.kg}×${s.reps}`).join(" · ")}` };

/* ============ ÁGUA: registro, ritmo por hora (6h–21h), sequência na meta ============ */
const WSIZES = [["Gole", 100], ["Copo", 200], ["Copo grande", 300], ["Garrafa", 500], ["Squeeze", 750], ["1 litro", 1000]];
const W_FROM = 6, W_TO = 21;
function waterAdd(ml, k = today()) {
  const d = DW(k), goal = S.settings.waterGoal, before = d.water || 0;

  return before < goal && d.water >= goal;
}
function waterUndo(k = today()) {
  const d = DW(k); d.wlog = d.wlog || [];
  const last = d.wlog.pop(); d.water = Math.max(0, (d.water || 0) - (last ? last.ml : 250));
  setLinked(k, "agua", d.water >= S.settings.waterGoal); save();
  return last;
}
function waterGoalAdj(delta) {
  S.settings.waterGoal = clamp(S.settings.waterGoal + delta, 1000, 8000);
  const d = DW(today()); setLinked(today(), "agua", (d.water || 0) >= S.settings.waterGoal); save();
}
function waterStreak() {
  let n = 0, k = today(); if ((D(k).water || 0) < S.settings.waterGoal) k = addDays(k, -1);
  while ((D(k).water || 0) >= S.settings.waterGoal) { n++; k = addDays(k, -1); }

}
// quanto deveria ter bebido até a hora h (linear das 6h às 21h, arredondado a 50 ml)
const waterExpected = h => Math.round(S.settings.waterGoal * clamp((h - W_FROM) / (W_TO - W_FROM), 0, 1) / 50) * 50;
// hora do dia em que o volume bebido "estaria no ritmo" (usada para desenhar a maré no rio)
const waterHourFor = ml => W_FROM + (W_TO - W_FROM) * clamp(ml / S.settings.waterGoal, 0, 1);
function waterPace(w) {
  const now = new Date(), h = now.getHours() + now.getMinutes() / 60, goal = S.settings.waterGoal;
  const exp = waterExpected(h), diff = w - exp;
  if (w >= goal) return ["ok", "Meta batida. Agora é só beber quando sentir sede.", exp];
  if (h < W_FROM) return ["acc", "Comece o dia com um copo grande ao acordar.", exp];
  if (diff >= 0) return ["ok", `No ritmo: ${diff ? "+" + diff + " ml à frente" : "exatamente no alvo"} (esperado até agora: ${exp} ml).`, exp];
  return [diff < -700 ? "warn" : "acc", `${-diff} ml atrás do ritmo. Um copo agora resolve (esperado até agora: ${exp} ml).`, exp];
}

const waterAvg7 = () => Math.round(Array.from({ length: 7 }, (_, i) => D(addDays(today(), -i)).water || 0).reduce((a, b) => a + b, 0) / 7);

/* ============ COMIDA: registrar, favoritos por refeição, repetir, fibras, busca ============ */

/* ============ MOTOR METABÓLICO: proteína e água para o resto do dia ============ */
const END_OF_DAY = 22;
const gramsFor = (nome, alvoProt) => { const f = FOODS[foodIdx(nome)]; return f ? Math.round(alvoProt / (f[2] / 100)) : 0; };
// quanto comer de cada fonte para bater t gramas de proteína (valores da tabela do app)
function protExamples(t) {
  const ovo = FOODS[foodIdx("Ovo de galinha cozido")];
  return [
    `~${gramsFor("Peito de frango grelhado", t)} g de frango grelhado`, `~${gramsFor("Patinho grelhado", t)} g de patinho`,
    `~${Math.round(t / (ovo[2] * ovo[4] / 100))} ovos cozidos`, `~${gramsFor("Queijo mussarela", t)} g de queijo mussarela`,
    `~${gramsFor("Albumina (pó)", t)} g de albumina em pó`
  ];
}
function dietAdvice(d, now, remP, perMeal) {
  const timed = (d.meals || []).filter(m => m.t), last = timed.length ? new Date(timed[timed.length - 1].t) : null;
  if (remP <= 0) return { txt: "Meta de proteína batida. Se comer mais tarde, priorize fibras e vegetais.", next: null };
  if (!last) return { txt: `Primeira refeição do dia? Faltam ${Math.round(remP)} g. Comece com ${perMeal} g de proteína.`, next: now };
  const diffHrs = (now - last) / 36e5, nx = new Date(last.getTime() + 3.5 * 36e5);
  if (diffHrs < 2) return { txt: `Você comeu há pouco. Próxima refeição sugerida às ${hhmm(nx)}. Faltam ${Math.round(remP)} g de proteína no dia.`, next: nx };
  if (diffHrs >= 3.5) return { txt: `Já dá para comer de novo. Faltam ${Math.round(remP)} g no dia: tente ${perMeal} g na próxima refeição.`, next: now };
  return { txt: `Faltam ${Math.round(remP)} g no dia. Sugestão para a próxima refeição: ${perMeal} g de proteína.`, next: nx };
}
function getMetabolicAdvice(k = today()) {
  const d = D(k), tg = TG(), tot = dayTotals(k), now = new Date(), h = now.getHours();
  if (h >= END_OF_DAY) return { diet: "Dia finalizado. Hora de descansar o sistema digestivo.", water: "Beba água com moderação agora para não prejudicar o sono.", ex: [], next: null, per: 0 };
  if (h < 5) return { diet: "Madrugada. Se estiver acordado, mantenha-se hidratado.", water: "Beba água se tiver sede.", ex: [], next: null, per: 0 };
  const remP = Math.max(0, tg.prot - tot.p), hoursLeft = END_OF_DAY - h;
  const perMeal = Math.round(remP / Math.max(1, Math.floor(hoursLeft / 3.5)));
  const da = dietAdvice(d, now, remP, perMeal), t = perMeal > 0 ? perMeal : Math.round(remP);
  const remW = Math.max(0, S.settings.waterGoal - (d.water || 0)), mlh = Math.round(remW / hoursLeft);
  const water = remW <= 0 ? "Meta de hidratação batida." : mlh > 600 ? "Você está atrasado na água para este horário. Beba 500 ml agora." : `Ritmo ideal: cerca de ${mlh} ml por hora até as ${END_OF_DAY}h.`;
  return { diet: da.txt, water, ex: remP > 0 ? protExamples(t) : [], per: t, next: da.next };
}

/* ============ AGENDA: rotina ≠ horário fixo ============ */
// item = { id, type, ref, title, days:[0..6] (recorrente) | date:"AAAA-MM-DD" (evento único), at:"HH:MM" ("" = flexível), period, dur }
// type: treino | refeicao | remedio | suplemento | habito | atividade | consulta
// S.sched.ov[dia][id] = exceções só daquele dia: { at, dur, period, skip, done }
const TYPES = {
  treino: ["Treino", "dumb"], refeicao: ["Refeição", "fork"], remedio: ["Remédio", "pill"], suplemento: ["Suplemento", "leaf"],
  habito: ["Hábito", "check"], atividade: ["Atividade", "flame"], consulta: ["Consulta", "user"]
};
const PERIODS = { "": "Qualquer hora", manha: "Manhã", tarde: "Tarde", noite: "Noite" };
const PERIOD_MIN = { "": 12 * 60, manha: 9 * 60, tarde: 15 * 60, noite: 20 * 60 };
const EVERY = [0, 1, 2, 3, 4, 5, 6], WEEKDAYS = [1, 2, 3, 4, 5];
const schedItem = (type, ref, title, o = {}) => Object.assign({ id: uid("a"), type, ref: ref || "", title, days: EVERY.slice(), date: "", at: "", period: "", dur: 15 }, o);
// rotina inicial a partir do perfil (usada na migração e em perfis novos)
function defaultSched(p) {
  const hb = id => p.habits.find(h => h.id === id), it = [];
  it.push(schedItem("treino", "", "Treino", { days: WEEKDAYS.slice(), at: (hb("treino") || {}).at || "05:00", dur: 60 }));
  MEAL_NAMES.forEach(m => it.push(schedItem("refeicao", m, m, { at: MEAL_AT[m], dur: 30 })));
  p.supps.forEach(s => it.push(schedItem("suplemento", s.id, s.n, { at: s.at || "", period: s.at ? "" : "manha", dur: 5 })));
  (p.meds || []).forEach(m => (m.times || []).forEach(t => it.push(schedItem("remedio", m.id, m.n, { at: t, dur: 5 }))));
  p.habits.filter(h => h.at && h.link !== "treino").forEach(h => it.push(h.id === "caminhada"
    ? schedItem("habito", h.id, h.t, { period: "noite", dur: 30 }) : schedItem("habito", h.id, h.t, { at: h.at, dur: 15 })));
  return { items: it, ov: {} };
}
const ovOf = (k, id) => ((S.sched.ov[k] || {})[id]) || {};
function setOv(k, id, patch) { const d = S.sched.ov[k] = S.sched.ov[k] || {}; d[id] = Object.assign(d[id] || {}, patch); save(); }
const occurs = (it, k) => it.date ? it.date === k : it.days.includes(parseKey(k).getDay()) && (!it.from || k >= it.from) && (!it.until || k <= it.until);
// feito? cada tipo olha o registro real do dia (refeição registrada, dose tomada, hábito marcado...)
function instDone(it, k, o) {
  const d = D(k);
  if (o.done) return true;
  if (it.type === "refeicao") return mealItems(it.ref, k).length > 0;
  if (it.type === "treino") return !!d.wk;
  if (it.type === "remedio") return !!(d.med && d.med[it.id]);
  if (it.type === "suplemento") return !!d.s[it.ref];
  if (it.type === "habito") return !!d.h[it.ref];

}

    const o = ovOf(k, it.id), at = o.at != null ? o.at : it.at, period = o.period != null ? o.period : it.period;
    const skip = !!o.skip || (it.type === "treino" && !!D(k).skipWk);
    return { id: it.id, it, k, at, period, dur: o.dur || it.dur, skip, done: instDone(it, k, o), min: at ? toMin(at) : PERIOD_MIN[period], flex: !at, moved: o.at != null && o.at !== it.at };

}
const hasTrainItem = k => instances(k).some(x => x.it.type === "treino");
// editar: "só hoje" vira exceção do dia; "sempre" muda a rotina (a partir de hoje)
function schedEdit(k, id, patch, always) {

  if (always || it.date) { Object.assign(it, patch); if (S.sched.ov[k] && S.sched.ov[k][id]) ["at", "dur", "period"].forEach(f => { if (f in patch) delete S.sched.ov[k][id][f]; }); save(); }
  else setOv(k, id, patch);
}
function schedSkip(k, id, v = true) {

}

function schedRemove(k, id, always) {

const nextInst = (k = today(), from = nowMin()) => instances(k).filter(x => !x.done && !x.skip && x.min >= from - 30);

/* ============ MEDICAMENTOS: prescrição informada pelo usuário, doses registradas com horário, adesão ============ */
// S.meds = [{ id, n, dose, withMeal, doctor, start, notes }] · horários = itens "remedio" da agenda (ref = id)
// dose tomada: D(dia).med[idDoItemDaAgenda] = "HH:MM"
const medById = id => (S.meds || []).find(m => m.id === id);

function medSave(o, times) {

  if (m) Object.assign(m, o); else { m = Object.assign({ id: uid("m"), start: today() }, o); S.meds.push(m); }

function medRemove(id) { S.meds = S.meds.filter(m => m.id !== id); S.sched.items = S.sched.items.filter(x => !(x.type === "remedio" && x.ref === id)); save(); }
function doseLog(k, itemId, t = hhmm(new Date())) { const d = DW(k); d.med = d.med || {}; d.med[itemId] = t; save(); }
function doseUndo(k, itemId) { const d = DW(k); if (d.med) delete d.med[itemId]; save(); }
// doses de hoje de um remédio: [{ inst, taken }]
const medToday = (id, k = today()) => instances(k).filter(x => x.it.type === "remedio" && x.it.ref === id && !x.skip).map(x => ({ inst: x, taken: (D(k).med || {})[x.id] || "" }));
// adesão: doses registradas / doses previstas nos últimos N dias em que o app foi usado (dias pulados não contam)
function adherence(id, n = 30) {
  let due = 0, ok = 0;
  for (let i = 0; i < n; i++) {
    const k = addDays(today(), -i), start = (medById(id) || {}).start;
    if (start && k < start) break;
    if (i > 0 && !hasData(S.days[k])) continue;
    medToday(id, k).forEach(x => { if (i === 0 && x.inst.min > nowMin()) return; due++; if (x.taken) ok++; });
  }
  return { due, ok, pct: due ? Math.round(ok / due * 100) : null };
}
// doses que já passaram do horário hoje e não foram registradas
const dosesLate = (k = today()) => (S.meds || []).flatMap(m => medToday(m.id, k)).filter(x => !x.taken && x.inst.min <= nowMin());
/* ---- perguntas para a próxima consulta ---- */
function questionAdd(text, src = "") { if (!text.trim()) return null; const q = { id: uid("q"), text: text.trim().slice(0, 240), src, done: false, d: today() }; S.questions.push(q); save(); return q; }
const questionsOpen = () => S.questions.filter(q => !q.done);

/* ============ APETITE: fome, vontade, perda de controle, gatilhos, sono e estresse → padrões ============ */
// S.hunger = [{ t, d, fome 0–10, vontade 0–10, perda, gat: [...], estresse 0–10 | null }] · D(dia).sleep = horas dormidas
const GATILHOS = ["Fome real", "Cansaço", "Estresse", "Tédio", "Ansiedade", "Social / festa", "Viu ou sentiu cheiro", "Pulei refeição", "Dormi mal", "Recompensa"];
function hungerLog(o) {
  const e = { t: Date.now(), d: today(), fome: clamp(Math.round(num(o.fome)), 0, 10), vontade: clamp(Math.round(num(o.vontade)), 0, 10), perda: !!o.perda, gat: (o.gat || []).filter(g => GATILHOS.includes(g)), estresse: o.estresse == null ? null : clamp(Math.round(num(o.estresse)), 0, 10) };
  S.hunger.push(e); save(); return e;
}
function sleepLog(h, k = today()) { if (!(h >= 0 && h <= 16)) return false; DW(k).sleep = r1(h); save(); return true; }
const hungerOn = k => S.hunger.filter(x => x.d === k);
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const hourOf = t => new Date(t).getHours();
// última refeição antes do registro de fome (horas)
function gapBefore(e) { const ts = D(e.d).meals.map(m => m.t).filter(t => t && t <= e.t); return ts.length ? (e.t - Math.max(...ts)) / 36e5 : null; }
// padrões calculados só com os seus registros; cada um exige um mínimo de dados e diz em quantos se baseou
function insightSleep() {
  const days = [...new Set(S.hunger.map(x => x.d))].map(k => ({ s: D(k).sleep, f: Math.max(-1, ...hungerOn(k).filter(x => hourOf(x.t) >= 18).map(x => x.fome)) })).filter(x => x.s != null && x.f >= 0);
  const lo = days.filter(x => x.s < 6).map(x => x.f), hi = days.filter(x => x.s >= 6).map(x => x.f);
  if (lo.length < 3 || hi.length < 3 || avg(lo) - avg(hi) < 1) return null;
  return `Nos ${lo.length} dias em que você dormiu menos de 6 h, sua fome à noite foi em média ${r1(avg(lo))}, contra ${r1(avg(hi))} nos ${hi.length} dias com 6 h ou mais.`;
}
function insightStress() {
  const s = S.hunger.filter(x => x.estresse != null), hi = s.filter(x => x.estresse >= 6).map(x => x.vontade), lo = s.filter(x => x.estresse < 6).map(x => x.vontade);
  if (hi.length < 4 || lo.length < 4 || avg(hi) - avg(lo) < 1.5) return null;
  return `Com estresse alto (6+), sua vontade de comer foi em média ${r1(avg(hi))}; com estresse menor, ${r1(avg(lo))} (${hi.length + lo.length} registros).`;
}
function insightGap() {
  const g = S.hunger.map(x => [gapBefore(x), x.fome]).filter(x => x[0] != null), long = g.filter(x => x[0] >= 4).map(x => x[1]), short = g.filter(x => x[0] < 4).map(x => x[1]);
  if (long.length < 4 || short.length < 4 || avg(long) - avg(short) < 1.5) return null;
  return `Quando passam 4 h ou mais desde a última refeição, sua fome chega em média a ${r1(avg(long))}, contra ${r1(avg(short))} com intervalos menores (${g.length} registros).`;
}
function insightTrigger() {
  const ep = S.hunger.filter(x => x.perda); if (ep.length < 2) return null;
  const c = {}; ep.forEach(x => x.gat.forEach(g => c[g] = (c[g] || 0) + 1));
  const top = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  return top && top[1] >= 2 ? `Em ${top[1]} dos ${ep.length} episódios de perda de controle, o gatilho marcado foi "${top[0]}".` : null;
}
function insightHour() {
  if (S.hunger.length < 8) return null;
  const b = {}; S.hunger.forEach(x => { const h = Math.floor(hourOf(x.t) / 3) * 3; (b[h] = b[h] || []).push(x.fome); });
  const top = Object.entries(b).filter(([, a]) => a.length >= 3).sort((x, y) => avg(y[1]) - avg(x[1]))[0];
  return top ? `Sua fome costuma ser maior entre ${pad(+top[0])}h e ${pad(+top[0] + 3)}h (média ${r1(avg(top[1]))}, ${top[1].length} registros).` : null;
}
const hungerInsights = () => [insightSleep(), insightStress(), insightGap(), insightTrigger(), insightHour()].filter(Boolean);

/* ============ AGORA: a ação mais relevante do momento + "dia alinhado %" ============ */
// cada candidato: { id, pri, kick, title, text, act, data, label, alt } — o de maior prioridade vira o card AGORA
const cand = (id, pri, kick, title, text, act, label, data = {}, alt = null) => ({ id, pri, kick, title, text, act, label, data, alt });
function candSignals(k) {
  const out = [], abs = daysAbsent(), ab = ABSENCE.find(a => abs >= a.min), pa = painAvg();
  if (ab) out.push(cand("abs", 95, "Bem-vindo de volta", `${abs} dias sem registro`, ab.txt, "habit", "Marcar a Regra nº 1", { id: S.settings.rule1 }));
  if (pa !== null && pa >= 4) out.push(cand("pain", 45, "Ombro", "Dor em alta", `Média das 3 últimas: ${r1(pa)}/10. Procure um fisioterapeuta antes de aumentar carga de empurrar.`, "go", "Ver treino", { tab: "treino" }));
  if (deloadSignal()) out.push(cand("deload", 44, "Treino", "Sinal de deload", "3 ou mais exercícios falharam 2 sessões seguidas com a mesma carga. Reduza cerca de 20% nesta semana e reavalie.", "go", "Ver treino", { tab: "treino" }));
  if (backupDays() > 21) out.push(cand("backup", 35, "Seus dados", "Backup atrasado", `${S.settings.lastBackup ? `Último backup há ${backupDays()} dias.` : "Você nunca exportou um backup."} O arquivo .json é o único que sobrevive à troca de celular.`, "export", "Exportar agora"));
  if (parseKey(k).getDay() === 1 && !S.weights.some(w => w.d >= mondayOf(k)) && new Date().getHours() < 12) out.push(cand("weigh", 75, "Segunda-feira", "Dia de pesagem", "Ao acordar, depois do banheiro, antes de comer. Meça a cintura junto.", "weigh", "Registrar peso"));
  return out;
}
function candInst(x, now) {
  const t = x.it.type, when = x.flex ? PERIODS[x.period].toLowerCase() : x.at, soon = x.min - now, late = soon < -30;
  const kick = late ? "Ficou para trás" : soon > 0 && !x.flex ? `Em ${soon} min · ${x.at}` : x.flex ? `Hoje · ${when}` : `Agora · ${x.at}`;
  const pri = late ? 60 : 70;
  if (t === "treino") { const L = planLetter(x.k) || seqNext(); return cand("i" + x.id, late ? 62 : 85, kick, `Treino ${L} · ${PLAN[L].name}`, `≈ ${estMin(L)} min. ${PLAN[L].cuff ? "Começa com aquecimento de manguito." : "Sem aquecimento de manguito hoje."}`, "wk-start", "Entrar na Arena", { day: L }, ["wk-skip", "Não vou hoje"]); }
  if (t === "refeicao") { const a = getMetabolicAdvice(x.k); return cand("i" + x.id, pri, kick, x.it.title, a.per > 0 ? `Faltam ${Math.round(Math.max(0, TG().prot - dayTotals(x.k).p))} g de proteína hoje. Mire ${a.per} g nesta refeição.` : MEALS.find(m => m[0] === x.it.ref)[1], "meal-open", `Registrar ${x.it.title.toLowerCase()}`, { m: x.it.ref }, ["inst-skip", "Pular", { id: x.id }]); }
  if (t === "remedio") { const m = medById(x.it.ref) || {}; return cand("i" + x.id, late ? 90 : 88, kick, x.it.title, `${m.dose ? m.dose + ". " : ""}${m.withMeal ? "Tomar com a refeição." : ""}`, "dose-log", "Registrar dose", { id: x.id }); }
  if (t === "suplemento") { const s = S.supps.find(y => y.id === x.it.ref) || {}; return cand("i" + x.id, pri - 5, kick, x.it.title, s.tip || "", "supp", "Marcar como tomado", { id: x.it.ref }); }
  if (t === "habito") return cand("i" + x.id, pri - 5, kick, x.it.title, "", "habit", "Marcar como feito", { id: x.it.ref });
  return cand("i" + x.id, pri, kick, x.it.title, x.it.type === "consulta" ? "Leve suas perguntas para o médico." : "", "inst-done", "Concluir", { id: x.id }, ["inst-skip", "Pular", { id: x.id }]);
}
function candidates(k = today()) {
  const now = nowMin(), h = now / 60, d = D(k), out = candSignals(k);
  if (S.cur) out.push(cand("cur", 100, "Treino em andamento", `Treino ${S.cur.day} · ${PLAN[S.cur.day].name}`, "Continue de onde parou.", "wk-resume", "Continuar na Arena"));
  if (h >= 4 && h < 12 && d.sleep == null) out.push(cand("sleep", 80, "Bom dia", "Como você dormiu?", "Horas de sono ajudam o Coach a entender sua fome e seu treino.", "sleep-open", "Registrar sono"));
  instances(k).filter(x => !x.done && !x.skip && x.min - now <= 45 && x.min - now >= -180 && !(x.flex && h < 11 && x.period === "noite")).forEach(x => out.push(candInst(x, now)));
  const w = d.water || 0, [, , exp] = waterPace(w);
  if (h >= 7 && h < 21 && exp - w > 400) out.push(cand("water", 65, "Hidratação", `Faltam ${fmtL(S.settings.waterGoal - w)} L para sua meta`, `${exp - w} ml atrás do ritmo de agora.`, "w-add", "Beber 300 ml", { ml: 300 }, ["plus-water", "Outro valor"]));
  if (h >= 20.5 && !hungerOn(k).length) out.push(cand("hunger", 55, "Fim do dia", "Como está sua fome hoje?", "Leva 5 segundos e ajuda a achar padrões.", "hunger-open", "Registrar fome"));
  if (h >= 19 && !d.h[S.settings.rule1]) { const r = S.habits.find(x => x.id === S.settings.rule1); if (r) out.push(cand("rule1", 50, "Regra nº 1", r.t + "?", "Se cumprir uma regra só hoje, que seja esta.", "habit", "Sim, cumpri", { id: r.id })); }
  return out.sort((a, b) => b.pri - a.pri);
}
function agoraCard(k = today()) {
  const c = candidates(k).find(x => !(UI.snooze[x.id] > Date.now()));
  if (c) return c;
  const nx = nextInst(k)[0];
  return nx ? cand("next", 1, "A seguir", nx.it.title, nx.flex ? `Hoje, ${PERIODS[nx.period].toLowerCase()}.` : `Às ${nx.at}.`, "agenda-open", "Ver agenda")
    : cand("end", 0, "Dia fechado", "Nada pendente agora", "Tudo registrado. Descanse bem.", "agenda-open", "Ver agenda");
}
/* ---- dia alinhado: só entra o que já dá para medir ---- */
function alignment(k = today()) {
  const tk = k === today(), h = nowMin() / 60, d = D(k), tg = TG(), frac = tk ? clamp((h - 6) / 15, 0.1, 1) : 1, parts = [], r = S.settings.rule1;
  const add = (id, label, pts, f, note) => parts.push({ id, label, pts, f: clamp(f, 0, 1), note });
  add("rule1", "Regra nº 1", 25, d.h[r] ? 1 : 0, (S.habits.find(x => x.id === r) || {}).t || "");
  const others = S.habits.filter(x => x.id !== r && d.h[x.id]).length;
  add("habits", "Outros hábitos", 15, S.settings.needOthers ? others / S.settings.needOthers : 1, `${others} de ${S.settings.needOthers} para o dia contar`);
  add("prot", "Proteína no ritmo", 15, dayTotals(k).p / (tg.prot * frac), `${Math.round(dayTotals(k).p)} de ${tg.prot} g`);
  const w = d.water || 0, we = tk ? Math.max(1, waterPace(w)[2]) : S.settings.waterGoal;
  add("water", "Água no ritmo", 15, w / we, `${fmtL(w)} de ${fmtL(S.settings.waterGoal)} L`);
  const tr = instances(k).find(x => x.it.type === "treino");
  if (tr && (tr.done || tr.skip || !tk || nowMin() > tr.min + 90)) add("train", "Treino", 15, tr.done ? 1 : tr.skip ? 0.5 : 0, tr.done ? "Feito" : tr.skip ? "Pulado (a sequência não quebra)" : "Não registrado");
  const due = (S.meds || []).flatMap(m => medToday(m.id, k)).filter(x => !tk || x.inst.min <= nowMin());
  if (due.length) add("meds", "Remédios no horário", 15, due.filter(x => x.taken).length / due.length, `${due.filter(x => x.taken).length} de ${due.length} doses`);
  const tot = parts.reduce((a, p) => a + p.pts, 0);
  return { pct: Math.round(parts.reduce((a, p) => a + p.pts * p.f, 0) / tot * 100), parts };
}

/* ============ BACKUP: camada 3 (arquivo .json) e estado sem segredos ============ */
// Todo backup e toda cópia na nuvem passam por safeState(): nunca levam chave do Gemini, token nem gist id.
function safeState() {
  const c = JSON.parse(JSON.stringify(R));
  Object.values(c.profiles).forEach(p => SECRET_KEYS.forEach(k => delete p.settings[k]));
  return c;
}
function download(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportData() {
  download(new Blob([JSON.stringify(safeState(), null, 1)], { type: "application/json" }), `still-i-rise-backup-${today()}.json`);
  Object.values(R.profiles).forEach(p => p.settings.lastBackup = today());
  save(); toast("Backup exportado."); render();
}
// aceita backup v2 (todos os perfis) ou v1 (um perfil: substitui o perfil ativo)
function importObject(o) {
  if (o && o.v === 2 && o.profiles) { R = mergeRoot(o); useProfile(R.active); return "todos os perfis"; }
  if (o && o.profile && o.days) { const id = R.active, p = mergeProfile(o); p.id = id; R.profiles[id] = p; useProfile(id); return "perfil " + p.profile.name; }
  throw new Error("formato desconhecido");
}
function importFile(f) {
  return f.text().then(tx => {
    const o = JSON.parse(tx);
    if (!(o && (o.profiles || (o.profile && o.days)))) throw 0;
    if (!confirm("Importar substitui os dados atuais deste aparelho. Continuar?")) return;
    const what = importObject(o); save(); applyTheme(); closeAll(); render(); toast("Backup importado: " + what + ".");
  }).catch(() => toast("Arquivo inválido."));
}
// alerta quando o último backup .json passou de 21 dias
function backupDays() {
  const bk = S.settings.lastBackup;
  return bk ? diffDays(today(), bk) : (Object.keys(S.days).length ? diffDays(today(), firstDay()) : 0);
}

/* ============ NUVEM: cópia automática em um gist secreto do GitHub ============ */
// Gist "secreto" NÃO é privado: quem tiver o link consegue ler. Os dados de saúde vão para lá.
// Token e gist id ficam só em SEC (este aparelho). A cópia leva todos os perfis via safeState().
const GIST_FILE = "still-i-rise.json";
const ghHead = () => ({ Authorization: "Bearer " + SEC.ghToken, Accept: "application/vnd.github+json", "Content-Type": "application/json" });
let cloudT = null;
function cloudQueue() { if (!R || !SEC.ghToken || !SEC.ghGistId) return; clearTimeout(cloudT); cloudT = setTimeout(() => syncToCloud(false), 8000); }
async function syncToCloud(manual) {
  if (!SEC.ghToken) return manual && toast("Cole o token do GitHub primeiro.");
  const body = { description: "Still I Rise: cópia dos dados", files: { [GIST_FILE]: { content: JSON.stringify(safeState()) } } };
  try {
    const id = SEC.ghGistId, r = await fetch(id ? "https://api.github.com/gists/" + encodeURIComponent(id) : "https://api.github.com/gists",
      { method: id ? "PATCH" : "POST", headers: ghHead(), body: JSON.stringify(id ? body : { ...body, public: false }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.message || r.status);
    if (!SEC.ghGistId) { SEC.ghGistId = j.id; saveSec(); }
    S.settings.cloudAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(R)); } catch (e) { }
    if (manual) { toast("Dados enviados para a nuvem."); render(); }
  } catch (e) { if (manual) toast("Falha ao enviar: " + e.message); }
}
async function syncFromCloud() {
  if (!SEC.ghToken || !SEC.ghGistId) return toast("Informe o token e o Gist ID.");
  try {
    const r = await fetch("https://api.github.com/gists/" + encodeURIComponent(SEC.ghGistId), { headers: ghHead() }), j = await r.json();
    if (!r.ok) throw new Error(j.message || r.status);
    const f = j.files && j.files[GIST_FILE]; if (!f) throw new Error("arquivo não encontrado no gist");
    const o = JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content);
    if (!o || !(o.profiles || (o.profile && o.days))) throw new Error("dados inválidos");
    if (!confirm("Substituir os dados deste aparelho pela cópia da nuvem?")) return;
    importObject(o); save(); applyTheme(); closeAll(); render(); toast("Dados restaurados da nuvem.");
  } catch (e) { toast("Falha ao baixar: " + e.message); }
}
ACT["gh-save"] = () => {
  const t = $("#ghToken"), g = $("#ghGistId"), tv = t ? t.value.trim() : "";
  if (tv && tv !== "********") SEC.ghToken = tv; else if (!tv) SEC.ghToken = "";
  SEC.ghGistId = g ? g.value.trim() : ""; saveSec(); toast("Nuvem configurada!"); render();
  if (SEC.ghToken) syncToCloud(true);
};
ACT["gh-sync"] = () => syncFromCloud();
ACT["gh-push"] = () => syncToCloud(true);

/* ============ AURA (Gemini): chat com contexto do dia e memória de 7 dias ============ */
// Modelos estáveis e atuais em set/2026 (ai.google.dev/gemini-api/docs/models). A família 2.5 ficou restrita a quem já usava.
const GEM_MODELS = [
  ["gemini-3.8-flash", "Gemini 3.8 Flash · recomendado (melhor em fotos e respostas)"],
  ["gemini-3.5-flash-lite", "Gemini 3.5 Flash-Lite · mais rápido e barato"]
];
const GEM_DEFAULT = GEM_MODELS[0][0];
const gemModel = () => GEM_MODELS.some(m => m[0] === S.settings.gemModel) ? S.settings.gemModel : GEM_DEFAULT;
const GEM_URL = "https://generativelanguage.googleapis.com/v1beta/models/";
function gemErro(status, msg) {
  if (status === 400 && /API key/i.test(msg)) return "Chave inválida. Confira a chave no Coach.";
  if (status === 401 || status === 403) return "A chave foi recusada ou não tem permissão.";
  if (status === 404) return "Modelo indisponível para esta chave. Toque em \"Verificar modelos\".";
  if (status === 429) return "Limite de uso da chave atingido. Tente de novo em alguns minutos.";
  return `Erro ${status}: ${msg || "tente de novo."}`;
}
async function gemPost(body, ms = 30000) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(GEM_URL + encodeURIComponent(gemModel()) + ":generateContent", { method: "POST", signal: ctl.signal, headers: { "Content-Type": "application/json", "x-goog-api-key": SEC.gemKey }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(gemErro(r.status, j.error && j.error.message));
    const txt = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts && j.candidates[0].content.parts[0].text;
    if (!txt) throw new Error("A IA não devolveu resposta.");
    return txt;
  } finally { clearTimeout(t); }
}
/* memória: resumo dos últimos 7 dias, calculado dos registros reais do app */
function weekMemory() {
  const k = today(), prot = [], agua = []; let treinos = 0, cardio = 0, ativos = 0;

    const dk = addDays(k, -i), d = D(dk), p = (d.meals || []).reduce((a, m) => a + (m.p || 0), 0);
    if (p > 0) prot.push(p); if (d.water) agua.push(d.water); if (d.wk) treinos++; cardio += cardioMin(dk); if (isActive(dk)) ativos++;
  }
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : 0, w = S.weights, ult = w.length ? w[w.length - 1] : null;
  return `Últimos 7 dias: proteína média ${avg(prot)} g/dia (${prot.length} dias com registro), água média ${(avg(agua) / 1000).toFixed(1)} L, ${treinos} treinos, ${cardio} min de cardio, ${ativos} dias ativos.` + (ult ? ` Último peso: ${ult.kg} kg em ${ult.d} (meta ${S.profile.goal} kg).` : "");
}
function buildAuraContext() {
  const k = today(), d = D(k), tg = TG(), tot = dayTotals(k), L = planLetter(k) || "descanso";
  const hab = S.habits.map(h => `${h.t}${d.h[h.id] ? " (feito)" : ""}`).join("; ");
  return `Você é o Coach, um assistente de IA integrado ao app Still I Rise (treino, dieta, saúde e hábitos para manter o peso). Seja direta, objetiva e encorajadora, em português do Brasil.
Dados do usuário hoje:
- Nome: ${S.profile.name || "Usuário"}

function chatContents() {

    const role = m.role === "ai" ? "model" : "user", parts = [{ text: m.text || "O que acha dessa foto para a minha dieta hoje?" }];
    if (m.img) parts.push({ inlineData: { mimeType: "image/jpeg", data: m.img } });

    if (last && last.role === role) last.parts.push(...parts); else out.push({ role, parts });

}

const GEM_PROMPT = "Você é um nutricionista brasileiro. Analise a foto de uma refeição e liste cada alimento visível separadamente. Para cada um estime o peso já preparado (gramas), kcal e proteína (g) desse peso, usando valores típicos da TACO/comida brasileira. Seja conservador e realista com óleo, molhos e porções. Se houver bebida, inclua. Se a imagem não mostrar comida, devolva a lista vazia. Responda somente em JSON.";
const GEM_SCHEMA = {
  type: "OBJECT",
  properties: {
    itens: { type: "ARRAY", items: { type: "OBJECT", properties: { nome: { type: "STRING" }, gramas: { type: "NUMBER" }, kcal: { type: "NUMBER" }, proteina_g: { type: "NUMBER" } }, required: ["nome", "gramas", "kcal", "proteina_g"] } },

};
const FOTO = { items: [], obs: "", meal: "Almoço" };
// reduz a foto para no máximo 1024 px e devolve base64 (vai inline na requisição, não é guardada)
function fotoDownscale(file, max = 1024) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.8).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Não consegui ler essa imagem.")); };
    img.src = url;
  });
}

const REM_TITLE = { treino: "Still I Rise: treino", pesagem: "Still I Rise: pesagem", supl: "Still I Rise: suplementos", dormir: "Still I Rise: hora de dormir" };
const DAYCODE = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];

function remSaved(id, def) { const r = (S.settings.rem || {})[id]; return r || { on: !!REM_DEF_ON[id], t: def }; }
function remSheet() {
  openSheet(`<h3 class="h3">Lembretes no calendário</h3>
  <p class="muted">Marque o que quer e ajuste o horário. O app cria um arquivo que o calendário do celular importa e passa a tocar todo dia, mesmo com o app fechado.</p>
  <div class="list">${REMS.map(([id, nm, def, days]) => { const r = remSaved(id, def); return `<div class="li"><label class="grow row"><input type="checkbox" data-rem="${id}" ${r.on ? "checked" : ""} class="cbx"><span>${nm}</span></label><input type="time" class="field time" data-remt="${id}" value="${r.t}" aria-label="Horário: ${nm}"></div>`; }).join("")}</div>
  <p class="muted" style="font-size:14px">O som e a vibração vêm das configurações do calendário. Se quiser tocar como despertador, deixe o volume de notificações do calendário alto.</p>
  <button class="btn solid full" data-act="rem-gen">${ic("download")} BAIXAR E ADICIONAR AO CALENDÁRIO</button>`);
