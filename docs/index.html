ACT["sup-sort"] = b => { UI.supSort = b.dataset.v; rLens(); };
ACT.notif = () => {
  if (S.settings.notif) { S.settings.notif = false; save(); return rLens(); }
  if (!("Notification" in window)) return toast("Este navegador não suporta notificações.");
  Notification.requestPermission().then(p => { S.settings.notif = p === "granted"; save(); rLens(); toast(p === "granted" ? "Notificações ativadas." : "Permissão negada."); });
};
ACT.export = () => exportData();
ACT.import = () => $("#file").click();
ACT.reset = () => {
  if (!confirm(`Apagar TODOS os dados do perfil ${S.profile.name} neste aparelho? Exporte um backup antes.`)) return;
  const id = S.id, p = newProfile(S.profile.name, { startWeight: S.profile.startWeight, goal: S.profile.goal, height: S.profile.height, age: S.profile.age, avatar: S.profile.avatar });
  p.id = id; R.profiles[id] = p; useProfile(id); save(); closeAll(); render(); toast("Dados do perfil apagados.");
};

/* ============ PERFIS: trocar, criar, editar e excluir (cada perfil tem dados totalmente isolados) ============ */
function profileRows() {
  return Object.values(R.profiles).map(p => `<div class="li prof ${p.id === R.active ? "on" : ""}">
    <button class="grow row" data-act="profile-use" data-id="${p.id}" aria-pressed="${p.id === R.active}">${avatarHTML(p)}<span class="grow"><b>${esc(p.profile.name)}</b><small class="muted">${r1(p.weights.length ? p.weights[p.weights.length - 1].kg : p.profile.startWeight)} kg · meta ${p.profile.goal} kg</small></span>${p.id === R.active ? `<span class="pill ok">ativo</span>` : ""}</button>
    ${Object.keys(R.profiles).length > 1 ? `<button class="icon-btn bad" data-act="profile-del" data-id="${p.id}" aria-label="Excluir perfil ${esc(p.profile.name)}">${ic("trash")}</button>` : ""}</div>`).join("");
}
const profilesListHTML = () => `<div class="lbl sec-t">Perfis</div><div class="list">${profileRows()}</div><button class="btn full" data-act="profile-new">${ic("plus")} Novo perfil</button>`;
function switchProfile(id) {
  if (!R.profiles[id] || id === R.active) return;
  if (S.cur && STACK.includes("arena")) dropLayer("arena");
  useProfile(id); UI.day = null; UI.open = null; save(); render(); toast("Perfil: " + S.profile.name + ".");
}
function profileNewSheet() {
  openSheet(`<h3 class="h3">Novo perfil</h3><p class="muted small">Cada perfil tem os próprios dias, treinos, pesos, hábitos, suplementos, favoritos e conversa com a Aura.</p>
  <label class="lbl" for="nn">Nome</label><input class="field" id="nn" placeholder="Ex.: Mãe" autocomplete="off">
  <div class="grid2"><div><label class="lbl" for="ns">Peso atual (kg)</label><input class="field" id="ns" inputmode="decimal" placeholder="90"></div><div><label class="lbl" for="ng">Meta (kg)</label><input class="field" id="ng" inputmode="decimal" placeholder="75"></div>
  <div><label class="lbl" for="nh">Altura (cm)</label><input class="field" id="nh" inputmode="numeric" placeholder="165"></div><div><label class="lbl" for="na">Idade</label><input class="field" id="na" inputmode="numeric" placeholder="50"></div></div>
  <p class="muted xs">Começa com os hábitos e suplementos padrão. Ajuste tudo na lente Sistema.</p>
  <button class="btn solid full" data-act="profile-create">CRIAR E ENTRAR</button>`);
}
ACT.profiles = () => openSheet(`<h3 class="h3">Perfis</h3><div class="list">${profileRows()}</div><div class="grid2"><button class="btn" data-act="profile-new">${ic("plus")} Novo</button><button class="btn" data-act="lens" data-l="sistema">${ic("edit")} Editar</button></div>`);
ACT["profile-use"] = b => { if (STACK.includes("sheet")) closeSheet(); switchProfile(b.dataset.id); };
ACT["profile-new"] = () => profileNewSheet();
ACT["profile-create"] = () => {
  const name = $("#nn").value.trim(); if (!name) return toast("Informe o nome.");
  const sw = num($("#ns").value, 0), g = num($("#ng").value, 0), h = num($("#nh").value, 0), a = num($("#na").value, 0);
  if (!(sw >= 30 && sw <= 300) || !(g >= 30 && g <= 300) || !(h >= 100 && h <= 250) || !(a >= 10 && a <= 110)) return toast("Confira peso, meta, altura e idade.");
  if (S.cur && STACK.includes("arena")) dropLayer("arena");
  const p = profileCreate(name, { startWeight: sw, goal: g, height: h, age: a }); p.settings.calcWeight = sw; save();
  closeAll(); UI.day = null; render(); toast(`Perfil ${name} criado.`);
};
ACT["profile-del"] = b => {
  const p = R.profiles[b.dataset.id]; if (!p) return;
  if (!confirm(`Excluir o perfil ${p.profile.name} e TODOS os dados dele? Não dá para desfazer.`)) return;
  if (profileDelete(p.id)) { closeSheet(); render(); toast("Perfil excluído."); }
};
ACT["profile-save"] = () => {
  const p = S.profile, s = S.settings, v = (id, d) => num($("#" + id).value, d);
  const vals = { sw: v("ps", p.startWeight), g: v("pg", p.goal), h: v("ph", p.height), a: v("pa", p.age), def: v("pdef", s.deficit), act: v("pact", s.activity), fl: v("pfloor", s.floor), w: v("pwater", s.waterGoal) };
  if (!(vals.sw >= 30 && vals.sw <= 300 && vals.g >= 30 && vals.g <= 300 && vals.h >= 100 && vals.h <= 250 && vals.a >= 10 && vals.a <= 110)) return toast("Confira peso, meta, altura e idade.");
  if (!(vals.def >= 0 && vals.def <= 1500 && vals.act >= 1.1 && vals.act <= 2 && vals.fl >= 1000 && vals.fl <= 4000 && vals.w >= 1000 && vals.w <= 8000)) return toast("Déficit 0–1500, fator 1,1–2, piso 1000–4000, água 1000–8000 ml.");
  p.name = $("#pn").value.trim() || p.name; p.startWeight = vals.sw; p.goal = vals.g; p.height = vals.h; p.age = vals.a;
  Object.assign(s, { deficit: vals.def, activity: vals.act, floor: vals.fl, waterGoal: Math.round(vals.w) });
  if (!S.weights.length) s.calcWeight = p.startWeight;
  setLinked(today(), "agua", (D(today()).water || 0) >= s.waterGoal);
  save(); render(); toast(`Salvo. Meta: ${fmtInt(TG().kcal)} kcal e ${TG().prot} g de proteína.`);
};

/* ============ EDITORES: hábitos e suplementos (adicionar, editar, remover, reordenar, Regra nº 1) ============ */
const LISTS = { habits: () => S.habits, supps: () => S.supps };
function rowTools(kind, i, n, label) {
  return `<span class="grip" data-grip="${kind}" data-i="${i}" aria-hidden="true">${ic("grip")}</span>
    <button class="icon-btn" data-act="li-edit" data-k="${kind}" data-i="${i}" aria-label="Editar ${esc(label)}">${ic("edit")}</button>`;
}
function habitsFold() {
  const s = S.settings, n = S.habits.length;
  const rows = S.habits.map((h, i) => `<div class="li ed" data-row="habits" data-i="${i}"><span class="n-ic">${esc(h.icon)}</span><div class="grow"><b>${esc(h.t)}</b><small class="muted">${h.id === s.rule1 ? "Regra nº 1 · " : ""}${h.at ? "às " + h.at : "o dia todo"}${h.link ? " · automático" : ""}</small></div>${rowTools("habits", i, n, h.t)}</div>`).join("");
  return fold("Hábitos diários", `<div class="list" data-list="habits">${rows}</div><button class="btn full" data-act="li-new" data-k="habits">${ic("plus")} Novo hábito</button>
    <label class="lbl" for="rule1">Regra nº 1 (obrigatória para o dia contar)</label><select class="field" id="rule1" data-change="rule1">${S.habits.map(h => `<option value="${h.id}" ${h.id === s.rule1 ? "selected" : ""}>${esc(h.icon)} ${esc(h.t)}</option>`).join("")}</select>
    <div class="row between set-row"><span class="grow">Outros hábitos necessários para dia ativo</span><div class="stepper sm"><button class="icon-btn" data-act="need" data-d="-1" aria-label="Menos um">${ic("minus")}</button><b class="tabnum">${s.needOthers}</b><button class="icon-btn" data-act="need" data-d="1" aria-label="Mais um">${ic("plus")}</button></div></div>
    <p class="muted xs">Dia ativo = Regra nº 1 + ${s.needOthers} outros. Arraste pela alça ou use as setas para reordenar. Com horário, o hábito aparece no rio; sem horário, no trilho "O dia todo".</p>`, UI.lensSub === "habitos", "habitos");
}
function suppsFold() {
  const n = S.supps.length, row = (x, i) => `<div class="li ed" data-row="supps" data-i="${i}"><div class="grow"><b>${esc(x.n)}</b><small class="muted">${esc(x.tip)}${x.at ? " · " + x.at : ""}</small></div>${rowTools("supps", i, n, x.n)}</div>`;
  const grp = t => S.supps.map((x, i) => [x, i]).filter(([x]) => x.type === t).map(([x, i]) => row(x, i)).join("") || `<p class="muted small">Nenhum.</p>`;
  return fold("Suplementos e remédios do dia", `<div class="lbl">Suplementos</div><div class="list" data-list="supps">${grp("S")}</div><div class="lbl">Remédios prescritos</div><div class="list" data-list="supps">${grp("M")}</div>
    <button class="btn full" data-act="li-new" data-k="supps">${ic("plus")} Novo item</button><p class="muted xs">Itens com o mesmo horário aparecem juntos no rio.</p>`, UI.lensSub === "supps", "supps");
}
function habitSheet(i) {
  const h = i >= 0 ? S.habits[i] : { icon: "✦", t: "", desc: "", at: "", link: "" };
  openSheet(`<h3 class="h3">${i >= 0 ? "Editar hábito" : "Novo hábito"}</h3>
  <div class="row"><div style="width:84px"><label class="lbl" for="hi">Ícone</label><input class="field center" id="hi" maxlength="4" value="${esc(h.icon)}"></div><div class="grow"><label class="lbl" for="ht">Texto</label><input class="field" id="ht" maxlength="60" value="${esc(h.t)}" placeholder="Ex.: Alongar 10 min"></div></div>
  <label class="lbl" for="hd">Descrição (opcional)</label><input class="field" id="hd" maxlength="120" value="${esc(h.desc || "")}">
  <div class="row"><div><label class="lbl" for="ha">Horário no rio (opcional)</label><input class="field time" id="ha" type="time" value="${esc(h.at || "")}"></div><div class="grow"><label class="lbl" for="hl">Automático</label><select class="field" id="hl">${LINKS.map(([v, n]) => `<option value="${v}" ${v === h.link ? "selected" : ""}>${n}</option>`).join("")}</select></div></div>
  ${i >= 0 ? moveRow("habits", i) : ""}<button class="btn solid full" data-act="li-save" data-k="habits" data-i="${i}">SALVAR</button>${i >= 0 ? `<button class="btn danger full" data-act="li-del" data-k="habits" data-i="${i}">Remover hábito</button>` : ""}`);
}
function suppSheet(i) {
  const x = i >= 0 ? S.supps[i] : { n: "", tip: "", type: "S", at: "" };
  openSheet(`<h3 class="h3">${i >= 0 ? "Editar item" : "Novo suplemento ou remédio"}</h3>
  <label class="lbl" for="sn">Nome</label><input class="field" id="sn" maxlength="60" value="${esc(x.n)}">
  <label class="lbl" for="st">Dica de quando tomar</label><input class="field" id="st" maxlength="120" value="${esc(x.tip)}">
  <div class="row"><div><label class="lbl" for="sa">Horário no rio</label><input class="field time" id="sa" type="time" value="${esc(x.at || "")}"></div><div class="grow"><label class="lbl">Tipo</label><div class="seg" id="sty">${[["S", "Suplemento"], ["M", "Remédio"]].map(([v, n]) => `<button class="${x.type === v ? "on" : ""}" data-act="sty" data-v="${v}">${n}</button>`).join("")}</div></div></div>
  ${i >= 0 ? moveRow("supps", i) : ""}<button class="btn solid full" data-act="li-save" data-k="supps" data-i="${i}">SALVAR</button>${i >= 0 ? `<button class="btn danger full" data-act="li-del" data-k="supps" data-i="${i}">Remover</button>` : ""}`);
}
const moveRow = (k, i) => `<div class="grid2"><button class="btn sm" data-act="li-move" data-k="${k}" data-i="${i}" data-d="-1" ${i === 0 ? "disabled" : ""}>${ic("up")} Subir</button><button class="btn sm" data-act="li-move" data-k="${k}" data-i="${i}" data-d="1" ${i === LISTS[k]().length - 1 ? "disabled" : ""}>${ic("down")} Descer</button></div>`;
const txt = (id, max) => ($("#" + id).value || "").trim().slice(0, max);
function listSave(k, i) {
  const a = LISTS[k]();
  if (k === "habits") {
    const o = { icon: txt("hi", 4) || "✦", t: txt("ht", 60), desc: txt("hd", 120), at: /^\d\d:\d\d$/.test(txt("ha", 5)) ? txt("ha", 5) : "", link: LINKS.some(l => l[0] === $("#hl").value) ? $("#hl").value : "" };
    if (!o.t) return toast("Escreva o hábito.");
    if (i >= 0) Object.assign(a[i], o); else a.push(Object.assign({ id: uid("h") }, o));
  } else {
    const ty = $("#sty .on"), o = { n: txt("sn", 60), tip: txt("st", 120), at: /^\d\d:\d\d$/.test(txt("sa", 5)) ? txt("sa", 5) : "", type: ty && ty.dataset.v === "M" ? "M" : "S" };
    if (!o.n) return toast("Escreva o nome.");
    if (i >= 0) Object.assign(a[i], o); else a.push(Object.assign({ id: uid("s") }, o));
  }
  save(); closeSheet(); render(); toast("Salvo.");
}
function listMove(k, from, to) { const a = LISTS[k](); if (to < 0 || to >= a.length || from === to) return; a.splice(to, 0, a.splice(from, 1)[0]); save(); render(); haptic(); }
ACT["li-new"] = b => b.dataset.k === "habits" ? habitSheet(-1) : suppSheet(-1);
ACT["li-edit"] = b => b.dataset.k === "habits" ? habitSheet(+b.dataset.i) : suppSheet(+b.dataset.i);
ACT["li-save"] = b => listSave(b.dataset.k, +b.dataset.i);
// subir/descer pelo painel de edição (acessível sem arrastar); o painel continua aberto no item movido
ACT["li-move"] = b => { const k = b.dataset.k, i = +b.dataset.i, j = i + num(b.dataset.d); listMove(k, i, j); if (j >= 0 && j < LISTS[k]().length) (k === "habits" ? habitSheet : suppSheet)(j); };
ACT.sty = b => $$("#sty button").forEach(x => x.classList.toggle("on", x === b));
ACT["li-del"] = b => {
  const k = b.dataset.k, i = +b.dataset.i, a = LISTS[k](), it = a[i]; if (!it) return;
  if (k === "habits" && it.id === S.settings.rule1) return toast("Escolha outra Regra nº 1 antes de remover este hábito.");
  if (k === "habits" && a.length < 2) return toast("Mantenha pelo menos um hábito.");
  if (!confirm(`Remover "${it.t || it.n}"? O histórico dos dias passados continua salvo.`)) return;
  a.splice(i, 1); save(); closeSheet(); render(); toast("Removido.");
};
ACT.need = b => { S.settings.needOthers = clamp(S.settings.needOthers + num(b.dataset.d), 0, Math.max(0, S.habits.length - 1)); save(); render(); };

/* ============ EVENTOS: o ÚNICO ouvinte de clique do app + teclado, campos e formulários ============ */
const KEEP_ORB = ["pal-run", "orb-close", "orb", "scrim"];
let suppressClick = 0;
document.addEventListener("click", e => {
  if (Date.now() < suppressClick) { e.preventDefault(); e.stopPropagation(); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (!ACT[a]) return;
  if (b.closest("#palette") && !KEEP_ORB.includes(a) && STACK.includes("orb")) dropLayer("orb");
  if (b.tagName === "A") e.preventDefault();
  ACT[a](b, e);
  orbSync();
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Escape" && STACK.length) { dropLayer(STACK[STACK.length - 1]); return; }
  if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(t.tagName) && !STACK.length)) { e.preventDefault(); openOrb(); return; }
  if ((e.key === "Enter" || e.key === " ") && t.getAttribute && t.getAttribute("role") === "button" && t.dataset.act) { e.preventDefault(); t.click(); return; }
  if (e.key === "Enter" && !e.shiftKey && t.id === "ia-input") { e.preventDefault(); auraSend(); return; }
  if (e.key === "Enter" && t.id === "pal-q") { e.preventDefault(); palRun(0); return; }
  if (!STACK.includes("arena") || /INPUT|TEXTAREA/.test(t.tagName)) return;
  if (e.key === "ArrowRight") arenaSwipe(-1); else if (e.key === "ArrowLeft") arenaSwipe(1);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.dataset.form === "chat") auraSend();
  if (e.target.dataset.form === "pal") palRun(0);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "pal-q") return palResults(t.value);
  if (t.id === "q") { const l = $("#foodlist"); if (l) l.innerHTML = foodListHTML(t.value); return; }
  if (t.id === "g") return gSum(+t.dataset.i);
  if (t.id === "ia-input") { t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; return; }
  if (t.dataset.foto !== undefined) { const f = t.dataset.foto, it = FOTO.items[+t.dataset.i]; if (it) { it[f] = f === "nome" ? t.value : num(t.value); fotoTotal(); } return; }
  if (t.dataset.f && S.cur && t.closest("#arena")) arenaInput(t);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "ia-foto") { const f = t.files[0]; t.value = ""; if (f) iaFoto(f); return; }
  if (t.id === "foto") { const f = t.files[0]; t.value = ""; if (f) fotoAnalyze(f); return; }
  if (t.id === "file") { const f = t.files[0]; t.value = ""; if (f) importFile(f); return; }
  if (t.dataset.change === "rule1" && S.habits.some(h => h.id === t.value)) { S.settings.rule1 = t.value; S.settings.needOthers = Math.min(S.settings.needOthers, S.habits.length - 1); save(); render(); toast("Regra nº 1 atualizada."); }
  if (t.dataset.f && S.cur && t.closest("#arena")) arenaRender();
});
matchMedia("(prefers-color-scheme:dark)").addEventListener && matchMedia("(prefers-color-scheme:dark)").addEventListener("change", () => R && applyTheme());
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !R) return;
  if (RT.iv) restTick();
  if (S.cur && STACK.includes("arena")) lockScreen();
  applyTheme(); if (!STACK.includes("arena")) render();
});

/* ============ GESTOS DE TOQUE (celular primeiro) ============ */
// alça (reordenar) > número da carga (arrastar ajusta) > item da bandeja (arrastar exclui) > tecla (segurar)
// > nó do rio (deslizar para a direita conclui) > palco da arena (deslizar troca de exercício)
let G = null;
const moved = (e, g) => [e.clientX - g.x, e.clientY - g.y];
function gStart(e) {
  const t = e.target, base = { x: e.clientX, y: e.clientY, id: e.pointerId, on: false };
  let el;
  if ((el = t.closest("[data-grip]"))) return Object.assign(base, { type: "grip", el, row: el.closest("[data-row]") });
  if ((el = t.closest("[data-dial]"))) return Object.assign(base, { type: "dial", el, acc: 0 });
  if ((el = t.closest(".swipe-in"))) return Object.assign(base, { type: "del", el });
  const hold = t.closest("[data-hold]"), sw = t.closest("[data-swipe]"), ax = t.closest("[data-swipe-x]");
  if (hold) { const g = Object.assign(base, { type: "hold", el: hold }); g.timer = setTimeout(() => holdFire(g), 450); return g; }
  if (sw && !t.closest("input,textarea,select")) return Object.assign(base, { type: "done", el: sw, body: sw.querySelector(".n-body") || sw });
  if (ax && !t.closest("input,textarea,select,.chips")) return Object.assign(base, { type: "arena", el: ax });
  return null;
}
function holdFire(g) {
  if (G !== g || g.on) return;
  G = null; haptic(25); suppressClick = Date.now() + 700; ACT[g.el.dataset.hold](g.el);
}
const snap = (el, x, ms) => { el.style.transition = ms ? `transform ${ms}ms var(--ease)` : "none"; el.style.transform = x ? `translateX(${x}px)` : ""; };
document.addEventListener("pointerdown", e => { if (e.button > 0) return; G = gStart(e); });
document.addEventListener("pointermove", e => {
  if (!G || e.pointerId !== G.id) return;
  const [dx, dy] = moved(e, G);
  if (!G.on) {
    const far = Math.abs(dx) > 10 || Math.abs(dy) > 10; if (!far) return;
    if (G.type === "hold") { clearTimeout(G.timer); G = null; return; }
    const horiz = Math.abs(dx) > Math.abs(dy);
    if (["del", "done", "arena"].includes(G.type) && !horiz) { G = null; return; }
    if (G.type === "done" && dx < 0) { G = null; return; }
    if (G.type === "dial" && document.activeElement === G.el.querySelector("input")) { G = null; return; }
    G.on = true; try { G.el.setPointerCapture(e.pointerId); } catch (x) { }
  }
  gMove(e, dx, dy);
});
function gMove(e, dx, dy) {
  const g = G;
  if (g.type === "dial") { const n = Math.trunc((-dy - g.acc) / 22); if (n) { g.acc += n * 22; wkAdjFocus(g.el.dataset.dial, n * num(g.el.dataset.step)); G = Object.assign(g, { el: $(`[data-dial="${g.el.dataset.dial}"]`) || g.el }); } e.preventDefault(); return; }
  if (g.type === "del") { snap(g.el, dx, 0); g.el.parentNode.classList.toggle("armed", Math.abs(dx) > Math.min(120, g.el.offsetWidth * 0.35)); return; }
  if (g.type === "done") { snap(g.body, Math.min(dx, 160), 0); g.el.classList.toggle("armed", dx > 90); return; }
  if (g.type === "grip") { g.row.style.transform = `translateY(${dy}px)`; g.row.classList.add("dragging"); }
}
function gEnd(e) {
  const g = G; if (!g || e.pointerId !== g.id) return; G = null; clearTimeout(g.timer);
  if (!g.on) return;
  suppressClick = Date.now() + 350;
  const [dx, dy] = moved(e, g), ok = e.type === "pointerup";
  if (g.type === "del") { const w = g.el.offsetWidth, i = +g.el.parentNode.dataset.i; if (ok && Math.abs(dx) > Math.min(120, w * 0.35)) { snap(g.el, dx < 0 ? -w : w, 160); setTimeout(() => removeWithUndo(i), 170); } else { snap(g.el, 0, 200); g.el.parentNode.classList.remove("armed"); } }
  if (g.type === "done") { snap(g.body, 0, 220); g.el.classList.remove("armed"); if (ok && dx > 90) { const [act, id] = g.el.dataset.swipe.split(/:(.+)/); ACT[act]({ dataset: { id } }); } }
  if (g.type === "arena" && ok && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) arenaSwipe(dx > 0 ? 1 : -1);
  if (g.type === "grip") gripDrop(g, e);
}
function gripDrop(g, e) {
  g.row.style.transform = ""; g.row.classList.remove("dragging");
  g.row.style.pointerEvents = "none"; const under = document.elementFromPoint(e.clientX, e.clientY); g.row.style.pointerEvents = "";
  const tgt = under && under.closest(`[data-row="${g.el.dataset.grip}"]`);
  if (tgt) listMove(g.el.dataset.grip, +g.el.dataset.i, +tgt.dataset.i);
}
document.addEventListener("pointerup", gEnd); document.addEventListener("pointercancel", gEnd);
document.addEventListener("contextmenu", e => { if (e.target.closest("[data-hold]")) e.preventDefault(); });

/* ============ INICIALIZAÇÃO ============ */
// a cada minuto: relógio, linha AGORA, maré e virada do dia
function tick() {
  if (!STACK.includes("arena") && !STACK.includes("sheet") && !STACK.includes("orb")) { applyTheme(); render(); }
  setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
}
function registerSW() {
  if (!("serviceWorker" in navigator) || !location.protocol.startsWith("http")) return;
  navigator.serviceWorker.register("sw.js").catch(() => { });
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (had && !sessionStorage.getItem("sir_reloaded")) { sessionStorage.setItem("sir_reloaded", "1"); location.reload(); } had = true; });
}
(async function init() {
  await loadState();
  Object.values(R.profiles).forEach(p => { if (!GEM_MODELS.some(m => m[0] === p.settings.gemModel)) p.settings.gemModel = GEM_DEFAULT; });
  applyTheme();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
  registerSW();
  try { history.replaceState({ layer: null }, ""); } catch (e) { }
  render(); orbSync();
  setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
  if (S.cur) toast("Treino em andamento. Toque no nó do treino para continuar.");
  setTimeout(maybeReview, 1000);
})();

</script>
