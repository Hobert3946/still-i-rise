<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Still I Rise</title>
<meta name="description" content="Still I Rise: treino, alimentação e hábitos para manter o peso perdido.">
<meta name="theme-color" content="#0D0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Still I Rise">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Sora:wght@500..800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS: cor, tipo, movimento ============ */
:root{
  --bg:#0D0D0F;--bg2:#111114;--surface:#141417;--surface2:#1B1B20;--surface3:#24242B;
  --line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.11);
  --text:#EDEBE7;--muted:#8C8980;--faint:#5C5A55;
  --accent:#D9894F;--accent-hi:#F2B27A;--accent-ink:#F2B27A;--on-accent:#1A0F07;
  --ok:#8FB9A1;--water:#6CC4E0;--warn:#E6B04B;--bad:#E26D5A;
  --c-a:#D9894F;--c-b:#8FB9A1;--c-c:#E6B04B;--c-d:#6CC4E0;--c-e:#A99BE0;
  --glass:rgba(20,20,23,.62);--glass-line:rgba(255,255,255,.08);--scrim:rgba(5,5,7,.55);
  --shadow:0 18px 50px -18px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.35);
  --glow:0 0 0 1px rgba(217,137,79,.25),0 10px 40px -8px rgba(217,137,79,.45);
  --f-display:"Sora",system-ui,sans-serif;--f-body:"Geist",system-ui,-apple-system,sans-serif;
  --r-s:12px;--r:18px;--r-l:26px;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --t1:200ms;--t2:300ms;--t3:400ms;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --orb:64px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F6F4F0;--bg2:#EFECE6;--surface:#FFFFFF;--surface2:#F1EEE8;--surface3:#E7E3DB;
  --line:rgba(23,22,26,.07);--line2:rgba(23,22,26,.13);
  --text:#17161A;--muted:#6E6A62;--faint:#A29D93;
  --accent:#B5652E;--accent-hi:#D9894F;--accent-ink:#9A5423;--on-accent:#FFF8F1;
  --ok:#4F8A69;--water:#2F8FB5;--warn:#B7801C;--bad:#C24E3B;
  --c-a:#B5652E;--c-b:#4F8A69;--c-c:#B7801C;--c-d:#2F8FB5;--c-e:#7565C0;
  --glass:rgba(255,255,255,.72);--glass-line:rgba(23,22,26,.08);--scrim:rgba(40,36,30,.28);
  --shadow:0 18px 50px -20px rgba(60,40,20,.35),0 2px 8px rgba(60,40,20,.08);
  --glow:0 0 0 1px rgba(181,101,46,.2),0 10px 30px -10px rgba(181,101,46,.4);
  color-scheme:light;
}
@media (prefers-reduced-motion:reduce){:root{--t1:1ms;--t2:1ms;--t3:1ms}*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}

/* ============ BASE: reset, tipografia e componentes ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{font:400 16px/1.45 var(--f-body);color:var(--text);background:var(--bg);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;transition:background var(--t3) var(--ease)}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:70vh;background:radial-gradient(60% 50% at 30% 20%,rgba(217,137,79,.13),transparent 70%),radial-gradient(50% 40% at 85% 10%,rgba(108,196,224,.08),transparent 70%);pointer-events:none;z-index:0}
body.lock{overflow:hidden}
body[data-hour="morning"]::before{background:radial-gradient(60% 50% at 30% 20%,rgba(242,178,122,.2),transparent 70%),radial-gradient(50% 40% at 85% 10%,rgba(230,176,75,.1),transparent 70%)}
body[data-hour="night"]::before{background:radial-gradient(60% 50% at 30% 20%,rgba(169,155,224,.12),transparent 70%),radial-gradient(50% 40% at 85% 10%,rgba(108,196,224,.07),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35;pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.fill{fill:currentColor;stroke:none}
.skip{position:fixed;left:12px;top:-60px;z-index:999;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:600}
.skip:focus{top:calc(var(--sat) + 8px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.h1{font:700 28px/1.1 var(--f-display);letter-spacing:-.02em}
.h2{font:700 22px/1.15 var(--f-display);letter-spacing:-.015em}
.h3{font:600 18px/1.25 var(--f-display);letter-spacing:-.01em}
.big{font:700 44px/1 var(--f-display);letter-spacing:-.03em}
.lbl{font:600 11px/1.3 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:14px}.xs{font-size:12.5px}
.tabnum{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tile{background:var(--surface2);border-radius:var(--r-s);padding:12px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);font-weight:600;font-size:15px;transition:transform var(--t1) var(--ease),background var(--t1)}
.btn:active{transform:scale(.97)}
.btn.solid{background:linear-gradient(135deg,var(--accent-hi),var(--accent));color:var(--on-accent);border-color:transparent;box-shadow:var(--glow)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.full{width:100%}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none;transition:background var(--t1),transform var(--t1)}
.icon-btn:active{transform:scale(.92);background:var(--surface2)}
.icon-btn.bad{color:var(--bad)}
.field{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);font-size:16px;outline:none;transition:border-color var(--t1)}
.field:focus{border-color:var(--accent)}
.field.time{width:116px;flex:none}
select.field{appearance:none}
.cbx{width:22px;height:22px;accent-color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:14px;font-weight:500;transition:all var(--t1) var(--ease)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chip:active{transform:scale(.95)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);transition:all var(--t1)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tog{width:52px;height:32px;border-radius:99px;background:var(--surface3);position:relative;flex:none;transition:background var(--t2)}
.tog i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform var(--t2) var(--spring)}
.tog.on{background:var(--ok)}.tog.on i{transform:translateX(20px)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface2);font-size:12.5px;font-weight:600}
.pill.ok{color:var(--ok)}.pill.acc{color:var(--accent-ink)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-s);background:var(--surface2);border-left:3px solid var(--accent);font-size:14.5px}
.banner b{display:block;margin-bottom:2px}
.banner.ok{border-color:var(--ok)}.banner.warn{border-color:var(--warn)}.banner.bad{border-color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-hi));transition:width var(--t3) var(--ease)}
details.fold{border-top:1px solid var(--line)}
details.fold>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:52px;cursor:pointer;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .icon{transition:transform var(--t2) var(--ease)}
details.fold[open]>summary .icon{transform:rotate(180deg)}
details.fold .body{padding:0 0 14px}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface3)}
.ring .arc{transition:stroke-dashoffset 900ms var(--ease)}
.ring .c{text-align:center;position:relative}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:300;max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--glass-line);box-shadow:var(--shadow);font-size:14.5px;font-weight:500;transition:all var(--t2) var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.act{pointer-events:auto;cursor:pointer}
.toast.act::after{content:" ↺";color:var(--accent-ink);font-weight:700}
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity var(--t2) var(--ease);z-index:200}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:210;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;border-top:1px solid var(--line2);padding:10px 18px calc(var(--sab) + 22px);transform:translateY(105%);transition:transform var(--t3) var(--ease);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sheet.on{transform:none}
.sheet::before{content:"";align-self:center;width:40px;height:5px;border-radius:9px;background:var(--line2);flex:none}
@media (min-width:640px){.sheet{left:50%;right:auto;width:560px;margin-left:-280px}}
.shimmer{height:80px;border-radius:14px;background:linear-gradient(90deg,var(--surface2),var(--surface3),var(--surface2));background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ============ RIO ============ */
.top{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:var(--sat);background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-bottom:1px solid var(--glass-line)}
.top-in{max-width:600px;margin:0 auto;height:60px;display:flex;align-items:center;gap:4px;padding:0 8px 0 12px}
.who{display:flex;align-items:center;gap:8px;min-height:44px;padding-right:4px;flex:1;min-width:0;text-align:left}
.who .icon{width:16px;height:16px;color:var(--muted)}
.who-t{display:flex;flex-direction:column;min-width:0}.who-t small{white-space:nowrap;font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.who-t b{font:700 16px/1.1 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.avatar.ini{display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-hi),var(--accent));color:var(--on-accent);font:700 16px var(--f-display)}
.avatar.sm{width:30px;height:30px;font-size:13px}
.daynav{display:flex;align-items:center}
.daynav .icon-btn{width:30px;height:44px}
.daylbl{display:flex;flex-direction:column;align-items:center;min-width:76px;min-height:44px;justify-content:center}
.daylbl b{font:700 13px/1.1 var(--f-display);letter-spacing:.02em}.daylbl small{font-size:12px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.drop.full{color:var(--water);filter:drop-shadow(0 0 6px var(--water))}
.river{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:calc(var(--sat) + 76px) 16px calc(var(--sab) + 130px);display:flex;flex-direction:column;gap:14px;outline:none}
.hero{display:flex;align-items:center;gap:16px;animation:rise var(--t3) var(--ease) both}
.rings{position:relative;width:148px;height:148px;flex:none;display:grid;place-items:center}
.rings .rl{position:absolute;inset:calc(var(--s) * 12px);display:grid;place-items:center}
.rings .ring .trk{stroke:var(--surface2)}
.rings-c{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1}
.rings-c b{font:700 17px var(--f-display)}.rings-c small{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.stats{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat{display:flex;align-items:center;gap:8px;min-height:36px;text-align:left}
.stat .lbl{flex:1}.stat b{font:600 15px var(--f-display)}.stat b small{font-size:12px;color:var(--muted);font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;flex:none}.dot.k{background:var(--accent)}.dot.p{background:var(--ok)}.dot.w{background:var(--water)}.dot.h{background:var(--c-e)}
.streaks{display:flex;flex-wrap:wrap;gap:6px;text-align:left}
.streaks .pill .icon{width:14px;height:14px;color:var(--accent)}
.rule1{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line2);text-align:left;transition:all var(--t2) var(--ease)}
.rule1 small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.rule1 b{font-weight:600}
.r1-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--accent)}
.rule1 .ck,.ck-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);color:transparent;flex:none;transition:all var(--t2) var(--spring)}
.ck-btn{width:44px;height:44px;border-width:0;box-shadow:inset 0 0 0 2px var(--line2)}
.rule1.on{border-color:rgba(143,185,161,.4);background:linear-gradient(135deg,rgba(143,185,161,.14),var(--surface))}
.rule1.on .ck,.ck-btn.on{background:var(--ok);border-color:var(--ok);box-shadow:none;color:#0D0D0F;transform:scale(1.04)}
.signals{display:flex;flex-direction:column;gap:8px}
.sig-act{margin-top:10px}
.sig-more{align-self:flex-start;display:flex;align-items:center;gap:6px;min-height:36px;font-size:13px;font-weight:600;color:var(--accent-ink)}
.sig-more .icon{width:16px;height:16px}
.pastnote{display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--surface2);font-size:14px;color:var(--warn)}
/* linha do tempo */
.timeline{position:relative;display:flex;flex-direction:column;padding:6px 0}
.spine{position:absolute;left:61px;top:0;bottom:0;width:3px;border-radius:3px;background:var(--line)}
.tide{position:absolute;left:-1px;width:5px;border-radius:5px;background:linear-gradient(180deg,rgba(108,196,224,.35),var(--water));box-shadow:0 0 14px rgba(108,196,224,.6);transition:height 900ms var(--ease)}
.node{position:relative;display:grid;grid-template-columns:44px 36px 1fr;align-items:start;padding:5px 0;animation:rise var(--t3) var(--ease) both;animation-delay:calc(var(--i) * 30ms);touch-action:pan-y}
.n-time{font:600 12.5px/1 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:19px;text-align:right}
.n-dot{justify-self:center;margin-top:13px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--line2);display:grid;place-items:center;z-index:1;transition:all var(--t2) var(--spring)}
.n-dot .icon{width:12px;height:12px;stroke-width:3;color:#0D0D0F}
.node.done .n-dot{background:var(--ok);border-color:var(--ok)}
.node.k-wk .n-dot{border-color:var(--accent)}.node.k-meal .n-dot{border-color:var(--c-c)}.node.k-sup .n-dot{border-color:var(--c-e)}
.node.k-next .n-dot{border-color:var(--accent);box-shadow:0 0 0 4px rgba(217,137,79,.18)}
.n-body{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color var(--t2),background var(--t2),transform var(--t2) var(--ease)}
.node.open .n-body{border-color:var(--line2);box-shadow:var(--shadow)}
.node.past:not(.done) .n-body{opacity:.72}
.node.armed .n-body{border-color:var(--ok)}
.node.k-next .n-body{background:linear-gradient(135deg,rgba(217,137,79,.1),var(--surface));border-style:dashed;border-color:rgba(217,137,79,.35)}
.node.rest .n-body,.node.skip .n-body{background:transparent}
.n-head{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding:12px 14px;min-height:56px;cursor:pointer}
.n-head>b{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:6px}.n-head>b .icon{width:16px;height:16px;color:var(--accent)}
.n-head>small{grid-column:1;font-size:13px;color:var(--muted);line-height:1.35}
.n-head>.ck-btn,.n-head>.n-meta{grid-column:2;grid-row:1/span 2}
.n-meta{font:600 13px var(--f-display);color:var(--muted)}
.n-more{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;animation:rise var(--t2) var(--ease)}
.exl{padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.chk{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:14px;background:var(--surface2);min-height:56px;width:100%}
.chk small{display:block;font-size:12.5px;color:var(--muted)}
.chk .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;flex:none;transition:all var(--t2) var(--spring)}
.chk.on .box{background:var(--ok);border-color:var(--ok);color:#0D0D0F}
.chk.big{min-height:64px}
.now{position:relative;display:flex;align-items:center;gap:8px;margin:6px 0 6px 50px;padding:6px 0;z-index:2}
.now::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,var(--accent),transparent);animation:breathe 3s ease-in-out infinite}
.now-t{position:relative;font:700 11px var(--f-body);letter-spacing:.1em;background:var(--accent);color:var(--on-accent);padding:4px 9px;border-radius:99px;box-shadow:var(--glow)}
.now-w{position:relative;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--water);background:var(--bg);padding:2px 8px;border-radius:99px;font-variant-numeric:tabular-nums}
.now-w .icon{width:13px;height:13px}
@keyframes breathe{50%{opacity:.35}}
/* trilho "o dia todo" */
.rail{display:flex;flex-direction:column;gap:10px}
.rail-t{margin:8px 0 2px}
.rail-row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);touch-action:pan-y;transition:border-color var(--t2)}
.rail-row small{display:block;font-size:12.5px}.rail-row .bar{margin:6px 0 4px}
.rail-row.armed{border-color:var(--ok)}
.n-ic{font-size:22px;width:32px;text-align:center;flex:none}
.rail-card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.rail-card .lbl{display:flex;align-items:center;gap:6px}.rail-card .lbl .icon{width:14px;height:14px;color:var(--accent)}
.quote{position:relative;text-align:left;padding:26px 20px 18px;border-radius:var(--r);background:radial-gradient(120% 90% at 0% 0%,rgba(217,137,79,.14),transparent 60%),var(--surface);border:1px solid var(--line)}
.quote p{font:500 17px/1.45 var(--f-display);letter-spacing:-.01em}
.quote small{display:block;margin-top:10px;color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.q-mark{position:absolute;top:-6px;left:14px;font:700 56px/1 var(--f-display);color:var(--accent);opacity:.5}

/* ============ ORBE E PALETA ============ */
.orb{position:fixed;left:50%;bottom:calc(var(--sab) + 18px);width:var(--orb);height:var(--orb);margin-left:calc(var(--orb) / -2);border-radius:50%;z-index:60;display:grid;place-items:center;transition:transform var(--t2) var(--spring)}
.orb:active{transform:scale(.9)}
.orb-core{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6 0,transparent 32%),conic-gradient(from 200deg,var(--accent),var(--accent-hi),var(--water),var(--accent));box-shadow:0 10px 30px -6px rgba(217,137,79,.7),inset 0 -6px 14px rgba(0,0,0,.25);animation:orbspin 9s linear infinite}
.orb-ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:-1;box-shadow:var(--shadow)}
.orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:orbpulse 3.2s var(--ease) infinite}
.orb[data-aura="fed"] .orb-core{filter:saturate(1.2) brightness(1.08)}
.orb[data-aura="overdrive"] .orb-core{filter:saturate(1.5) brightness(1.15);box-shadow:0 0 40px 4px rgba(242,178,122,.75)}
.orb[data-aura="overdrive"]::after{opacity:.6}
body.lock .orb{transform:scale(0);pointer-events:none}
@keyframes orbspin{to{transform:rotate(360deg)}}
@keyframes orbpulse{0%{transform:scale(.9);opacity:.5}80%,100%{transform:scale(1.35);opacity:0}}
.palette{position:fixed;left:0;right:0;bottom:0;z-index:220;padding:0 10px calc(var(--sab) + 10px);opacity:0;transform:translateY(30px) scale(.98);pointer-events:none;transition:opacity var(--t2) var(--ease),transform var(--t2) var(--spring)}
.palette.on{opacity:1;transform:none;pointer-events:auto}
.pal-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);border:1px solid var(--glass-line);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden;max-height:min(78dvh,640px)}
.pal-res{overflow-y:auto;overscroll-behavior:contain;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px}
.pal-bar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-top:1px solid var(--glass-line)}
.pal-bar>.icon{color:var(--accent)}
.pal-bar input{flex:1;min-width:0;min-height:48px;background:none;border:0;outline:none;font-size:17px}
.pal-aura{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--accent-ink)}.pal-aura .icon{width:16px;height:16px}
.pal-water{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pw{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50px;border-radius:14px;background:rgba(108,196,224,.1);border:1px solid rgba(108,196,224,.22);color:var(--water)}
.pw b{font:700 14px var(--f-display)}.pw small{font-size:9.5px;color:var(--muted);white-space:nowrap}
.pw:active{transform:scale(.92)}
.pal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;border-radius:14px;background:var(--surface2);font-size:12.5px;font-weight:600}
.pq .icon{color:var(--accent)}.pq:active{transform:scale(.95)}
.pal-lens{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.pl{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;font-size:11px;color:var(--muted);min-height:56px}
.pl .icon{color:var(--text)}.pl:active{background:var(--surface2)}
.pr{display:flex;align-items:center;gap:12px;text-align:left;min-height:56px;padding:8px 12px;border-radius:14px;background:var(--surface2);animation:rise var(--t2) var(--ease) both}
.pr small{display:block;font-size:12.5px;color:var(--muted)}
.pr .icon{color:var(--accent)}
.pr.first{background:linear-gradient(135deg,rgba(217,137,79,.18),var(--surface2));box-shadow:inset 0 0 0 1px rgba(217,137,79,.35)}
kbd{font:600 12px var(--f-body);padding:3px 7px;border-radius:6px;background:var(--surface3);color:var(--muted)}

/* ============ TECLADO DE ALIMENTOS ============ */
.kb{display:flex;flex-direction:column;gap:10px}
.kb-sum{display:flex;justify-content:space-between;font:600 13px var(--f-body);padding:8px 12px;border-radius:12px;background:var(--surface2)}
.tray{display:flex;flex-direction:column;gap:6px}
.swipe{position:relative;border-radius:14px;overflow:hidden}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--bad);color:#fff;font-weight:600;font-size:14px;opacity:.55;transition:opacity var(--t1)}
.swipe.armed .swipe-bg{opacity:1}
.swipe-in{position:relative;display:flex;align-items:center;gap:8px;padding:8px 4px 8px 14px;background:var(--surface2);touch-action:pan-y;min-height:56px}
.swipe-in b{font-weight:600;font-size:14.5px;display:block}.swipe-in small{font-size:12.5px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.fkey{display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;min-height:62px;padding:8px 10px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);-webkit-touch-callout:none;transition:transform var(--t1) var(--ease),background var(--t1)}
.fkey b{font-size:13.5px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fkey small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fkey.fav{border-color:rgba(217,137,79,.35);background:linear-gradient(135deg,rgba(217,137,79,.12),var(--surface2))}
.fkey:active{transform:scale(.94);background:var(--surface3)}
.fkey.pop{animation:kpop 420ms var(--spring)}
@keyframes kpop{30%{transform:scale(1.08);box-shadow:0 0 0 3px var(--ok)}}
.kb-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .field{text-align:center;font:700 26px var(--f-display);flex:1}
.stepper.sm{gap:4px}.stepper.sm b{min-width:56px;text-align:center}
.food{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);min-height:56px;width:100%}
.food b{display:block;font-weight:600;font-size:15px}.food small{font-size:12.5px}.food .icon{color:var(--accent)}
.street{display:grid;gap:8px}
.flip{position:relative;display:grid;text-align:left;perspective:900px;min-height:108px}
.flip .face{grid-area:1/1;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:var(--surface2);border-left:3px solid var(--ok);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform 500ms var(--ease)}
.flip .face b{font-weight:500;font-size:14.5px}
.flip .face.bad{border-color:var(--bad);transform:rotateY(180deg)}
.flip.on .face.ok{transform:rotateY(-180deg)}.flip.on .face.bad{transform:none}

/* ============ ARENA E DESCANSO ============ */
.arena{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;flex-direction:column;opacity:0;transform:scale(1.04);pointer-events:none;transition:opacity var(--t3) var(--ease),transform var(--t3) var(--ease);--hue:var(--accent)}
.arena.on{opacity:1;transform:none;pointer-events:auto}
.arena::before{content:"";position:absolute;inset:0 0 auto;height:55%;background:radial-gradient(90% 70% at 50% 0%,color-mix(in srgb,var(--hue) 22%,transparent),transparent 70%);pointer-events:none}
.arena-in{position:relative;flex:1;display:flex;flex-direction:column;max-width:600px;width:100%;margin:0 auto;min-height:0;padding-top:var(--sat)}
.ar-top{display:flex;align-items:center;gap:8px;padding:8px 10px}
.ar-title b{display:block;font:600 15px var(--f-display)}.ar-title small{font-size:12.5px;color:var(--muted)}
.ar-letter{font:800 34px/1 var(--f-display);color:var(--hue);opacity:.9;padding-right:8px}
.ar-prog{display:flex;gap:4px;padding:0 16px}
.ar-prog i{flex:1;height:4px;border-radius:4px;background:var(--surface3);transition:background var(--t3)}
.ar-prog i.done{background:var(--hue);opacity:.55}.ar-prog i.cur{background:var(--hue);box-shadow:0 0 10px var(--hue)}
.ar-stage{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;animation:rise var(--t3) var(--ease)}
.ar-name{font:700 30px/1.08 var(--f-display);letter-spacing:-.025em}
.ghost{font-size:13.5px;color:var(--muted);padding:8px 12px;border-radius:12px;border:1px dashed var(--line2)}
.hint{font-size:14.5px;color:var(--hue);font-weight:500}
.how{font-size:15px;line-height:1.55;color:var(--text);opacity:.88}
.dial-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.dial{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.dial .icon-btn{width:56px;height:56px;background:var(--surface2);border:1px solid var(--line2)}
.dial-v{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;touch-action:none;cursor:ns-resize;padding:4px 10px;border-radius:18px;position:relative}
.dial-v::before,.dial-v::after{content:"";position:absolute;left:50%;width:18px;height:3px;border-radius:3px;background:var(--line2);transform:translateX(-50%)}
.dial-v::before{top:-4px}.dial-v::after{bottom:-4px}
.dial-v input{width:3.6ch;background:none;border:0;outline:none;text-align:center;font:800 72px/1 var(--f-display);letter-spacing:-.04em;color:var(--text);padding:0}
.dial-v span{font:600 13px var(--f-body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.dial.small .dial-v input{font-size:40px;width:2.6ch}
.dial.noload{display:none}
.pips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pip{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px;min-height:56px}
.pip i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-display);font-style:normal;border:2px solid var(--line2);transition:all var(--t2) var(--spring)}
.pip small{font-size:11px;color:var(--muted)}
.pip.cur i{border-color:var(--hue);box-shadow:0 0 0 4px color-mix(in srgb,var(--hue) 25%,transparent)}
.pip.done i{background:var(--hue);border-color:var(--hue);color:#0D0D0F}
.pip.pop i{animation:kpop 480ms var(--spring)}
.setrows{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center}
.setrow .n{font:700 15px var(--f-display);color:var(--muted);text-align:center}
.ar-bar{display:flex;align-items:center;gap:8px;padding:10px 12px calc(var(--sab) + 12px);background:linear-gradient(0deg,var(--bg) 60%,transparent)}
.icon-btn.lg{width:56px;height:56px;background:var(--surface2);border:1px solid var(--line2)}
.btn.cta{min-height:60px;font-size:16px;letter-spacing:.02em;background:linear-gradient(135deg,color-mix(in srgb,var(--hue) 70%,#fff),var(--hue));box-shadow:0 12px 36px -10px var(--hue)}
.rest{position:fixed;inset:0;z-index:170;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity var(--t3) var(--ease)}
.rest.on{opacity:1;pointer-events:auto}
.rest-in{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(360px,90vw);padding-bottom:var(--sab)}
.rest-in .ring .arc{transition:stroke-dashoffset 250ms linear}
.rest-time{font:800 64px/1 var(--f-display);letter-spacing:-.03em}
.rest-next{color:var(--muted);text-align:center;min-height:1.4em}
.rest-btns{width:100%}
.painscale{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.painscale button{min-height:52px;border-radius:14px;font:700 18px var(--f-display);background:color-mix(in srgb,var(--bad) calc(var(--p) * 70%),color-mix(in srgb,var(--ok) 35%,var(--surface2)))}
.painscale button:active{transform:scale(.92)}
.receipt .li{animation:rise var(--t3) var(--ease) both}
.receipt .up{color:var(--ok)}.receipt .down{color:var(--warn)}

/* ============ LENTES ============ */
.lens{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;opacity:0;transform:translateY(24px) scale(.985);pointer-events:none;transition:opacity var(--t3) var(--ease),transform var(--t3) var(--ease)}
.lens.on{opacity:1;transform:none;pointer-events:auto}
body.lock:has(.lens.on) .river{transform:scale(.96);filter:blur(4px);transition:transform var(--t3) var(--ease),filter var(--t3)}
.lens-in{flex:1;display:flex;flex-direction:column;min-height:0;max-width:600px;width:100%;margin:0 auto;padding-top:var(--sat)}
.lens-top{display:flex;align-items:center;gap:8px;padding:8px 14px 4px 6px}
.lens-rail{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 10px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.lens-rail::-webkit-scrollbar{display:none}
.lr{display:flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);white-space:nowrap;flex:none}
.lr .icon{width:16px;height:16px}
.lr.on{color:var(--on-accent);background:var(--accent);border-color:transparent}
.lens-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px calc(var(--sab) + 28px);display:flex;flex-direction:column;gap:12px}
.lens-body>*{animation:rise var(--t3) var(--ease) both}
.lens-body>*:nth-child(2){animation-delay:40ms}.lens-body>*:nth-child(3){animation-delay:80ms}.lens-body>*:nth-child(4){animation-delay:120ms}
.card.glow{background:linear-gradient(135deg,rgba(217,137,79,.1),var(--surface));border-color:rgba(217,137,79,.25)}
.card.meal{padding:4px 16px}.card.meal details.fold{border-top:0}
.card.meal summary small{display:block;font-size:13px;font-weight:400}
.sec-t{margin-bottom:10px}
.card>details.fold:first-child{border-top:0}
.set-row{min-height:52px}
.row.around{justify-content:space-around}.center{text-align:center}.right{text-align:right}
.unit{font-size:16px;color:var(--muted);font-weight:500}
.chart{width:100%;height:auto;margin:6px 0}.chart text{font:500 10px var(--f-body);fill:var(--muted)}
.chart .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ms-box{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 2px var(--line2);color:transparent}
.li.ok .ms-box{background:var(--ok);box-shadow:none;color:#0D0D0F}
.li small{display:block}
.weeks8{display:flex;gap:6px}.wsq{flex:1;text-align:center}.wsq i{display:block;height:34px;border-radius:9px}
.seg.neck button.on{background:color-mix(in srgb,var(--ok) calc(var(--n) * 18%),var(--surface))}
.daychips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dchip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-height:64px}
.dchip b{font:800 20px var(--f-display);color:var(--hue)}.dchip small{font-size:11px;color:var(--muted)}
.dchip.on{border-color:var(--hue);background:color-mix(in srgb,var(--hue) 14%,var(--surface))}
details.ex>summary{gap:8px;min-height:64px}details.ex>summary b{display:block;font-weight:600}details.ex>summary small{display:block;font-weight:400;font-size:13px}
.painhist{display:flex;gap:6px;flex-wrap:wrap}
.painhist span{display:flex;flex-direction:column;align-items:center;min-width:36px;padding:6px 4px;border-radius:10px;background:color-mix(in srgb,var(--bad) calc(var(--p) * 60%),var(--surface2))}
.painhist small{font-size:10px;color:var(--muted)}
.water-hero{display:flex;flex-direction:column;align-items:center;gap:14px}
.bottle-wrap{position:relative;width:190px}
.bottle{width:100%;height:auto;color:var(--muted);overflow:visible}
.wlevel{transition:transform 1.1s var(--ease)}
.wwave{animation:wave 3.2s linear infinite}.wwave.b{animation-duration:5s;animation-direction:reverse}
@keyframes wave{to{transform:translateX(-100px)}}
.bub{animation:bub 3.5s ease-in infinite}.bub.d2{animation-delay:1.2s}.bub.d3{animation-delay:2.1s}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.6}100%{transform:translateY(-230px);opacity:0}}
.bottle-txt{position:absolute;inset:40% 0 auto;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.bottle-txt .lbl{color:#fff;opacity:.85}
.wbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;border-radius:14px;background:rgba(108,196,224,.1);border:1px solid rgba(108,196,224,.22);color:var(--water)}
.wbtn b{font:700 17px var(--f-display)}.wbtn small{font-size:11.5px;color:var(--muted)}.wbtn:active{transform:scale(.94)}
.week{display:flex;gap:8px;align-items:flex-end;height:110px;padding-top:6px}
.week .d{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.week .d i{width:100%;border-radius:8px;transition:height var(--t3) var(--ease)}
.week .d span{font-size:11px;color:var(--muted)}.week .d.t span{color:var(--accent-ink);font-weight:700}
.wdrop{color:var(--water)}
.aura-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 10px}
.aura-core{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6 0,transparent 30%),conic-gradient(from 90deg,var(--accent),var(--c-e),var(--water),var(--accent));animation:orbspin 10s linear infinite;box-shadow:0 0 50px -6px rgba(217,137,79,.6)}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;animation:rise var(--t2) var(--ease) both;word-wrap:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent-hi),var(--accent));color:var(--on-accent);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err{border-color:var(--bad);color:var(--bad)}
.msg img{display:block;max-width:100%;border-radius:12px;margin-top:8px}
.msg.typing{display:flex;gap:5px;padding:14px}.msg.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:breathe 1s infinite}.msg.typing i:nth-child(2){animation-delay:.2s}.msg.typing i:nth-child(3){animation-delay:.4s}
.chat-bar{position:sticky;bottom:0;margin-top:auto!important;display:flex;align-items:flex-end;gap:4px;padding:8px;margin:0 -8px;border-radius:22px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-line)}
.chat-bar textarea{resize:none;min-height:44px;max-height:140px;padding:10px 12px;border-radius:14px}
.icon-btn.send{background:var(--accent);color:var(--on-accent)}

.logo-card{display:grid;place-items:center}.logo-card img{border-radius:24px;max-width:200px;height:auto}
.powered{text-align:center;padding:10px 0 20px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}

const KEY = "sir_v2", KEY_V1 = "sir_v1", KEY_SEC = "sir_secrets", SECRET_KEYS = ["gemKey", "ghToken", "ghGistId"];

const newProfile = (name, p = {}) => ({
  id: uid("p"), profile: Object.assign({ name, startWeight: 140, goal: 105, height: 179, age: 24, avatar: false }, p),
  weights: [], days: {}, logs: {}, sel: {}, pain: [], neck: [], cur: null, chat: [], favs: {},

function mergeProfile(o) {
  const d = newProfile("Hobert"), s = Object.assign(d, o || {});
  s.profile = Object.assign(d.profile, (o || {}).profile);
  s.settings = Object.assign(baseSettings(), (o || {}).settings);
  if (!Array.isArray(s.habits) || !s.habits.length) s.habits = defHabits();
  if (!Array.isArray(s.supps)) s.supps = defSupps();
  if (!s.habits.some(h => h.id === s.settings.rule1)) s.settings.rule1 = s.habits[0].id;
  if (!(o && o.settings && o.settings.calcWeight)) s.settings.calcWeight = s.profile.startWeight;
  SECRET_KEYS.forEach(k => delete s.settings[k]);
  return s;
}
// v1 (um perfil só, segredos dentro de settings) → v2
function migrateV1(o, keepSecrets = true) {
  const st = o.settings || {};
  if (keepSecrets) SECRET_KEYS.forEach(k => { if (st[k] && !SEC[k]) SEC[k] = st[k]; });
  const p = mergeProfile(o); p.id = "p1"; p.profile.avatar = true;
  return { v: 2, active: "p1", theme: st.theme || "auto", profiles: { p1: p } };
}
function mergeRoot(o) {
  const r = { v: 2, active: o.active, theme: o.theme || "auto", profiles: {} };
  Object.entries(o.profiles || {}).forEach(([id, p]) => { r.profiles[id] = mergeProfile(p); r.profiles[id].id = id; });
  if (!Object.keys(r.profiles).length) { const p = newProfile("Hobert"); p.id = "p1"; r.profiles.p1 = p; }
  if (!r.profiles[r.active]) r.active = Object.keys(r.profiles)[0];
  return r;
}
const rootFrom = o => o && o.v === 2 && o.profiles ? mergeRoot(o) : o && o.profile && o.days ? migrateV1(o) : null;
const useProfile = id => { R.active = id; S = R.profiles[id]; };

const IDB = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open("sir-db", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async put(v, k = "state2") { try { const db = await this.open(); db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch (e) { } },
  async get(k = "state2") { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } }
};
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const parse = raw => { try { return raw ? JSON.parse(raw) : null; } catch (e) { return null; } };
let idbTimer = null;
function save() {
  const j = JSON.stringify(R);
  try { localStorage.setItem(KEY, j); } catch (e) { }
  clearTimeout(idbTimer); idbTimer = setTimeout(() => IDB.put(j), 300);
  if (typeof cloudQueue === "function") cloudQueue();
}
function saveSec() { try { localStorage.setItem(KEY_SEC, JSON.stringify(SEC)); } catch (e) { } }
// ordem: v2 local → v2 IndexedDB → v1 local → v1 IndexedDB → perfil novo. A chave sir_v1 nunca é apagada (rollback).
async function loadState() {
  SEC = Object.assign({ gemKey: "", ghToken: "", ghGistId: "" }, parse(lsGet(KEY_SEC)));
  const tries = [() => lsGet(KEY), () => IDB.get("state2"), () => lsGet(KEY_V1), () => IDB.get("state")];
  for (const t of tries) { R = rootFrom(parse(await t())); if (R) break; }
  if (!R) R = migrateV1({ profile: { name: "Hobert" }, days: {} }, false);
  useProfile(R.active); saveSec(); save();
}
function profileCreate(name, base) {
  const p = newProfile(name, base); R.profiles[p.id] = p; useProfile(p.id); save(); return p;
}
function profileDelete(id) {
  if (Object.keys(R.profiles).length < 2 || !R.profiles[id]) return false;
  delete R.profiles[id]; if (R.active === id) useProfile(Object.keys(R.profiles)[0]); save(); return true;
}

/* ============ REGRAS: dia, hábitos, sequências, ausência e metas (Mifflin-St Jeor) ============ */
const newDay = () => ({ h: {}, s: {}, water: 0, meals: [] });
const D = k => S.days[k] || newDay();
function DW(k) { if (!S.days[k]) S.days[k] = newDay(); return S.days[k]; }
const hasData = d => d && (Object.values(d.h || {}).some(Boolean) || Object.values(d.s || {}).some(Boolean) || d.water > 0 || (d.meals || []).length);
const habitCount = k => { const h = D(k).h; return S.habits.filter(x => h[x.id]).length; };
const habitByLink = l => S.habits.find(h => h.link === l);
function setLinked(k, link, v) { const h = habitByLink(link); if (h) DW(k).h[h.id] = v; }
// dia ativo = Regra nº 1 marcada + pelo menos N outros hábitos (N configurável, padrão 2)
function isActive(k) {
  const h = D(k).h, r = S.settings.rule1;
  const others = S.habits.filter(x => x.id !== r && h[x.id]).length;
  return !!h[r] && others >= S.settings.needOthers;
}
const firstDay = () => { const ks = Object.keys(S.days).filter(k => hasData(S.days[k])); ks.push(S.settings.start); return ks.sort()[0]; };
function dayStreak() { let k = today(); if (!isActive(k)) k = addDays(k, -1); let n = 0; const f = firstDay(); while (k >= f && isActive(k)) { n++; k = addDays(k, -1); } return n; }
const activeInWeek = mk => { let n = 0; for (let i = 0; i < 7; i++) if (isActive(addDays(mk, i))) n++; return n; };
// semana verde = 5+ dias ativos; amarela (4) não quebra; só 2 semanas ruins seguidas zeram
function weekStreak() {
  const cur = mondayOf(today()), first = mondayOf(firstDay());
  let n = activeInWeek(cur) >= 5 ? 1 : 0, reds = 0;
  for (let mk = addDays(cur, -7); mk >= first; mk = addDays(mk, -7)) {
    const a = activeInWeek(mk);
    if (a >= 5) { n++; reds = 0; } else if (a === 4) { reds = 0; } else { reds++; if (reds >= 2) break; }
  }
  return n;
}
function daysAbsent() {
  if (S.cur) return 0;
  const ks = Object.keys(S.days).filter(k => hasData(S.days[k])).concat(S.weights.map(w => w.d));
  Object.values(S.logs).forEach(a => a.forEach(l => ks.push(l.date)));
  if (!ks.length) return 0;
  ks.sort(); return Math.max(0, diffDays(today(), ks[ks.length - 1]));
}
const weekNo = () => Math.floor(diffDays(mondayOf(today()), mondayOf(S.settings.start)) / 7) + 1;
const inAdapt = () => weekNo() <= 2;

/* ---- metas nutricionais: TMB = 10×peso + 6,25×altura − 5×idade + 5; gasto = TMB × fator; meta = gasto − déficit (piso) ---- */
const curWeight = () => S.weights.length ? S.weights[S.weights.length - 1].kg : S.profile.startWeight;
function targets(w) {
  const p = S.profile, s = S.settings;
  const tmb = 10 * w + 6.25 * p.height - 5 * p.age + 5;
  const tdee = tmb * s.activity;
  const kcal = Math.max(s.floor, Math.round((tdee - s.deficit) / 50) * 50);
  return { tmb: Math.round(tmb), tdee: Math.round(tdee), kcal, prot: Math.round(1.2 * w / 5) * 5 };
}
const TG = () => targets(S.settings.calcWeight);
const dayTotals = k => D(k).meals.reduce((a, m) => ({ k: a.k + m.k, p: a.p + m.p }), { k: 0, p: 0 });
// recalcula as metas a cada 4 kg de variação em relação ao peso usado no cálculo
function recalcIfNeeded(kg) {
  if (Math.abs(kg - S.settings.calcWeight) < 4) return false;
  S.settings.calcWeight = r1(kg); return true;
}

/* ============ PROGRESSÃO AUTOMÁTICA (carga, variações e sequência A a E) ============ */
// Regra aplicada ao fim de cada treino, por exercício:
//  - fechou todas as repetições do topo da faixa em todas as séries: sobe um degrau (fora da adaptação)
//  - falhou na 1ª série ou em 2+ séries abaixo do mínimo da faixa: desce um degrau
//  - senão: mantém e busca o topo da faixa
function nextLoad(slot, sets, adapt = inAdapt()) {
  const kg = sets[0] ? sets[0].kg : 0, inc = slot.inc || 0;
  const top = sets.length >= slot.sets && sets.every(s => s.reps >= slot.reps[1]);
  const low = sets.filter(s => s.reps < slot.reps[0]).length;
  const fail = sets.length && (sets[0].reps < slot.reps[0] || low >= 2);
  if (top && inc && !adapt) return { dir: "up", kg: r1(kg + inc), inc, why: "Fechou todas as repetições." };
  if (fail && inc && kg > 0) return { dir: "down", kg: r1(Math.max(0, kg - inc)), inc, why: "Não fechou as repetições." };
  return { dir: "hold", kg, inc: 0, why: top && adapt ? "Adaptação: sem subir ainda." : `Busque ${slot.reps[1]} ${slot.unit ? "s" : "reps"} em todas as séries.` };
}
function stagnant(slot, vid) {
  if (inAdapt()) return null;
  const h = S.logs[vid] || []; if (h.length < 3 || slot.v.length < 2) return null;
  const l = h.slice(-3), same = l.every(x => x.sets[0].kg === l[0].sets[0].kg);
  const anyTop = l.some(x => x.sets.length >= slot.sets && x.sets.every(s => s.reps >= slot.reps[1]));
  if (!same || anyTop) return null;
  const i = slot.v.findIndex(x => x[0] === vid);
  return slot.v[(i + 1) % slot.v.length][1].replace(/ \(.*\)/, "");
}
function lastSession() {
  let best = null;
  Object.values(S.logs).forEach(a => a.forEach(l => { if (l.day && (!best || l.date > best.date)) best = l; }));
  return best;
}
// a sequência não quebra: se faltar um dia, o próximo treino continua de onde parou
function seqNext() { const l = lastSession(); return l ? DAY_ORDER[(DAY_ORDER.indexOf(l.day) + 1) % DAY_ORDER.length] : "A"; }

function prefill(slot, vid) {
  const hist = S.logs[vid] || [], last = hist[hist.length - 1];
  const out = []; let hint = "Sem histórico: escolha uma carga leve.";
  if (!last) { for (let i = 0; i < slot.sets; i++) out.push({ kg: 0, reps: slot.reps[0], done: false }); return { sets: out, hint, ghost: null }; }
  const nx = nextLoad(slot, last.sets), delta = nx.kg - (last.sets[0] ? last.sets[0].kg : 0);
  for (let i = 0; i < slot.sets; i++) { const ls = last.sets[i] || last.sets[last.sets.length - 1]; out.push({ kg: r1(Math.max(0, ls.kg + delta)), reps: nx.dir === "hold" ? ls.reps : slot.reps[0], done: false }); }
  hint = `${nx.dir === "up" ? `Hoje +${nx.inc} kg` : nx.dir === "down" ? `Hoje −${nx.inc} kg` : "Mantenha a carga"}. ${nx.why}`;
  return { sets: out, hint, ghost: `${dispDate(last.date)}: ${last.sets.map(s => `${s.kg}×${s.reps}`).join(" · ")}` };
}

function deloadSignal() {
  let n = 0;
  DAY_ORDER.forEach(L => PLAN[L].ex.forEach(slot => slot.v.forEach(v => {
    const h = S.logs[v[0]] || []; if (h.length < 2) return;
    const [a, b] = h.slice(-2);

const stepsOf = L => { const st = []; if (PLAN[L].cuff) CUFF.forEach(c => st.push({ t: "warm", c })); PLAN[L].ex.forEach(e => st.push({ t: "ex", e })); return st; };
const curStep = () => stepsOf(S.cur.day)[S.cur.i];
function wkData(step) {
  const c = S.cur;
  if (step.t === "warm") { c.data[step.c.id] = c.data[step.c.id] || { sets: Array.from({ length: step.c.sets }, () => ({ done: false })) }; return c.data[step.c.id]; }
  const slot = step.e; let dd = c.data[slot.id];
  if (!dd) { const vid = varId(slot), pf = prefill(slot, vid); dd = c.data[slot.id] = { vid, sets: pf.sets, hint: pf.hint, ghost: pf.ghost }; }
  return dd;
}
function wkBegin(L) { S.cur = { day: L, date: today(), i: 0, mode: S.settings.logMode, data: {} }; save(); }
// ajusta kg ou reps da série indicada e das pendentes seguintes (a carga costuma se repetir)
function wkAdjust(dd, i, f, d) {
  for (let j = i; j < dd.sets.length; j++) if (j === i || !dd.sets[j].done) dd.sets[j][f] = Math.max(0, r1(num(dd.sets[j][f]) + d));
}
// grava os exercícios com séries feitas, calcula a próxima carga e marca o hábito ligado ao treino
function wkCommit() {
  const c = S.cur, rows = [];
  PLAN[c.day].ex.forEach(slot => {
    const d = c.data[slot.id]; if (!d) return;
    const sets = d.sets.filter(s => s.done).map(s => ({ kg: num(s.kg), reps: num(s.reps) })); if (!sets.length) return;
    const nx = nextLoad(slot, sets);
    (S.logs[d.vid] = S.logs[d.vid] || []).push({ date: c.date, day: c.day, sets });
    rows.push({ slot, vid: d.vid, nx, stag: stagnant(slot, d.vid) });

  const dd = DW(c.date); dd.wk = c.day; setLinked(c.date, "treino", true);

/* ============ ÁGUA: registro, ritmo por hora (6h–21h), sequência na meta ============ */
const WSIZES = [["Gole", 100], ["Copo", 200], ["Copo grande", 300], ["Garrafa", 500], ["Squeeze", 750], ["1 litro", 1000]];
const W_FROM = 6, W_TO = 21;
function waterAdd(ml, k = today()) {
  const d = DW(k), goal = S.settings.waterGoal, before = d.water || 0;
  d.wlog = d.wlog || [];
  if (ml > 0) d.wlog.push({ t: k === today() ? hhmm(new Date()) : "—", ml });
  d.water = Math.max(0, before + ml);
  setLinked(k, "agua", d.water >= goal); save(); haptic(ml > 0 ? 12 : 8);
  return before < goal && d.water >= goal;
}
function waterUndo(k = today()) {
  const d = DW(k); d.wlog = d.wlog || [];
  const last = d.wlog.pop(); d.water = Math.max(0, (d.water || 0) - (last ? last.ml : 250));
  setLinked(k, "agua", d.water >= S.settings.waterGoal); save();
  return last;
}
function waterGoalAdj(delta) {
  S.settings.waterGoal = clamp(S.settings.waterGoal + delta, 1000, 8000);
  const d = DW(today()); setLinked(today(), "agua", (d.water || 0) >= S.settings.waterGoal); save();
}
function waterStreak() {
  let n = 0, k = today(); if ((D(k).water || 0) < S.settings.waterGoal) k = addDays(k, -1);
  while ((D(k).water || 0) >= S.settings.waterGoal) { n++; k = addDays(k, -1); }
  return n;
}
// quanto deveria ter bebido até a hora h (linear das 6h às 21h, arredondado a 50 ml)
const waterExpected = h => Math.round(S.settings.waterGoal * clamp((h - W_FROM) / (W_TO - W_FROM), 0, 1) / 50) * 50;
// hora do dia em que o volume bebido "estaria no ritmo" (usada para desenhar a maré no rio)
const waterHourFor = ml => W_FROM + (W_TO - W_FROM) * clamp(ml / S.settings.waterGoal, 0, 1);
function waterPace(w) {
  const now = new Date(), h = now.getHours() + now.getMinutes() / 60, goal = S.settings.waterGoal;
  const exp = waterExpected(h), diff = w - exp;
  if (w >= goal) return ["ok", "Meta batida. Agora é só beber quando sentir sede.", exp];
  if (h < W_FROM) return ["acc", "Comece o dia com um copo grande ao acordar.", exp];
  if (diff >= 0) return ["ok", `No ritmo: ${diff ? "+" + diff + " ml à frente" : "exatamente no alvo"} (esperado até agora: ${exp} ml).`, exp];
  return [diff < -700 ? "warn" : "acc", `${-diff} ml atrás do ritmo. Um copo agora resolve (esperado até agora: ${exp} ml).`, exp];
}
const waterWeek = () => { const mon = mondayOf(today()); return Array.from({ length: 7 }, (_, i) => { const k = addDays(mon, i); return { k, v: D(k).water || 0 }; }); };
const waterAvg7 = () => Math.round(Array.from({ length: 7 }, (_, i) => D(addDays(today(), -i)).water || 0).reduce((a, b) => a + b, 0) / 7);

/* ============ MOTOR METABÓLICO: proteína e água para o resto do dia ============ */
const END_OF_DAY = 22;
const gramsFor = (nome, alvoProt) => { const f = FOODS[foodIdx(nome)]; return f ? Math.round(alvoProt / (f[2] / 100)) : 0; };
// quanto comer de cada fonte para bater t gramas de proteína (valores da tabela do app)
function protExamples(t) {
  const ovo = FOODS[foodIdx("Ovo de galinha cozido")];
  return [
    `~${gramsFor("Peito de frango grelhado", t)} g de frango grelhado`, `~${gramsFor("Patinho grelhado", t)} g de patinho`,
    `~${Math.round(t / (ovo[2] * ovo[4] / 100))} ovos cozidos`, `~${gramsFor("Queijo mussarela", t)} g de queijo mussarela`,
    `~${gramsFor("Albumina (pó)", t)} g de albumina em pó`
  ];
}
function dietAdvice(d, now, remP, perMeal) {
  const timed = (d.meals || []).filter(m => m.t), last = timed.length ? new Date(timed[timed.length - 1].t) : null;
  if (remP <= 0) return { txt: "Meta de proteína batida. Se comer mais tarde, priorize fibras e vegetais.", next: null };
  if (!last) return { txt: `Primeira refeição do dia? Faltam ${Math.round(remP)} g. Comece com ${perMeal} g de proteína.`, next: now };
  const diffHrs = (now - last) / 36e5, nx = new Date(last.getTime() + 3.5 * 36e5);
  if (diffHrs < 2) return { txt: `Você comeu há pouco. Próxima refeição sugerida às ${hhmm(nx)}. Faltam ${Math.round(remP)} g de proteína no dia.`, next: nx };
  if (diffHrs >= 3.5) return { txt: `Já dá para comer de novo. Faltam ${Math.round(remP)} g no dia: tente ${perMeal} g na próxima refeição.`, next: now };
  return { txt: `Faltam ${Math.round(remP)} g no dia. Sugestão para a próxima refeição: ${perMeal} g de proteína.`, next: nx };
}
function getMetabolicAdvice(k = today()) {
  const d = D(k), tg = TG(), tot = dayTotals(k), now = new Date(), h = now.getHours();
  if (h >= END_OF_DAY) return { diet: "Dia finalizado. Hora de descansar o sistema digestivo.", water: "Beba água com moderação agora para não prejudicar o sono.", ex: [], next: null, per: 0 };
  if (h < 5) return { diet: "Madrugada. Se estiver acordado, mantenha-se hidratado.", water: "Beba água se tiver sede.", ex: [], next: null, per: 0 };
  const remP = Math.max(0, tg.prot - tot.p), hoursLeft = END_OF_DAY - h;
  const perMeal = Math.round(remP / Math.max(1, Math.floor(hoursLeft / 3.5)));
  const da = dietAdvice(d, now, remP, perMeal), t = perMeal > 0 ? perMeal : Math.round(remP);
  const remW = Math.max(0, S.settings.waterGoal - (d.water || 0)), mlh = Math.round(remW / hoursLeft);
  const water = remW <= 0 ? "Meta de hidratação batida." : mlh > 600 ? "Você está atrasado na água para este horário. Beba 500 ml agora." : `Ritmo ideal: cerca de ${mlh} ml por hora até as ${END_OF_DAY}h.`;
  return { diet: da.txt, water, ex: remP > 0 ? protExamples(t) : [], per: t, next: da.next };
}

// Todo backup e toda cópia na nuvem passam por safeState(): nunca levam chave do Gemini, token nem gist id.
function safeState() {
  const c = JSON.parse(JSON.stringify(R));

function download(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportData() {

// aceita backup v2 (todos os perfis) ou v1 (um perfil: substitui o perfil ativo)

  if (o && o.profile && o.days) { const id = R.active, p = mergeProfile(o); p.id = id; R.profiles[id] = p; useProfile(id); return "perfil " + p.profile.name; }
  throw new Error("formato desconhecido");

function importFile(f) {

/* ============ NUVEM: cópia automática em um gist secreto do GitHub ============ */
// Gist "secreto" NÃO é privado: quem tiver o link consegue ler. Os dados de saúde vão para lá.
// Token e gist id ficam só em SEC (este aparelho). A cópia leva todos os perfis via safeState().
const GIST_FILE = "still-i-rise.json";
const ghHead = () => ({ Authorization: "Bearer " + SEC.ghToken, Accept: "application/vnd.github+json", "Content-Type": "application/json" });
let cloudT = null;
function cloudQueue() { if (!R || !SEC.ghToken || !SEC.ghGistId) return; clearTimeout(cloudT); cloudT = setTimeout(() => syncToCloud(false), 8000); }
async function syncToCloud(manual) {
  if (!SEC.ghToken) return manual && toast("Cole o token do GitHub primeiro.");
  const body = { description: "Still I Rise: cópia dos dados", files: { [GIST_FILE]: { content: JSON.stringify(safeState()) } } };
  try {
    const id = SEC.ghGistId, r = await fetch(id ? "https://api.github.com/gists/" + encodeURIComponent(id) : "https://api.github.com/gists",
      { method: id ? "PATCH" : "POST", headers: ghHead(), body: JSON.stringify(id ? body : { ...body, public: false }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.message || r.status);
    if (!SEC.ghGistId) { SEC.ghGistId = j.id; saveSec(); }
    S.settings.cloudAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(R)); } catch (e) { }
    if (manual) { toast("Dados enviados para a nuvem."); render(); }
  } catch (e) { if (manual) toast("Falha ao enviar: " + e.message); }
}
async function syncFromCloud() {
  if (!SEC.ghToken || !SEC.ghGistId) return toast("Informe o token e o Gist ID.");
  try {
    const r = await fetch("https://api.github.com/gists/" + encodeURIComponent(SEC.ghGistId), { headers: ghHead() }), j = await r.json();
    if (!r.ok) throw new Error(j.message || r.status);
    const f = j.files && j.files[GIST_FILE]; if (!f) throw new Error("arquivo não encontrado no gist");
    const o = JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content);
    if (!o || !(o.profiles || (o.profile && o.days))) throw new Error("dados inválidos");
    if (!confirm("Substituir os dados deste aparelho pela cópia da nuvem?")) return;
    importObject(o); save(); applyTheme(); closeAll(); render(); toast("Dados restaurados da nuvem.");
  } catch (e) { toast("Falha ao baixar: " + e.message); }
}

  SEC.ghGistId = g ? g.value.trim() : ""; saveSec(); toast("Nuvem configurada!"); render();
  if (SEC.ghToken) syncToCloud(true);
};

const GEM_PROMPT = "Você é um nutricionista brasileiro. Analise a foto de uma refeição e liste cada alimento visível separadamente. Para cada um estime o peso já preparado (gramas), kcal e proteína (g) desse peso, usando valores típicos da TACO/comida brasileira. Seja conservador e realista com óleo, molhos e porções. Se houver bebida, inclua. Se a imagem não mostrar comida, devolva a lista vazia. Responda somente em JSON.";
const GEM_SCHEMA = {
  type: "OBJECT",
  properties: {
    itens: { type: "ARRAY", items: { type: "OBJECT", properties: { nome: { type: "STRING" }, gramas: { type: "NUMBER" }, kcal: { type: "NUMBER" }, proteina_g: { type: "NUMBER" } }, required: ["nome", "gramas", "kcal", "proteina_g"] } },

// reduz a foto para no máximo 1024 px e devolve base64 (vai inline na requisição, não é guardada)
function fotoDownscale(file, max = 1024) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.8).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Não consegui ler essa imagem.")); };
    img.src = url;
  });
}

}

  const i = STACK.lastIndexOf(id); if (i < 0) return;

}

  if (skipPop) { skipPop--; return; }
  const top = STACK[STACK.length - 1]; if (top) dropLayer(top, true);
});

  const pts = $$(".timeline [data-min]").map(e => [+e.dataset.min, e.offsetTop + (e.classList.contains("now") ? e.offsetHeight / 2 : 29)]); if (pts.length < 2) return;
  const yOf = m => { if (m <= pts[0][0]) return pts[0][1]; for (let i = 1; i < pts.length; i++) if (m <= pts[i][0]) { const [m0, y0] = pts[i - 1], [m1, y1] = pts[i]; return y0 + (y1 - y0) * (m1 === m0 ? 1 : (m - m0) / (m1 - m0)); } return pts[pts.length - 1][1]; };

/* ============ INTERPRETADOR DA PALETA: texto livre → ações ============ */
// Entende: "água 500", "500", "garrafa", "peso 118,4 cintura 121", "cardio 30 6,5 5", "fibra 5", "dor 3", "pescoço 4",
// "repetir almoço", "frango 150 @almoço" (refeição pelo horário se omitida), "?pergunta" para a Aura, e comandos/lentes.
const MEAL_ALIAS = { cafe: "Café da manhã", "cafe da manha": "Café da manhã", manha: "Café da manhã", almoco: "Almoço", alm: "Almoço", lanche: "Lanche", jantar: "Jantar", janta: "Jantar", ceia: "Ceia" };
const cmd = (icon, label, sub, run) => ({ icon, label, sub, run });
function mealIn(t) {
  const m = t.match(/@\s*([a-z ]+)$/) || t.match(/\b(cafe da manha|cafe|almoco|alm|lanche|jantar|janta|ceia)\s*$/);
  return m ? { meal: MEAL_ALIAS[m[1].trim()] || null, rest: t.slice(0, m.index).trim() } : { meal: null, rest: t };
}
function parseWater(t) {
  let m = t.match(/^(?:agua|beber|bebi)\s*\+?\s*(\d{2,4})\s*(?:ml)?$/) || t.match(/^\+?(\d{2,4})\s*(?:ml)?\s*(?:de\s+)?(?:agua)?$/);
  if (m && +m[1] > 0 && +m[1] <= 3000) return [cmd("drop", `Água +${m[1]} ml`, "Registrar agora", () => waterDo(+m[1]))];
  const sz = WSIZES.find(([n]) => normTxt(n) === t.replace(/^agua\s+/, ""));
  return sz ? [cmd("drop", `Água +${sz[1]} ml`, sz[0], () => waterDo(sz[1]))] : [];
}
function parseNumbers(t) {
  let m;
  if ((m = t.match(/^peso\s+([\d.,]+)(?:\s*kg)?(?:\s+cintura\s+([\d.,]+))?/))) return [cmd("scale", `Peso ${m[1]} kg${m[2] ? ` · cintura ${m[2]} cm` : ""}`, "Registrar pesagem de hoje", () => weighSave(num(m[1]), num(m[2])))];
  if ((m = t.match(/^cardio\s+(\d+)(?:\s+([\d.,]+))?(?:\s+([\d.,]+))?/))) return [cmd("flame", `Cardio ${m[1]} min`, `${m[2] ? m[2] + " km/h " : ""}${m[3] ? "· " + m[3] + "% " : ""}`, () => { cardioAdd(+m[1], num(m[2]), num(m[3]), dayK()); toast("Cardio registrado."); })];
  if ((m = t.match(/^fibras?\s+(-?\d+)/))) return [cmd("leaf", `Fibras ${+m[1] > 0 ? "+" : ""}${m[1]} g`, "Registro manual", () => { fiberAdd(+m[1], dayK()); toast("Fibras: " + D(dayK()).fiber + " g."); })];
  if ((m = t.match(/^dor\s+(\d{1,2})$/)) && +m[1] <= 10) return [cmd("shield", `Dor no ombro ${m[1]}/10`, "Registrar agora", () => painDo(+m[1]))];
  if ((m = t.match(/^pesco[c]?o\s+([1-5])$/))) return [cmd("sun", `Pescoço ${m[1]}/5`, "Termômetro da acantose", () => neckSave(+m[1]))];
  if ((m = t.match(/^repetir\s+(.+)$/))) { const ml = MEAL_ALIAS[m[1].trim()] || MEAL_NAMES.find(x => normTxt(x).startsWith(m[1].trim())); if (ml) return [cmd("repeat", `Repetir ${ml}`, `${lastMealItems(ml, dayK()).length} itens da última vez`, () => { const n = mealRepeat(ml, dayK()); toast(n ? `${n} itens adicionados.` : "Nada para repetir."); })]; }
  return [];
}
function parseFood(t) {
  const { meal, rest } = mealIn(t), gm = rest.match(/(\d+[.,]?\d*)\s*(g|gramas?)?\b/), g = gm ? num(gm[1]) : 0;
  const q = (gm ? rest.replace(gm[0], " ") : rest).replace(/\s+de\s+/g, " ").trim(); if (q.length < 2) return [];
  const m = meal || mealByTime();
  // seus favoritos, recentes e as sugestões das refeições vêm antes (ex.: "frango" → peito grelhado, não frango frito)
  const mine = new Set([...recentFoods(20).map(x => x.n), ...Object.values(S.favs || {}).flat(), ...MEALS.flatMap(x => x[2])]);
  const hits = foodSearch(q, 40), top = hits.filter(i => mine.has(FOODS[i][0])).concat(hits.filter(i => !mine.has(FOODS[i][0]))).slice(0, 5);
  return top.map(i => { const f = FOODS[i], gg = g > 0 && g < 2000 ? g : f[4];
    return cmd("fork", `${shortName(f[0])} · ${gg} g`, `${m} · ${Math.round(f[1] * gg / 100)} kcal · ${r1(f[2] * gg / 100)} g prot`, () => { foodAdd(i, gg, m, dayK()); toast(`Adicionado em ${m}.`); if (isSugarDrink(f)) toast("Bebida com açúcar: quebra a Regra nº 1 de hoje."); }); });
}

    [["agua", "hidrat"], L("agua", "Água", "drop")], [["plano", "treino"], L("treino", "Treino", "dumb")],
    [["aura", "ia", "chat"], L("aura", "Aura (IA)", "sparkles")], [["sistema", "config", "ajuste", "perfil", "habito", "suplemento", "catalogo"], L("sistema", "Sistema", "gear")]
  ];

function parseCommand(raw) {
  const t = normTxt(raw.trim()).replace(/\s+/g, " "); if (!t) return [];
  if (t.startsWith("?")) return [cmd("sparkles", "Perguntar à Aura", raw.trim().slice(1), () => { openLens("aura"); askAura(raw.trim().slice(1).trim()); })];
  const direct = [...parseWater(t), ...parseNumbers(t)];
  const pm = t.match(/^perfil\s+(.+)$/), prof = pm ? Object.values(R.profiles).filter(p => normTxt(p.profile.name).includes(pm[1])).map(p => cmd("user", "Trocar para " + p.profile.name, "Perfil", () => switchProfile(p.id))) : [];
  const stat = staticCommands().filter(([ks]) => ks.some(k => k.startsWith(t) || t.startsWith(k))).map(x => x[1]);
  return [...direct, ...prof, ...parseFood(t), ...stat].slice(0, 9);
}

/* ============ ORBE: paleta de comandos (campo embaixo, perto do polegar; resultados acima) ============ */
const PAL = { items: [] };
// estado visual da Aura no orbe: brilha conforme proteína, água e cardio do dia
function auraState(d, tg) {
  const p = (d.meals || []).reduce((a, m) => a + (m.p || 0), 0), cardio = (d.cardios || []).length > 0;
  if (p >= tg.prot * 0.9 && cardio) return ["overdrive", "Proteína e cardio do dia em dia. Segue o ritmo."];
  if (p >= 40 || (d.water || 0) > 1000) return ["fed", "O núcleo absorveu energia. Mantenha proteína e água."];
  return ["", "Sua aura precisa fluir. Tome um copo grande de água agora."];
}
function orbSync() { const o = $("#orb"); if (o) o.dataset.aura = auraState(D(today()), TG())[0]; }
function palEmptyHTML() {
  const [, msg] = auraState(D(today()), TG());
  const q = (act, icon, t, extra = "") => `<button class="pq" data-act="${act}" ${extra}>${ic(icon)}<span>${t}</span></button>`;
  const lens = [["corpo", "Corpo", "trend"], ["treino", "Treino", "dumb"], ["nutri", "Nutrição", "fork"], ["agua", "Água", "drop"], ["aura", "Aura", "sparkles"], ["sistema", "Sistema", "gear"]];

/* ============ DESCANSO: anel que esvazia, bipe (AudioContext), vibração e notificação ============ */
const RT = { end: 0, total: 0, paused: null, iv: null, next: "" };
let AC = null;
function beep() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime;
    [0, .25, .5].forEach(o => { const os = AC.createOscillator(), g = AC.createGain(); os.frequency.value = 880; os.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(.0001, t + o); g.gain.exponentialRampToValueAtTime(.4, t + o + .02); g.gain.exponentialRampToValueAtTime(.0001, t + o + .18); os.start(t + o); os.stop(t + o + .2); });
  } catch (e) { }
}
function unlockAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) { } }
function startRest(sec, next) {

  $("#rest").classList.add("on"); restDraw(true); RT.iv = setInterval(restTick, 250);
}
const restLeft = () => RT.paused !== null ? RT.paused : Math.max(0, Math.ceil((RT.end - Date.now()) / 1000));
function restDraw(full) {

    <p class="rest-next">${esc(RT.next)}</p>
    <div class="grid2 rest-btns"><button class="btn" data-act="rest-adj" data-s="-15">−15 s</button><button class="btn" data-act="rest-adj" data-s="15">+15 s</button>
    <button class="btn" data-act="rest-pause">${ic(RT.paused !== null ? "play" : "pause")} ${RT.paused !== null ? "Retomar" : "Pausar"}</button><button class="btn solid" data-act="rest-skip">Pular</button></div>`;
}
function restTick() { if (RT.paused !== null) return; if (restLeft() <= 0) return restDone(); restDraw(); }
function restDone() {

}
function closeRest() { clearInterval(RT.iv); RT.iv = null; $("#rest").classList.remove("on"); }
function notify(title, body) {

  try { if ("Notification" in window && Notification.permission === "granted") { if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification(title, { body, tag: "sir-rest", icon: "icon-192.png", vibrate: [200, 100, 200] })).catch(() => new Notification(title, { body })); else new Notification(title, { body }); } } catch (e) { }
}
ACT["rest-adj"] = b => { const s = num(b.dataset.s); if (RT.paused !== null) RT.paused = Math.max(1, RT.paused + s); else RT.end += s * 1000; RT.total = Math.max(1, RT.total + s); restDraw(); };

/* ============ ARENA (Modo Treino): um exercício por vez, carga gigante, séries em pontos, tela acesa ============ */
let wakeLock = null;

const focusOf = dd => dd.f != null && dd.sets[dd.f] ? dd.f : Math.max(0, dd.sets.findIndex(s => !s.done));

}

function wkNext() { const c = S.cur, st = stepsOf(c.day); if (c.i >= st.length - 1) return wkFinish(); c.i++; save(); arenaRender(); const s = $(".ar-stage"); if (s) s.scrollTop = 0; }

/* ============ ARENA: ações ============ */
const arenaDD = () => wkData(curStep());

function chartSVG() {

  const W = 340, H = 150, pl = 30, pr = 10, pt = 12, pb = 22, goal = S.profile.goal;
  const all = pts.map(p => p.kg).concat(goal), mn = Math.floor(Math.min(...all) - 1), mx = Math.ceil(Math.max(...all) + 1);
  const x = i => pl + i * (W - pl - pr) / (pts.length - 1), y = v => pt + (mx - v) / (mx - mn) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts.length - 1).toFixed(1)},${H - pb} L${pl},${H - pb}Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de peso das últimas ${pts.length} pesagens"><defs><linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pl}" x2="${W - pr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ok)" stroke-dasharray="4 4"/><text x="${pl + 2}" y="${y(goal) - 4}" fill="var(--ok)">meta ${goal}</text>
    <path d="${area}" fill="url(#wfill)"/><path class="draw" d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.kg)}" r="3.5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/>`).join("")}
    <text x="0" y="${y(mx) + 8}">${mx}</text><text x="0" y="${y(mn)}">${mn}</text><text x="${pl}" y="${H - 5}">${dispDate(pts[0].d)}</text><text x="${W - pr}" y="${H - 5}" text-anchor="end">${dispDate(pts[pts.length - 1].d)}</text></svg>`;
}

/* ============ LENTE ÁGUA: garrafa com onda, ritmo por hora, tamanhos, semana, histórico e meta ============ */
function bottleSVG(p, from) {
  const top = 46, bot = 312, y = bot - (bot - top) * p, y0 = bot - (bot - top) * from;
  const body = "M78 14h44v26c0 14 38 26 38 60v190a24 24 0 0 1-24 24H64a24 24 0 0 1-24-24V100c0-34 38-46 38-60z";
  const wave = "M-100 0q25-9 50 0t50 0 50 0 50 0 50 0 50 0 50 0 50 0 50 0 50 0V320H-100z";
  const ticks = [0.25, 0.5, 0.75].map(f => `<line x1="146" x2="160" y1="${bot - (bot - top) * f}" y2="${bot - (bot - top) * f}" stroke="currentColor" opacity=".45" stroke-width="2"/>`).join("");
  return `<svg viewBox="0 0 200 340" class="bottle" aria-hidden="true"><defs><clipPath id="bclip"><path d="${body}"/></clipPath>
    <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd6ee"/><stop offset="1" stop-color="#2f7fb5"/></linearGradient></defs>
    <path d="${body}" fill="var(--surface2)" opacity=".8"/>
    <g clip-path="url(#bclip)"><g class="wlevel" data-to="${y}" style="transform:translateY(${y0}px)"><g class="wwave b"><path d="${wave}" fill="#8fd6ee" opacity=".4"/></g><g class="wwave a"><path d="${wave}" fill="url(#wg)"/></g>
      <circle class="bub" cx="80" cy="330" r="4" fill="#fff" opacity=".5"/><circle class="bub d2" cx="118" cy="330" r="3" fill="#fff" opacity=".5"/><circle class="bub d3" cx="98" cy="330" r="2.5" fill="#fff" opacity=".5"/></g></g>
    <path d="${body}" fill="none" stroke="var(--water)" stroke-width="3" stroke-linejoin="round"/><rect x="76" y="4" width="48" height="12" rx="4" fill="var(--water)"/>${ticks}</svg>`;
}
LENS_R.agua = () => {
  const k = dayK(), d = D(k), goal = S.settings.waterGoal, w = d.water || 0, p = Math.min(1, w / goal), from = UI.wLast == null ? 0 : UI.wLast; UI.wLast = p;
  const [pc, pt] = waterPace(w), ws = waterStreak(), log = (d.wlog || []).slice().reverse();
  const bars = waterWeek().map(x => { const f = Math.min(1, x.v / goal); return `<div class="d ${x.k === today() ? "t" : ""}"><i style="height:${Math.max(6, f * 100)}%;background:${x.v >= goal ? "var(--ok)" : x.v ? "var(--water)" : "var(--surface3)"}"></i><span>${DOW[parseKey(x.k).getDay()][0]}</span></div>`; }).join("");
  requestAnimationFrame(() => requestAnimationFrame(() => { const g = $("#lens .wlevel"); if (g) g.style.transform = `translateY(${g.dataset.to}px)`; }));
  return `<section class="card water-hero"><div class="bottle-wrap">${bottleSVG(p, from)}<div class="bottle-txt"><div class="big tabnum">${fmtL(w, 2)}<small> L</small></div><div class="lbl">${Math.round(p * 100)}% de ${fmtL(goal)} L</div></div></div>
    ${k === today() ? `<div class="banner ${pc}">${ic("info")}<div class="grow">${pt}</div></div>` : ""}</section>
  ${sec("Beber agora", `<div class="grid3">${WSIZES.map(([n, ml]) => `<button class="wbtn" data-act="w-add" data-ml="${ml}"><small>${n}</small><b>+${ml}</b></button>`).join("")}</div>
    <div class="row"><input id="wcust" class="field" type="number" inputmode="numeric" placeholder="Outro valor em ml" aria-label="Quantidade em ml"><button class="btn solid" data-act="w-custom">Adicionar</button></div>
    <button class="btn ghost full" data-act="w-undo">Desfazer último registro</button>`)}
  ${sec("Esta semana", `<div class="row between"><span class="pill ${ws ? "ok" : ""}">${ws} ${ws === 1 ? "dia" : "dias"} seguidos na meta</span></div><div class="week">${bars}</div><p class="muted small">Média dos últimos 7 dias: ${fmtL(waterAvg7(), 2)} L. Barra verde = meta batida.</p>`)}
  ${sec(`Hoje · ${log.length} ${log.length === 1 ? "registro" : "registros"}`, log.length ? `<div class="list">${log.map(l => `<div class="li"><span class="wdrop">${ic("drop")}</span><span class="grow tabnum">${l.t}</span><b class="tabnum">+${l.ml} ml</b></div>`).join("")}</div>` : `<p class="muted">Nada registrado ainda. Comece com um copo grande ao acordar.</p>`)}
  ${sec("Meta diária", `<div class="row between"><button class="icon-btn lg" data-act="w-goal" data-d="-250" aria-label="Diminuir meta">${ic("minus")}</button><div class="h2 tabnum">${fmtL(goal, 2)} L</div><button class="icon-btn lg" data-act="w-goal" data-d="250" aria-label="Aumentar meta">${ic("plus")}</button></div>
    <p class="muted small">Referência comum: 35 ml por kg, cerca de ${fmtL(35 * (S.settings.calcWeight || 100))} L para ${S.settings.calcWeight || 100} kg. Se tiver dúvida sobre o seu caso (fígado, rins), pergunte ao médico.</p>`)}`;
};
function waterDo(ml) { if (waterAdd(ml, dayK())) toast("Meta de água batida. Sua garrafa está cheia."); else toast(`+${ml} ml`, () => { waterUndo(dayK()); render(); }); }
ACT["w-add"] = b => { waterDo(num(b.dataset.ml)); render(); };
ACT["w-custom"] = () => { const i = $("#wcust"), v = i ? num(i.value) : 0; if (v <= 0 || v > 3000) return toast("Digite um valor entre 1 e 3000 ml."); waterDo(v); render(); };
