<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Still I Rise</title>
<meta name="description" content="Still I Rise: treino, alimentação e hábitos para manter o peso perdido.">
<meta name="theme-color" content="#f7f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Still I Rise">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Sora:wght@500..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f2;--surface:#f7f5f2;--surface2:#efece6;--text:#242a2e;--muted:#5a656b;
  --accent:#c69c6d;--accent-ink:#8a5f2b;--accent-soft:#f1e3d0;--terra:#b45233;--terra-soft:#f6e1d9;
  --ok:#16a34a;--ok-soft:#e1f2e6;--sage:#506350;--sage-soft:#e5ebe3;--bad:#ef4444;--bad-soft:#fde4e2;--warn:#b7791f;--warn-soft:#faefd2;
  --sh-d:rgba(164,149,137,.26);--sh-l:rgba(255,255,255,.9);
  --raise:8px 8px 18px var(--sh-d),-8px -8px 18px var(--sh-l);
  --sub:4px 4px 10px var(--sh-d),-4px -4px 10px var(--sh-l);
  --inset:inset 4px 4px 8px var(--sh-d),inset -4px -4px 8px var(--sh-l);
  --line:rgba(36,42,46,.08);
  --f-display:'Sora','Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-ui:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#121316;--surface:#1a1c20;--surface2:#24272c;--text:#ece8e1;--muted:#a8a29a;
  --accent:#d4af37;--accent-ink:#e6c25a;--accent-soft:#2c2614;--terra:#d0704f;--terra-soft:#2e1a14;
  --ok:#22c55e;--ok-soft:#12261a;--sage:#8fb08f;--sage-soft:#1c261c;--bad:#f87171;--bad-soft:#2d1717;--warn:#e0b24a;--warn-soft:#2c2412;
  --sh-d:rgba(0,0,0,.6);--sh-l:rgba(255,255,255,.04);--line:rgba(255,255,255,.08);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:17px;line-height:1.5;font-feature-settings:"tnum" 0;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4,p{margin:0}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.fill{fill:currentColor}
.disp{font-family:var(--f-display)}
.lbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.tabnum{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(var(--safe-t) + 10px) 20px 10px;box-shadow:0 4px 16px var(--sh-d)}
.top-in{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.14em}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:#121316;box-shadow:var(--sub);object-fit:cover;display:block}
.logo-card{width:100%;max-width:240px;border-radius:20px;margin:0 auto;display:block;box-shadow:var(--raise)}
.circ-btn{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--sub);display:grid;place-items:center;color:var(--accent-ink);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.circ-btn:active{transform:scale(.96);box-shadow:var(--inset)}

main{max-width:480px;margin:0 auto;padding:18px 20px calc(120px + var(--safe-b));display:flex;flex-direction:column;gap:20px}
.view{display:none;flex-direction:column;gap:20px}
.view.on{display:flex}
.card{background:var(--surface);border-radius:20px;padding:20px;box-shadow:var(--raise);display:flex;flex-direction:column;gap:14px;opacity:0;transform:translateY(8px);animation:rise .5s cubic-bezier(.4,0,.2,1) forwards}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}.card:nth-child(n+6){animation-delay:.25s}
@keyframes rise{to{opacity:1;transform:none}}
.card.flat{box-shadow:var(--sub);padding:16px;border-radius:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.gap6{gap:6px}.wrap{flex-wrap:wrap}
.sec-t{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.dot.sage{background:var(--sage)}.dot.ok{background:var(--ok)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;letter-spacing:.04em;background:var(--surface);box-shadow:var(--sub);color:var(--muted)}
.pill.ok{color:var(--ok);background:var(--ok-soft);box-shadow:none}
.pill.warn{color:var(--warn);background:var(--warn-soft);box-shadow:none}
.pill.bad{color:var(--bad);background:var(--bad-soft);box-shadow:none}
.pill.acc{color:var(--accent-ink);background:var(--accent-soft);box-shadow:none}
.tile{background:var(--surface);box-shadow:var(--sub);border-radius:16px;padding:12px 14px}
.tile.in{box-shadow:var(--inset)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mid{font-family:var(--f-display);font-size:24px;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.h1{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.15;letter-spacing:-.025em}
.quote{font-size:18px;line-height:1.55;color:var(--muted);border-left:3px solid var(--accent);padding-left:14px}

.btn{min-height:56px;padding:0 22px;border-radius:16px;font-weight:700;font-size:17px;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--accent-ink);box-shadow:6px 6px 14px var(--sh-d),-6px -6px 14px var(--sh-l);transition:transform .3s cubic-bezier(.4,0,.2,1),box-shadow .3s}
.btn:active{transform:scale(.96);box-shadow:var(--inset)}
.btn.full{width:100%}
.btn.solid{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:#1d1710;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.solid:active{box-shadow:none}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px;border-radius:14px}
.btn.ghost{box-shadow:none;background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* checklist */
.chk{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 12px;border-radius:16px;background:var(--surface);box-shadow:var(--sub);width:100%;text-align:left;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.chk:active{transform:scale(.97)}
.chk .box{width:30px;height:30px;border-radius:10px;box-shadow:var(--inset);display:grid;place-items:center;color:transparent;flex:none;transition:.3s}
.chk.on .box{background:var(--ok);color:#fff;box-shadow:none}
.chk.on .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.chk .t{font-weight:600}
.chk .s{font-size:14px;color:var(--muted);display:block;font-weight:400;text-decoration:none}
.chk.key .box{outline:2px solid var(--accent);outline-offset:2px}

/* ring */
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .trk{stroke:var(--surface2)}
.ring .arc{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.bar{height:16px;border-radius:999px;box-shadow:var(--inset);padding:3px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--sage);transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar.acc>i{background:var(--accent)}
.week{display:flex;align-items:flex-end;gap:8px;height:72px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week .d i{display:block;width:100%;border-radius:8px;background:var(--surface2);min-height:6px;transition:height .6s}
.week .d.t i{outline:2px solid var(--accent)}
.week .d span{font-size:12px;font-weight:700;color:var(--muted)}

/* nav */
nav.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));z-index:40;width:min(440px,calc(100% - 24px));background:var(--surface);border-radius:999px;box-shadow:0 10px 30px var(--sh-d),0 -1px 6px var(--sh-l);display:flex;justify-content:space-around;padding:6px;border:1px solid var(--line)}
.tab{flex:1;min-width:48px;min-height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:700;transition:.3s cubic-bezier(.4,0,.2,1)}
.tab:active{transform:scale(.94)}
.tab.on{background:var(--accent-soft);color:var(--accent-ink);box-shadow:var(--inset)}

/* inputs */
.field{width:100%;min-height:56px;font-size:17px;padding:0 16px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--inset);outline:none;font-weight:600}
.field:focus{outline:2px solid var(--accent)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:14px;background:var(--surface);box-shadow:var(--sub);display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--accent-ink)}
.stepper button:active{transform:scale(.94);box-shadow:var(--inset)}
.stepper input{width:76px;text-align:center;min-height:48px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--inset);font-weight:700;font-size:18px;font-family:var(--f-display)}
.seg{display:flex;padding:4px;border-radius:14px;box-shadow:var(--inset);gap:4px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);box-shadow:var(--sub);color:var(--accent-ink)}
.tog{width:56px;height:32px;border-radius:999px;box-shadow:var(--inset);position:relative;flex:none;transition:.3s}
.tog i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--muted);transition:.3s}
.tog.on i{left:27px;background:var(--accent)}

/* full screens */
.screen{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;padding:calc(var(--safe-t) + 12px) 20px calc(24px + var(--safe-b))}
.screen.on{display:flex}
.screen>.in{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;flex:1}
.stickybar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;margin-top:auto;display:flex;gap:10px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 76px;gap:8px;align-items:center;padding:8px;border-radius:16px}
.setrow.cur{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.setrow.done{background:var(--ok-soft)}
.setrow .n{font-weight:800;color:var(--muted);text-align:center}
.setrow input{width:100%;min-height:60px;text-align:center;font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--inset);font-family:var(--f-display)}
.setrow .ok{min-height:60px;border-radius:12px;background:var(--surface);box-shadow:var(--sub);display:grid;place-items:center;color:var(--muted)}
.setrow.done .ok{background:var(--ok);color:#fff;box-shadow:none}
.mini{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center;letter-spacing:.06em}
.how{font-size:16px;color:var(--muted);line-height:1.55}
.prog{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* overlay/sheet */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.overlay.center{align-items:center}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + var(--safe-b));max-height:90dvh;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:slide .3s cubic-bezier(.4,0,.2,1)}
@keyframes slide{from{transform:translateY(30px);opacity:0}}
.rest{width:calc(100% - 40px);max-width:360px;background:var(--bg);border-radius:28px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.rest .time{font-family:var(--f-display);font-size:60px;font-weight:600;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);z-index:90;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:16px;opacity:0;pointer-events:none;transition:.3s;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:16px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.acc{background:var(--accent-soft);color:var(--accent-ink)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner b{display:block;margin-bottom:2px}
.list>*+*{border-top:1px solid var(--line)}
.li{padding:12px 0;display:flex;align-items:center;gap:12px}
details.fold{border-radius:16px;box-shadow:var(--sub);padding:0 14px}
details.fold summary{list-style:none;min-height:52px;display:flex;align-items:center;justify-content:space-between;font-weight:700;cursor:pointer}
details.fold summary::-webkit-details-marker{display:none}
details.fold[open] summary{border-bottom:1px solid var(--line)}
details.fold .body{padding:12px 0 14px;display:flex;flex-direction:column;gap:10px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--sub);font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.chip.on{color:var(--accent-ink);background:var(--accent-soft);box-shadow:var(--inset)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.food{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px;padding:8px 4px}
.tag{font-size:12px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.svg-chart{width:100%;height:auto;display:block}
.svg-chart text{fill:var(--muted);font-size:12px;font-family:var(--f-ui)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
.field:focus-visible,.setrow input:focus-visible,.stepper input:focus-visible{outline-offset:1px}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--accent);color:#1d1710;padding:10px 16px;border-radius:12px;font-weight:700}
.skip:focus{left:12px}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.chk.on .box{animation:pop .35s cubic-bezier(.2,.9,.3,1.4)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--terra) 14%,var(--surface)),var(--surface) 55%,color-mix(in srgb,var(--accent) 12%,var(--surface)))}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:linear-gradient(135deg,var(--terra),var(--accent));opacity:.10;clip-path:polygon(50% 0,100% 40%,78% 100%,22% 100%,0 40%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.avatar.lg{width:56px;height:56px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}

.big-cta{min-height:68px;font-size:19px;letter-spacing:.04em;border-radius:20px}


/* Tema por Horário */
body.theme-morning { background: linear-gradient(135deg, #ff9a9e, #fecfef) !important; color: #1d1710; }
body.theme-night { background: linear-gradient(135deg, #0f2027, #203a43) !important; color: #fff; }


/* Glassmorphism Header */
.glass-header {
  background: color-mix(in srgb, var(--surface) 75%, transparent) !important;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  padding: 12px 20px !important;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04) !important;
  transition: background 0.3s, border 0.3s;
}


/* --- AURA CORE (Tamagotchi) --- */
.aura-container {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px 0 10px 0;
  position: relative;
}
.aura-core {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #5a7d9a, #1a365d);
  box-shadow: 0 0 15px rgba(90, 125, 154, 0.4), inset -5px -5px 15px rgba(0,0,0,0.5);
  animation: aura-levitate 4s ease-in-out infinite, aura-idle 4s ease-in-out infinite;
  transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  z-index: 2;
}
.aura-core::after {
  content: '';
  position: absolute;
  top: 10%; left: 15%;
  width: 25%; height: 25%;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
  filter: blur(2px);
}

.aura-core.fed {
  width: 90px; height: 90px;
  background: radial-gradient(circle at 35% 35%, #ffd194, #d35400);
  box-shadow: 0 0 30px rgba(211, 84, 0, 0.6), inset -5px -5px 20px rgba(0,0,0,0.4);
  animation: aura-levitate 3s ease-in-out infinite, aura-fed 3s ease-in-out infinite;
}
.aura-core.overdrive {
  width: 110px; height: 110px;
  background: radial-gradient(circle at 35% 35%, #fffc00, #ff0084);
  box-shadow: 0 0 50px rgba(255, 0, 132, 0.8), 0 0 80px rgba(255, 252, 0, 0.4), inset -5px -5px 20px rgba(0,0,0,0.2);
  animation: aura-levitate 1.5s ease-in-out infinite, aura-overdrive 1s ease-in-out infinite;
}

@keyframes aura-levitate {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-10px) scale(1.03); }
}
@keyframes aura-idle {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(0.85); }
}
@keyframes aura-fed {
  0%, 100% { filter: brightness(1.2); }
  50% { filter: brightness(0.9); }
}
@keyframes aura-overdrive {
  0%, 100% { filter: brightness(1.5) contrast(1.1); }
  50% { filter: brightness(1.1) contrast(1.0); }
}

.aura-msg {
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  margin-top: 18px;
  letter-spacing: 0.05em;
  transition: color 0.5s;
  max-width: 220px;
  line-height: 1.4;
}

/* --- ÁGUA e FRASE --- */
.water-hero{align-items:center;gap:16px}
.bottle-wrap{position:relative;width:min(230px,62vw);color:#0b2a3d}
.bottle{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 18px var(--sh-d))}
.wlevel{transition:transform 1.1s cubic-bezier(.3,.8,.3,1)}
.wwave{animation:wv 3.2s linear infinite}
.wwave.b{animation-duration:4.6s;animation-direction:reverse}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(100px)}}
.bub{animation:bub 4s ease-in infinite}
.bub.d2{animation-delay:1.3s}.bub.d3{animation-delay:2.4s}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.6}100%{transform:translateY(-230px);opacity:0}}
.bottle-txt{position:absolute;left:0;right:0;top:52%;text-align:center;pointer-events:none;color:var(--text);text-shadow:0 1px 6px var(--bg),0 0 12px var(--bg)}
.wbtn{flex-direction:column;gap:0;min-height:60px;padding:0 6px;line-height:1.2}
.wbtn span{font-size:13px;font-weight:600;color:var(--muted)}
.wbtn b{font-size:16px;font-variant-numeric:tabular-nums}
.winput{flex:1;min-width:0;min-height:44px;border:0;border-radius:14px;padding:0 14px;background:var(--surface);box-shadow:var(--inset);font-size:17px}
.tab .dropicon{stroke:#5aa9d6;transition:transform .3s}
.tab.on .dropicon{transform:scale(1.12)}
.tab.full .dropicon{filter:drop-shadow(0 0 5px #5aa9d6)}
nav.dock{width:min(480px,calc(100% - 16px));padding:5px}
.tab{min-width:0;font-size:11px;letter-spacing:.01em}
.tab.on{position:relative}
.tab.on::after{content:"";position:absolute;bottom:4px;width:16px;height:3px;border-radius:3px;background:var(--accent)}
.quote-card{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--terra) 12%,var(--surface)),var(--surface) 60%)}
.q-mark{position:absolute;right:14px;top:-18px;font:800 110px/1 var(--f-display);color:var(--accent);opacity:.18;pointer-events:none}
.q-txt{font:600 21px/1.4 var(--f-display);letter-spacing:-.01em;position:relative}


/* --- AURA IA CHAT --- */
.chat-container { display:flex; flex-direction:column; gap:12px; padding:10px 0 80px 0; }
.chat-msg { max-width:85%; padding:10px 14px; border-radius:18px; font-size:15px; line-height:1.4; word-wrap:break-word; }
.chat-msg.user { align-self:flex-end; background:var(--surface); color:var(--text); border:1px solid var(--accent); border-bottom-right-radius:4px; }
.chat-msg.ai { align-self:flex-start; background:var(--surface2); color:var(--text); border-bottom-left-radius:4px; border:1px solid var(--line); }
.chat-msg.ai.typing { opacity:0.7; font-style:italic; }
.chat-msg.img img { max-width:100%; border-radius:8px; margin-top:5px; }
.chat-input-area { position:fixed; bottom:var(--dock-h); left:0; right:0; max-width:600px; margin:0 auto; background:var(--bg); padding:10px 15px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:flex-end; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
.chat-input-area .field { margin:0; padding:10px 15px; border-radius:20px; background:var(--surface); flex:1; max-height:100px; }
.chat-btn { width:40px; height:40px; border-radius:50%; background:var(--surface2); color:var(--text); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.chat-btn.primary { background:var(--accent); color:var(--accent-ink); }

/* --- COMER: refeicoes e arrastar para excluir --- */
.toast.act{pointer-events:auto;cursor:pointer;text-decoration:underline}
.swipe{position:relative;overflow:hidden;border-radius:12px}
.swipe-bg{position:absolute;inset:0;background:var(--bad-soft);color:var(--bad);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700}
.swipe.armed .swipe-bg{background:var(--bad);color:#fff}
.swipe-in{position:relative;background:var(--surface);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;padding:12px 6px}
.list>.swipe+.swipe{border-top:1px solid var(--line)}
.meal .chips{margin:0 -2px}

/* --- DECK e utilidades --- */
.stack{display:flex;flex-direction:column;gap:10px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qtile{padding:16px;align-items:center;text-align:center;gap:4px;background:var(--surface2);cursor:pointer}
.qtile b{font:700 20px var(--f-display)}
.qi{color:var(--accent-ink);display:grid;place-items:center}
.qi .icon{width:26px;height:26px}
.tipcard{background:var(--surface2);border-left:4px solid var(--accent);gap:6px}
.ia-spark{color:var(--accent);animation:aura-levitate 3s infinite}
.ia-spark .icon{width:48px;height:48px}

</style>

  type: "OBJECT",

function fotoDownscale(file, max = 1024) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.8).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Não consegui ler essa imagem.")); };
    img.src = url;
  });
}
function gemErro(status, msg) {
  if (status === 400 && /API key/i.test(msg)) return "Chave inválida. Confira a chave em Mais.";
  if (status === 401 || status === 403) return "A chave foi recusada ou não tem permissão. Confira em Mais.";
  if (status === 404) return "Modelo não encontrado. Em Mais, troque o nome do modelo.";
  if (status === 429) return "Limite de uso da chave atingido. Tente de novo em alguns minutos.";
  return `Erro ${status}: ${msg || "tente de novo."}`;
}
async function fotoAnalisar(file) {
  const key = S.settings.gemKey, model = S.settings.gemModel || GEM_DEFAULT_MODEL;
  openSheet(`<h3 class="mid">Analisando o prato...</h3><p class="muted">Enviando a foto ao Gemini. Costuma levar poucos segundos.</p>`);
  try {
    const data = await fotoDownscale(file);
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
    let r;
    try {
      r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
        method: "POST", signal: ctl.signal,
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({ contents: [{ parts: [{ text: GEM_PROMPT }, { inlineData: { mimeType: "image/jpeg", data } }] }], generationConfig: { responseMimeType: "application/json", responseSchema: GEM_SCHEMA, temperature: 0.2 } })
      });
    } finally { clearTimeout(t); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(gemErro(r.status, j.error && j.error.message));
    const txt = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts && j.candidates[0].content.parts[0].text;
    if (!txt) throw new Error("A IA não devolveu resposta. Tente outra foto.");
    const o = JSON.parse(txt);
    IA.items = (o.itens || []).map(x => ({ nome: String(x.nome || "Item").slice(0, 60), g: Math.round(num(x.gramas)), k: Math.round(num(x.kcal)), p: r1(num(x.proteina_g)) })).filter(x => x.k > 0 || x.g > 0);
    IA.obs = String(o.observacao || "");
    if (!IA.items.length) throw new Error("Não identifiquei comida nessa foto. Tente de novo com o prato inteiro à vista.");
    iaSheet();
  } catch (e) {
    const off = !navigator.onLine || e.name === "TypeError";
    const msg = e.name === "AbortError" ? "Demorou demais. Tente de novo." : off && !e.message.startsWith("Chave") ? "Sem conexão com o Gemini. Registre manualmente pela tabela." : e.message;
    openSheet(`<h3 class="mid">Não deu certo</h3><p class="muted">${esc(msg)}</p><button class="btn full" data-act="close">Fechar</button>`);
  }
}

/* ============ PROGRESSÃO AUTOMÁTICA (carga e sequência de treinos) ============ */
// Regra aplicada ao fim de cada treino, por exercício:
//  - fechou todas as repetições do topo da faixa em todas as séries: sobe um degrau (fora da adaptação)
//  - falhou na 1ª série ou em 2+ séries abaixo do mínimo da faixa: desce um degrau
//  - senão: mantém e busca o topo da faixa
function nextLoad(slot, sets, adapt = inAdapt()) {
  const kg = sets[0] ? sets[0].kg : 0, inc = slot.inc || 0;
  const top = sets.length >= slot.sets && sets.every(s => s.reps >= slot.reps[1]);
  const low = sets.filter(s => s.reps < slot.reps[0]).length;
  const fail = sets.length && (sets[0].reps < slot.reps[0] || low >= 2);
  if (top && inc && !adapt) return { dir: "up", kg: r1(kg + inc), inc, why: "Fechou todas as repetições." };
  if (fail && inc && kg > 0) return { dir: "down", kg: r1(Math.max(0, kg - inc)), inc, why: "Não fechou as repetições." };
  return { dir: "hold", kg, inc: 0, why: top && adapt ? "Adaptação: sem subir ainda." : `Busque ${slot.reps[1]} ${slot.unit ? "s" : "reps"} em todas as séries.` };
}
function stagnant(slot, vid) {
  if (inAdapt()) return null;
  const h = S.logs[vid] || []; if (h.length < 3 || slot.v.length < 2) return null;
  const l = h.slice(-3), same = l.every(x => x.sets[0].kg === l[0].sets[0].kg);

(function () {
  let g = null;
  const snap = (el, x, ms) => { el.style.transition = ms ? `transform ${ms}ms ease` : "none"; el.style.transform = `translateX(${x}px)`; };
  document.addEventListener("pointerdown", e => {
    const el = e.target.closest(".swipe-in"); if (!el) return;
    g = { el, x: e.clientX, y: e.clientY, dx: 0, on: false, id: e.pointerId };
  });
  document.addEventListener("pointermove", e => {
    if (!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.x, dy = e.clientY - g.y;
    if (!g.on) { if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { g = null; return; } if (Math.abs(dx) < 10) return; g.on = true; try { g.el.setPointerCapture(e.pointerId); } catch (x) { } }
    g.dx = dx; snap(g.el, dx, 0);
    g.el.parentNode.classList.toggle("armed", Math.abs(dx) > Math.min(120, g.el.offsetWidth * 0.35));
  });
  const end = e => {
    if (!g || e.pointerId !== g.id) return;
    const { el, dx, on } = g; g = null; if (!on) return;
    const w = el.offsetWidth, i = +el.parentNode.dataset.i;
    if (e.type === "pointerup" && Math.abs(dx) > Math.min(120, w * 0.35)) { snap(el, dx < 0 ? -w : w, 160); setTimeout(() => mealRemove(i), 170); }
    else { snap(el, 0, 200); el.parentNode.classList.remove("armed"); }
  };
  document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);
})();

const gramsFor = (nome, alvoProt) => { const f = FOODS[foodIdx(nome)]; return f ? Math.round(alvoProt / (f[2] / 100)) : 0; };
function getMetabolicAdvice(k) {
  const d = D(k), tg = TG(), tot = dayTotals(k), now = new Date(), h = now.getHours(), endOfDay = 22;
  if (h >= endOfDay) return { diet: "Dia finalizado. Hora de descansar o sistema digestivo.", water: "Beba água com moderação agora para não prejudicar o sono." };
  if (h < 5) return { diet: "Madrugada. Se estiver acordado, mantenha-se hidratado.", water: "Beba água se tiver sede." };

  const remainingProt = Math.max(0, tg.prot - tot.p), hoursLeft = endOfDay - h;
  const mealsLeft = Math.max(1, Math.floor(hoursLeft / 3.5)), protPerMeal = Math.round(remainingProt / mealsLeft);
  const timed = (d.meals || []).filter(m => m.t);
  const lastMealTime = timed.length ? new Date(timed[timed.length - 1].t) : null;
  let dietAdvice;
  if (remainingProt <= 0) dietAdvice = "Meta de proteína batida. Se comer mais tarde, priorize fibras e vegetais.";
  else if (lastMealTime) {
    const diffHrs = (now - lastMealTime) / 36e5;
    if (diffHrs < 2) {
      const nx = new Date(lastMealTime.getTime() + 3.5 * 36e5);
      dietAdvice = `Você comeu há pouco. Próxima refeição sugerida às ${String(nx.getHours()).padStart(2, "0")}:${String(nx.getMinutes()).padStart(2, "0")}. Faltam ${Math.round(remainingProt)} g de proteína no dia.`;
    } else if (diffHrs >= 3.5) dietAdvice = `Já dá para comer de novo. Faltam ${Math.round(remainingProt)} g no dia: tente ${protPerMeal} g na próxima refeição.`;
    else dietAdvice = `Faltam ${Math.round(remainingProt)} g no dia. Sugestão para a próxima refeição: ${protPerMeal} g de proteína.`;
  } else dietAdvice = `Primeira refeição do dia? Faltam ${Math.round(remainingProt)} g. Comece com ${protPerMeal} g de proteína.`;

  if (remainingProt > 0) {
    const t = protPerMeal > 0 ? protPerMeal : Math.round(remainingProt), ovo = FOODS[foodIdx("Ovo de galinha cozido")];
    const li = (a, b) => `<div style="color:var(--muted)">${a}</div>`;
    dietAdvice += `<details class="fold" style="margin-top:12px;background:var(--surface2)"><summary style="font-size:14px;font-weight:600;color:var(--accent-ink)">Como bater ${t} g de proteína?</summary><div class="body" style="font-size:14px;line-height:1.6">
      ${li("~" + gramsFor("Peito de frango grelhado", t) + " g de frango grelhado")}${li("~" + gramsFor("Patinho grelhado", t) + " g de patinho")}
      ${li("~" + Math.round(t / (ovo[2] * ovo[4] / 100)) + " ovos cozidos")}${li("~" + gramsFor("Queijo mussarela", t) + " g de queijo mussarela")}${li("~" + gramsFor("Albumina (pó)", t) + " g de albumina em pó")}
      <div class="muted" style="font-size:13px;margin-top:6px">Valores aproximados pela tabela do app.</div></div></details>`;
  }

  const remainingWater = Math.max(0, (S.settings.waterGoal || 3000) - (d.water || 0));
  let waterAdvice;
  if (remainingWater <= 0) waterAdvice = "Meta de hidratação batida.";
  else { const mlh = Math.round(remainingWater / hoursLeft); waterAdvice = mlh > 600 ? "Você está atrasado na água para este horário. Beba 500 ml agora." : `Ritmo ideal: cerca de ${mlh} ml por hora até as ${endOfDay}h.`; }
  return { diet: dietAdvice, water: waterAdvice };
}

  const ok = d => !days || days.split(",").includes(DAYCODE[d.getDay()]);
  if (c <= now) c.setDate(c.getDate() + 1);
  while (!ok(c)) c.setDate(c.getDate() + 1);
  return c;
}
const icsLocal = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}T${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}00`;
const icsEsc = s => s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
function buildICS(sel) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z/, "Z");
  const ev = sel.map(({ id, t }) => {
    const r = REMS.find(x => x[0] === id), days = r[3], st = nextStart(days, t), en = new Date(st.getTime() + 10 * 60000);
    const title = REM_TITLE[id] || "Still I Rise: água";
    return ["BEGIN:VEVENT", `UID:sir-${id}@still-i-rise`, `DTSTAMP:${stamp}`, `DTSTART:${icsLocal(st)}`, `DTEND:${icsLocal(en)}`,
      `RRULE:FREQ=${days ? "WEEKLY;BYDAY=" + days : "DAILY"}`, `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(r[4])}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(title)}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT"].join("\r\n");
  });
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Still I Rise//PT-BR//", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Still I Rise", ...ev, "END:VCALENDAR"].join("\r\n") + "\r\n";
}

/* ============ NUVEM: cópia dos dados em um gist secreto do GitHub + estado sem segredos ============ */

const GIST_FILE = "still-i-rise.json", SECRETS = ["gemKey", "ghToken"];

const ghHead = () => ({ Authorization: "Bearer " + S.settings.ghToken, Accept: "application/vnd.github+json", "Content-Type": "application/json" });

  try {
    const r = await fetch("https://api.github.com/gists/" + encodeURIComponent(S.settings.ghGistId), { headers: ghHead() }), j = await r.json();
    if (!r.ok) throw new Error(j.message || r.status);

"use strict";
/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const fmtKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => fmtKey(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return fmtKey(d); };
const diffDays = (a, b) => Math.round((parseKey(a) - parseKey(b)) / 864e5);
const mondayOf = k => { const d = parseKey(k); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return fmtKey(d); };
const ic = (n, c = "") => `<svg class="icon ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const num = (v, d = 0) => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? d : n; };
const r1 = n => Math.round(n * 10) / 10;
const DOW = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"];
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const dispDate = k => { const d = parseKey(k); return `${pad(d.getDate())} ${MESES[d.getMonth()]}`; };
const fmtInt = n => Math.round(n).toLocaleString("pt-BR");

/* ============ estado e persistência (3 camadas) ============ */
const KEY = "sir_v1";
const defaults = () => ({
  v: 1,
  profile: { name: "Hobert", startWeight: 140, goal: 105, height: 179, age: 24 },
  weights: [], days: {}, logs: {}, sel: {}, pain: [], neck: [], cur: null, chat: [], favs: {},
  settings: { theme: "auto", start: today(), logMode: "set", rotate: true, lastBackup: null, notif: false, calcWeight: 140, waterGoal: 3000, gemKey: "", gemModel: "gemini-2.5-flash-lite", gemAck: false }
});
let S = null;
const mergeDefaults = o => { const d = defaults(); const s = Object.assign(d, o || {}); s.profile = Object.assign(d.profile, (o || {}).profile); s.settings = Object.assign(defaults().settings, (o || {}).settings); return s; };

const IDB = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open("sir-db", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async put(v) { try { const db = await this.open(); db.transaction("kv", "readwrite").objectStore("kv").put(v, "state"); } catch (e) { } },
  async get() { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get("state"); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } }
};
let idbTimer = null;
function save() {
  const j = JSON.stringify(S);
  try { localStorage.setItem(KEY, j); } catch (e) { }
  clearTimeout(idbTimer); idbTimer = setTimeout(() => IDB.put(j), 300);
  cloudQueue();
}

/* ============ dia / hábitos ============ */
const newDay = () => ({ h: {}, s: {}, water: 0, meals: [] });
const D = k => S.days[k] || newDay();
function DW(k) { if (!S.days[k]) S.days[k] = newDay(); return S.days[k]; }
const hasData = d => d && (Object.values(d.h || {}).some(Boolean) || Object.values(d.s || {}).some(Boolean) || d.water > 0 || (d.meals || []).length);
const habitCount = k => Object.values(D(k).h).filter(Boolean).length;
const isActive = k => { const h = D(k).h; return !!h.acucar && habitCount(k) >= 3; };
const firstDay = () => { const ks = Object.keys(S.days).filter(k => hasData(S.days[k])); ks.push(S.settings.start); return ks.sort()[0]; };
function dayStreak() { let k = today(); if (!isActive(k)) k = addDays(k, -1); let n = 0; const f = firstDay(); while (k >= f && isActive(k)) { n++; k = addDays(k, -1); } return n; }
const activeInWeek = mk => { let n = 0; for (let i = 0; i < 7; i++) if (isActive(addDays(mk, i))) n++; return n; };
function weekStreak() {
  const cur = mondayOf(today()), first = mondayOf(firstDay());
  let n = activeInWeek(cur) >= 5 ? 1 : 0, reds = 0;
  for (let mk = addDays(cur, -7); mk >= first; mk = addDays(mk, -7)) {
    const a = activeInWeek(mk);
    if (a >= 5) { n++; reds = 0; } else if (a === 4) { reds = 0; } else { reds++; if (reds >= 2) break; }
  }
  return n;
}
function daysAbsent() {
  const ks = Object.keys(S.days).filter(k => hasData(S.days[k])).concat(S.weights.map(w => w.d));
  if (S.cur) return 0;
  const hasLogs = Object.values(S.logs).some(a => a.length);
  if (hasLogs) Object.values(S.logs).forEach(a => a.forEach(l => ks.push(l.date)));
  if (!ks.length) return 0;
  ks.sort(); return Math.max(0, diffDays(today(), ks[ks.length - 1]));
}
const weekNo = () => Math.floor(diffDays(mondayOf(today()), mondayOf(S.settings.start)) / 7) + 1;
const inAdapt = () => weekNo() <= 2;

/* ============ metas nutricionais (Mifflin-St Jeor) ============ */
const curWeight = () => S.weights.length ? S.weights[S.weights.length - 1].kg : S.profile.startWeight;
function targets(w) {
  const p = S.profile;
  const tmb = 10 * w + 6.25 * p.height - 5 * p.age + 5;
  const tdee = tmb * 1.375;
  const kcal = Math.max(1800, Math.round((tdee - 1000) / 50) * 50);
  return { tmb: Math.round(tmb), tdee: Math.round(tdee), kcal, prot: Math.round(1.2 * w / 5) * 5 };
}
const TG = () => targets(S.settings.calcWeight);
const dayTotals = k => D(k).meals.reduce((a, m) => ({ k: a.k + m.k, p: a.p + m.p }), { k: 0, p: 0 });

/* ============ treino: helpers ============ */
const dayLetter = k => { const w = parseKey(k).getDay(); return w >= 1 && w <= 5 ? DAY_ORDER[w - 1] : null; };
const findV = (slot, vid) => slot.v.find(x => x[0] === vid) || slot.v[0];
function varId(slot) {
  if (S.sel[slot.id]) return S.sel[slot.id];
  if (S.settings.rotate && !inAdapt()) return slot.v[Math.floor((weekNo() - 3) / 4) % slot.v.length][0];
  return slot.v[0][0];
}
const estMin = L => { const p = PLAN[L]; let s = p.cuff ? 8 : 5; p.ex.forEach(e => s += e.sets * (45 + e.rest) / 60); return Math.round(s / 5) * 5 + 10; };
function prefill(slot, vid) {
  const hist = S.logs[vid] || [], last = hist[hist.length - 1];
  const out = []; let hint = "Sem histórico: escolha uma carga leve.";
  if (last) {
    const nx = nextLoad(slot, last.sets), delta = nx.kg - (last.sets[0] ? last.sets[0].kg : 0);
    for (let i = 0; i < slot.sets; i++) { const ls = last.sets[i] || last.sets[last.sets.length - 1]; out.push({ kg: r1(Math.max(0, ls.kg + delta)), reps: nx.dir === "up" ? slot.reps[0] : nx.dir === "down" ? slot.reps[0] : ls.reps, done: false }); }
    hint = `Última vez (${dispDate(last.date)}): ${last.sets.map(s => `${s.kg}×${s.reps}`).join(" · ")} → ${nx.dir === "up" ? `hoje +${nx.inc} kg` : nx.dir === "down" ? `hoje −${nx.inc} kg` : "mantenha a carga"}. ${nx.why}`;
  } else for (let i = 0; i < slot.sets; i++) out.push({ kg: 0, reps: slot.reps[0], done: false });
  return { sets: out, hint };
}
function deloadSignal() {
  let n = 0;
  DAY_ORDER.forEach(L => PLAN[L].ex.forEach(slot => slot.v.forEach(v => {
    const h = S.logs[v[0]] || []; if (h.length < 2) return;
    const [a, b] = h.slice(-2);
    const fail = l => l.sets.some(s => s.reps < slot.reps[0]);
    if (fail(a) && fail(b) && a.sets[0].kg === b.sets[0].kg) n++;
  })));
  return n >= 3;
}
const painAvg = () => { const l = S.pain.slice(-3); return l.length >= 3 ? l.reduce((a, b) => a + b.v, 0) / 3 : null; };
const weekVolume = () => { let push = 0, pull = 0; DAY_ORDER.forEach(L => PLAN[L].ex.forEach(e => { push += (e.push || 0); pull += (e.pull || 0); })); return { push, pull }; };

/* ============ UI base ============ */
const UI = { tab: "deck", cat: "Todos", q: "", meal: "Café da manhã", supSort: "price", supType: "all", pickDay: null };
let toastT = null;
function toast(t, fn) { const e = $("#toast"); e.textContent = t; e.onclick = fn ? () => { clearTimeout(toastT); e.classList.remove("on", "act"); fn(); } : null; e.classList.toggle("act", !!fn); e.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("on", "act"), fn ? 5000 : 2600); }

  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { const e = $("#persist"); if (e) e.textContent = p ? "Armazenamento persistente ativo." : "Armazenamento persistente não concedido: exporte backups."; });
}

/* ============ ações ============ */
function exportData() {
  const blob = new Blob([JSON.stringify(safeState(), null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `still-i-rise-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  S.settings.lastBackup = today(); save(); toast("Backup exportado."); render();
}
function weighSheet() {
  const k = today(), y = !isActive(addDays(k, -1)) && S.weights.length;
  openSheet(`<h3 class="mid">Registrar peso</h3>
  <p class="muted">Ao acordar, depois do banheiro, antes de comer. Sempre nas mesmas condições.</p>
  ${y ? banner("warn", "info", "Ontem foi um dia difícil", "O número pode estar inflado por sódio e água. Se puder, espere a próxima segunda.") : ""}
  <label class="lbl">Peso (kg)</label><input class="field" id="wkg" inputmode="decimal" placeholder="${r1(curWeight())}">
  <label class="lbl">Cintura (cm, opcional)</label><input class="field" id="wwaist" inputmode="decimal" placeholder="ex.: 128">
  <button class="btn solid full" data-act="weigh-save">SALVAR</button>`);
}
function profileSheet() {
  const p = S.profile;
  openSheet(`<h3 class="mid">Perfil</h3>
  <label class="lbl">Nome</label><input class="field" id="pn" value="${esc(p.name)}">
  <div class="grid2"><div><label class="lbl">Peso inicial (kg)</label><input class="field" id="ps" inputmode="decimal" value="${p.startWeight}"></div><div><label class="lbl">Meta (kg)</label><input class="field" id="pg" inputmode="decimal" value="${p.goal}"></div><div><label class="lbl">Altura (cm)</label><input class="field" id="ph" inputmode="numeric" value="${p.height}"></div><div><label class="lbl">Idade</label><input class="field" id="pa" inputmode="numeric" value="${p.age}"></div></div>
  <button class="btn solid full" data-act="profile-save">SALVAR</button>`);
}
function quickSheet() {
  openSheet(`<h3 class="mid">Adicionar por rótulo</h3>
  <input class="field" id="qn" placeholder="Nome (ex.: Barra de proteína)">
  <div class="grid2"><input class="field" id="qk" inputmode="decimal" placeholder="kcal totais"><input class="field" id="qp" inputmode="decimal" placeholder="proteína (g)"></div>
  <div class="chips">${["Café da manhã", "Almoço", "Lanche", "Jantar", "Ceia"].map(m => `<button class="chip ${UI.meal === m ? "on" : ""}" data-act="meal-sel" data-m="${m}">${m}</button>`).join("")}</div>
  <button class="btn solid full" data-act="quick-add">ADICIONAR</button>`);
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
  const t = e.target.closest("[data-tab]"); if (t) return go(t.dataset.tab);
  const b = e.target.closest("[data-act]"); if (!b) { if (e.target.id === "sheet") closeSheet(); return; }
  const a = b.dataset.act, k = today(), c = S.cur;
  if (ACT[a]) return ACT[a](b, e);
  switch (a) {
    case "habit": {
      const d = DW(k), wasA = isActive(k), wasW = activeInWeek(mondayOf(k)) >= 5; d.h[b.dataset.id] = !d.h[b.dataset.id]; save(); render(); haptic();
      if (!wasA && isActive(k)) toast(activeInWeek(mondayOf(k)) >= 5 && !wasW ? "Meta da semana cumprida. Isso é ritmo." : "Dia ativo. Este dia conta.");
      break;
    }
    case "supp": { const d = DW(k); d.s[b.dataset.id] = !d.s[b.dataset.id]; save(); render(); haptic(); break; }
    case "water": waterAdd(num(b.dataset.ml)); render(); break;
    case "wk-skip": DW(k).skipWk = true; save(); render(); break;
    case "wk-unskip": DW(k).skipWk = false; save(); render(); break;
    case "pickday": UI.pickDay = b.dataset.day; render(); break;
    case "tog-rotate": S.settings.rotate = !S.settings.rotate; save(); render(); break;
    case "wk-start": wkStart(b.dataset.day); break;
    case "wk-resume": wkOpen(); break;
    case "wk-back": case "wk-exit": wkClose(); break;
    case "wk-prev": if (c.i > 0) { c.i--; save(); wkRender(); } break;
    case "wk-next": wkNext(); break;
    case "wk-mode": c.mode = c.mode === "set" ? "end" : "set"; S.settings.logMode = c.mode; save(); wkRender(); break;
    case "wk-warmset": { const st = stepsOf(c.day)[c.i], dd = wkData(st), i = +b.dataset.i; dd.sets[i].done = !dd.sets[i].done; save(); wkRender(); break; }
    case "wk-set": {
      const st = stepsOf(c.day)[c.i], dd = wkData(st), i = +b.dataset.i, s = dd.sets[i]; s.done = !s.done; save(); wkRender(); haptic(15);
      if (s.done && i < dd.sets.length - 1) startRest(st.e.rest, `Próxima: série ${i + 2} de ${dd.sets.length}`);
      else if (s.done) { const st2 = stepsOf(c.day); const nx = st2[c.i + 1]; if (nx) startRest(60, `Próximo: ${nx.t === "warm" ? nx.c.name : findV(nx.e, varId(nx.e))[1]}`); }
      break;
    }
    case "goto-treino": UI.pickDay = b.dataset.day; go("treino"); break;
    case "sum-next": if (["A", "D", "E"].includes(b.dataset.day)) painSheet(b.dataset.day); else closeSheet(); render(); break;
    case "wk-adj": { const st = stepsOf(c.day)[c.i], dd = wkData(st), f = b.dataset.f, d = num(b.dataset.d), p = dd.sets.findIndex(x => !x.done); if (p < 0) break; for (let i = p; i < dd.sets.length; i++) if (!dd.sets[i].done) dd.sets[i][f] = Math.max(0, r1(num(dd.sets[i][f]) + d)); save(); wkRender(); haptic(); break; }
    case "wk-allset": { const st = stepsOf(c.day)[c.i], dd = wkData(st); dd.sets.forEach(s => s.done = true); save(); notify("Exercício registrado", "Próximo exercício."); wkNext(); break; }
    case "wk-var": { const st = stepsOf(c.day)[c.i]; S.sel[st.e.id] = b.dataset.v; delete c.data[st.e.id]; save(); wkRender(); break; }
    case "rest-adj": { const s = num(b.dataset.s); if (RT.paused !== null) RT.paused = Math.max(1, RT.paused + s); else RT.end += s * 1000; RT.total = Math.max(1, RT.total + s); restDraw(); break; }
    case "rest-pause": if (RT.paused === null) RT.paused = restLeft(); else { RT.end = Date.now() + RT.paused * 1000; RT.paused = null; } restDraw(); break;
    case "rest-skip": closeRest(); break;
    case "pain": S.pain.push({ d: today(), day: S.days[today()]?.wk || "", v: +b.dataset.v }); save(); closeSheet(); toast(`Dor ${b.dataset.v}/10 registrada.`); if (painAvg() >= 4) toast("Média de dor ≥ 4: procure um fisioterapeuta."); break;
    case "close": closeSheet(); break;
    case "cat": UI.cat = b.dataset.c; rComer(); break;
    case "food": if (b.dataset.m) UI.meal = b.dataset.m; foodSheet(+b.dataset.i); break;
    case "meal-sel": UI.meal = b.dataset.m; $$("[data-act=meal-sel]").forEach(x => x.classList.toggle("on", x.dataset.m === UI.meal)); { const fb = $("#favbtn"); if (fb) fb.outerHTML = favBtn(+fb.dataset.i); } break;
    case "g-adj": { const inp = $("#g"); inp.value = Math.max(0, num(inp.value) + num(b.dataset.s)); gSum(+inp.dataset.i); break; }
    case "g-set": { const inp = $("#g"); inp.value = b.dataset.g; gSum(+inp.dataset.i); break; }
    case "food-add": { const f = FOODS[+b.dataset.i], gm = num($("#g").value); if (gm <= 0) return; const d = DW(k); d.meals.push({ t: Date.now(), n: f[0], g: gm, k: f[1] * gm / 100, p: f[2] * gm / 100, m: UI.meal }); if (f[5] === "Bebidas" && /COM açúcar/.test(f[0])) d.h.acucar = false; save(); closeSheet(); render(); toast("Adicionado."); break; }
    case "meal-del": { DW(k).meals.splice(+b.dataset.i, 1); save(); render(); break; }
    case "quick": quickSheet(); break;
    case "quick-add": { const kc = num($("#qk").value), pr = num($("#qp").value), nm = $("#qn").value.trim() || "Item de rótulo"; if (kc <= 0) return toast("Informe as kcal."); DW(k).meals.push({ t: Date.now(), n: nm, g: 0, k: kc, p: pr, m: UI.meal }); save(); closeSheet(); render(); break; }
    case "weigh": weighSheet(); break;
    case "weigh-save": {
      const kg = num($("#wkg").value), waist = num($("#wwaist").value); if (kg < 40 || kg > 300) return toast("Peso inválido.");
      S.weights = S.weights.filter(x => x.d !== k); S.weights.push({ d: k, kg: r1(kg), waist: waist || null }); S.weights.sort((x, y) => x.d < y.d ? -1 : 1);
      let msg = "Peso registrado.";
      if (Math.abs(kg - S.settings.calcWeight) >= 4) { S.settings.calcWeight = r1(kg); msg = `Peso registrado. Metas recalculadas: ${fmtInt(TG().kcal)} kcal e ${TG().prot} g de proteína.`; }
      save(); closeSheet(); render(); toast(msg); break;
    }
    case "neck": S.neck = S.neck.filter(n => n.d !== k); S.neck.push({ d: k, v: +b.dataset.v }); save(); render(); break;
    case "profile": profileSheet(); break;
    case "profile-save": { const p = S.profile; p.name = $("#pn").value.trim() || p.name; p.startWeight = num($("#ps").value, p.startWeight); p.goal = num($("#pg").value, p.goal); p.height = num($("#ph").value, p.height); p.age = num($("#pa").value, p.age); if (!S.weights.length) S.settings.calcWeight = p.startWeight; save(); closeSheet(); render(); break; }
    case "sup-sort": UI.supSort = b.dataset.v; rMais(); break;
    case "sup-type": UI.supType = b.dataset.v; rMais(); break;
    case "theme": S.settings.theme = b.dataset.v; save(); applyTheme(); rMais(); break;
    case "logmode": S.settings.logMode = b.dataset.v; save(); rMais(); break;
    case "notif": {
      if (S.settings.notif) { S.settings.notif = false; save(); rMais(); break; }
      if (!("Notification" in window)) return toast("Este navegador não suporta notificações.");
      Notification.requestPermission().then(p => { S.settings.notif = p === "granted"; save(); rMais(); toast(p === "granted" ? "Notificações ativadas." : "Permissão negada."); });
      break;
    }
    case "foto": fotoIniciar(); break;
    case "gem-save": { const kEl = $("#gemKey"), mEl = $("#gemModel"), kv = kEl ? kEl.value.trim() : null, mv = mEl ? mEl.value.trim() : null; if (kv) S.settings.gemKey = kv; if (mv) S.settings.gemModel = mv; save(); render(); toast(kv ? "Chave configurada." : "Modelo atualizado."); break; }
    case "gem-clear": S.settings.gemKey = ""; S.settings.gemAck = false; save(); rMais(); toast("Chave removida."); break;
    case "ia-del": IA.items.splice(+b.dataset.i, 1); if (!IA.items.length) closeSheet(); else iaSheet(); break;
    case "ia-add": { const d = DW(k); IA.items.forEach(x => d.meals.push({ t: Date.now(), n: "IA: " + x.nome, g: x.g, k: x.k, p: x.p, m: UI.meal })); save(); closeSheet(); render(); toast("Adicionado. Lembre: é estimativa."); haptic(); break; }
    case "recent": recenteSheet(+b.dataset.i); break;
    case "recent-add": { const m = IA.rec; if (!m) break; DW(k).meals.push({ t: Date.now(), n: m.n, g: m.g, k: m.k, p: m.p, m: UI.meal }); save(); closeSheet(); render(); toast("Adicionado."); haptic(); break; }
    
    case "gh-save": {
        const tEl = document.getElementById("ghToken"), gEl = document.getElementById("ghGistId");
        const tVal = tEl ? tEl.value.trim() : "";
        if (tVal && tVal !== "********") S.settings.ghToken = tVal;
        else if (!tVal) S.settings.ghToken = "";
        
        const gVal = gEl ? gEl.value.trim() : "";
        S.settings.ghGistId = gVal;
        
        save();
        toast("Nuvem configurada!");
        render();
        if (S.settings.ghToken && !S.settings.ghGistId) {
            syncToCloud(true);
        } else if (S.settings.ghToken && S.settings.ghGistId) {
            syncToCloud(true);
        }
        break;
    }
    case "gh-sync": {
        syncFromCloud();
        break;
    }

    case "export": exportData(); break;
    case "import": $("#file").click(); break;
    case "reset": if (confirm("Apagar TODOS os dados deste aparelho? Exporte um backup antes.")) { S = defaults(); save(); go("deck"); toast("Dados apagados."); } break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#sheet").classList.contains("on")) closeSheet();
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "ia-input") { e.preventDefault(); ACT["ia-send"](); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.ia !== undefined) { const f = t.dataset.ia, it = IA.items[+t.dataset.i]; if (it) { it[f] = f === "nome" ? t.value : num(t.value); iaTotal(); } }
  else if (t.id === "ia-input") { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
  else if (t.id === "q") { UI.q = t.value; $("#foodlist").innerHTML = foodListHTML(); }
  else if (t.id === "g") gSum(+t.dataset.i);
  else if (t.dataset.f && S.cur) { const st = stepsOf(S.cur.day)[S.cur.i], dd = st.t === "ex" ? S.cur.data[st.e.id] : null; if (dd) { dd.sets[+t.dataset.i][t.dataset.f] = num(t.value); save(); } }
});
document.addEventListener("change", e => {
  if (e.target.id === "ia-foto") return iaFoto(e);
  if (e.target.id === "foto") { const f = e.target.files[0]; e.target.value = ""; if (f) fotoAnalisar(f); return; }
  if (e.target.id !== "file") return;
  const f = e.target.files[0]; if (!f) return;
  f.text().then(tx => { const o = JSON.parse(tx); if (!o || typeof o !== "object" || !o.profile || !o.days) throw 0; if (!confirm("Importar substitui os dados atuais deste aparelho. Continuar?")) return; const keep = {}; ["gemKey", "ghToken", "ghGistId"].forEach(k => keep[k] = S.settings[k]); S = mergeDefaults(o); Object.assign(S.settings, keep); save(); applyTheme(); go("deck"); toast("Backup importado."); }).catch(() => toast("Arquivo inválido."));
  e.target.value = "";
});
$("#themeBtn").addEventListener("click", () => { const dark = document.documentElement.dataset.theme === "dark"; S.settings.theme = dark ? "light" : "dark"; save(); applyTheme(); if (UI.tab === "mais") rMais(); });
matchMedia("(prefers-color-scheme:dark)").addEventListener && matchMedia("(prefers-color-scheme:dark)").addEventListener("change", () => S && applyTheme());
document.addEventListener("visibilitychange", () => { if (!document.hidden && S) { if (RT.iv && $("#rest").classList.contains("on")) restTick(); if (S.cur && $("#screen-wk").classList.contains("on")) { try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => wakeLock = l).catch(() => { }); } catch (e) { } } if (UI.tab === "deck") rDeck(); } });

/* ============ init ============ */
(async function init() {
  await loadState(); applyTheme();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { navigator.serviceWorker.register("sw.js").catch(() => { }); let had = !!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange", () => { if (had && !sessionStorage.getItem("sir_reloaded")) { sessionStorage.setItem("sir_reloaded", "1"); location.reload(); } had = true; }); }
  applyTimeTheme(); tickHeader(); go("deck");
  if (S.cur) toast("Treino em andamento. Abra pelo Deck.");
  setTimeout(maybeReview, 1000);
})();

</script>
